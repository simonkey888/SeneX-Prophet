name: ARQ Emergency Rollback

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-emergency-rollback.yml

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: northflank-readonly-audit
    steps:
      - name: Restore recorded pre-mission build
        shell: bash
        env:
          NORTHFLANK_SENEX_MAINTENANCE_TOKEN: ${{ secrets.NORTHFLANK_SENEX_MAINTENANCE_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_SENEX_MAINTENANCE_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_SENEX_MAINTENANCE_TOKEN}"
          mkdir -p evidence
          python - <<'PY'
          import datetime,hashlib,json,os,time,urllib.error,urllib.request
          base='https://api.northflank.com/v1'; token=os.environ['NORTHFLANK_SENEX_MAINTENANCE_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'senex-emergency-rollback/1'}
          project='seneciobot'; service='senecio-h011'; rollback_build='reach-page-2757'; rollback_sha='2f8503533543832147caf4c8e97a0cc6f5af3cbc'; branch='feat/h011-v3-discovery-refresh'
          out={'started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rollback_build_id':rollback_build,'rollback_sha':rollback_sha,'requests':[],'secret_values_exported':False,'safety':{'paper_only':True,'orders_enabled':False,'live_capital_locked':True}}
          def call(method,route,payload=None,label=None):
              body=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(base+route,headers=headers,data=body,method=method); raw=b''; status=0
              try:
                  with urllib.request.urlopen(req,timeout=60) as r: status=r.status; raw=r.read()
              except urllib.error.HTTPError as exc: status=exc.code; raw=exc.read()
              digest=hashlib.sha256(raw).hexdigest(); out['requests'].append({'label':label or route,'method':method,'path':route,'status':status,'bytes':len(raw),'body_sha256':digest})
              try: obj=json.loads(raw.decode() or '{}')
              except Exception: obj={'non_json':True}
              if not 200<=status<300: raise SystemExit(f'{method} {route} status={status} sha256={digest}')
              return obj.get('data',obj) if isinstance(obj,dict) else obj
          before=call('GET',f'/projects/{project}/services/{service}/deployment',label='deployment_before')
          out['before']={'instances':before.get('instances'),'build_id':(before.get('internal') or {}).get('buildId'),'sha':(before.get('internal') or {}).get('deployedSHA')}
          if out['before']['build_id']!=rollback_build or out['before']['sha']!=rollback_sha:
              call('POST',f'/projects/{project}/services/{service}/deployment',{'internal':{'id':service,'branch':branch,'buildId':rollback_build},'docker':{'configType':'default'}},'rollback_deploy')
          call('POST',f'/projects/{project}/services/{service}/scale',{'instances':1},'scale_one')
          deadline=time.time()+1200; final=None
          while time.time()<deadline:
              final=call('GET',f'/projects/{project}/services/{service}/deployment',label='deployment_poll')
              internal=final.get('internal') or {}
              if int(final.get('instances',0))==1 and internal.get('buildId')==rollback_build and internal.get('deployedSHA')==rollback_sha:
                  break
              time.sleep(10)
          else: raise SystemExit('rollback deployment did not stabilize')
          out['result']={'status':'PASS','instances':final.get('instances'),'build_id':(final.get('internal') or {}).get('buildId'),'deployed_sha':(final.get('internal') or {}).get('deployedSHA')}
          # Validate public state after rollback.
          public='https://h011-web--senecio-h011--wbjggn89fnf8.code.run/api/v3/state'; public_result=None
          deadline=time.time()+900
          while time.time()<deadline:
              try:
                  req=urllib.request.Request(public,headers={'User-Agent':'senex-emergency-rollback-public/1'},method='GET')
                  with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); status=r.status
                  obj=json.loads(raw.decode())
                  candidate=obj.get('code_sha') or obj.get('source_sha') or obj.get('sha') or (obj.get('provenance') or {}).get('code_sha')
                  if status==200 and candidate==rollback_sha and obj.get('paper_only') is True and obj.get('orders_enabled') is False and obj.get('live_capital_locked') is True:
                      public_result={'status':status,'body_sha256':hashlib.sha256(raw).hexdigest(),'code_sha':candidate,'paper_only':True,'orders_enabled':False,'live_capital_locked':True}; break
              except Exception: pass
              time.sleep(10)
          if not public_result: raise SystemExit('public rollback validation failed')
          out['public']=public_result; out['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          encoded=json.dumps(out,sort_keys=True,indent=2).encode()+b'\n'; open('evidence/emergency_rollback.json','wb').write(encoded); open('evidence/SHA256SUMS','w').write(hashlib.sha256(encoded).hexdigest()+'  emergency_rollback.json\n')
          print(json.dumps({'result':out['result'],'public':out['public'],'secret_values_exported':False},sort_keys=True))
          PY
          (cd evidence && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-emergency-rollback-${{ github.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
