name: SENEX 021 Finalize After Regression

on:
  push:
    branches:
      - feat/senex-real-data-evidence-campaign-v1

permissions:
  contents: write

concurrency:
  group: senex-021-finalize-after-regression
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Prove lane and retire temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/senex-real-data-evidence-campaign-v1"
          git merge-base --is-ancestor d00d9f7a97209cc0eca8ac327c830a919e027f67 HEAD
          test "$(git rev-parse d00d9f7a97209cc0eca8ac327c830a919e027f67^{tree})" = "7fe5ad20f4f7b4964492775d0d2ebf85510250c8"
          git rm -f .github/workflows/senex-021-finalize-after-regression.yml
          if git ls-files --error-unmatch .github/workflows/senex-021-governance-diagnose2.yml >/dev/null 2>&1; then
            git rm -f .github/workflows/senex-021-governance-diagnose2.yml
          fi
          if git ls-files --error-unmatch __nonexistent__ >/dev/null 2>&1; then exit 91; fi
          git add -A

      - name: Install exact hashed CI lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r polymarket/requirements-h011-v3.txt

      - name: Verify evidence and paper safety before regression
        shell: bash
        run: |
          set -euo pipefail
          (cd research/real_data_021/materialized && sha256sum -c dataset_manifest.json.sha256)
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/paper.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/paper.json'))
          assert r['status']=='PASS'
          assert len(r.get('findings',[]))==0
          assert r.get('secret_values_observed') is False
          print('PAPER_ONLY_REPOSITORY=PASS')
          PY

      - name: Run complete regression before final governance generation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          git add -A
          echo "POST_REGRESSION_LIFECYCLE_SHA256=$(sha256sum polymarket/results/v3/lifecycle.jsonl | awk '{print $1}')"

      - name: Generate governance last and prove deterministic
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_repository_contract.py --root . --generate > /tmp/generate-1.json
          git add -A
          files=(governance/target_architecture.yaml governance/component_registry.json governance/migration_map.json governance/repository_manifest.json governance/repository_manifest.json.sha256)
          sha256sum "${files[@]}" > /tmp/first.hashes
          cp governance/repository_manifest.json /tmp/manifest.first
          python tools/verify_repository_contract.py --root . --generate > /tmp/generate-2.json
          cmp /tmp/manifest.first governance/repository_manifest.json
          sha256sum "${files[@]}" > /tmp/second.hashes
          cmp /tmp/first.hashes /tmp/second.hashes
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          git add -A
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('governance/repository_manifest.json').read_text())
          tracked=[x for x in subprocess.check_output(['git','ls-files'],text=True).splitlines() if x]
          assert m['files_tracked_total']==len(tracked)
          assert {x['path'] for x in m['files']}==set(tracked)
          rec=next(x for x in m['files'] if x['path']=='polymarket/results/v3/lifecycle.jsonl')
          import hashlib
          raw=Path('polymarket/results/v3/lifecycle.jsonl').read_bytes()
          assert rec['sha256']==hashlib.sha256(raw).hexdigest()
          assert '__nonexistent__' not in {x['path'] for x in m['files']}
          print('FINAL_GOVERNANCE_MATCHES_POST_REGRESSION_TREE=YES')
          PY

      - name: Commit final 021 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SENEX ARQ 021"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(021): finalize governance after regression evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "FINALIZE_HEAD=$(git rev-parse HEAD)"
          echo "FINALIZE_TREE=$(git rev-parse HEAD^{tree})"
