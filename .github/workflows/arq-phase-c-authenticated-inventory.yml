name: ARQ Phase C Authenticated Inventory

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-phase-c-authenticated-inventory.yml

permissions:
  contents: read

env:
  NF_API: https://api.northflank.com/v1
  PRODUCT_BRANCH: feat/h011-v3-discovery-refresh
  EXPECTED_PRODUCT_SHA: d5047b2055d30d199954dd4e68ae2e676aa8a4ba

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: northflank-readonly-audit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify authority and credential presence
        shell: bash
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          product_remote="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/${PRODUCT_BRANCH} | awk '{print $1}')"
          test "$product_remote" = "$EXPECTED_PRODUCT_SHA"
          printf 'TOKEN_PRESENT=YES\nPRODUCT_SHA=%s\n' "$product_remote"
      - name: Execute GET-only sanitized inventory
        shell: bash
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import datetime, hashlib, json, os, re, urllib.error, urllib.parse, urllib.request
          API=os.environ['NF_API'].rstrip('/')
          token=os.environ['NORTHFLANK_API_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'senex-arq-phase-c/1'}
          out={'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'api_base':API,'requests':[],'objects':{},'auth':{}}
          sensitive=re.compile(r'(secret|token|password|credential|private|runtimeenvironment|buildarguments|buildfiles|runtimefiles|dockersecretmounts)',re.I)
          def scrub(v,key=''):
              if isinstance(v,dict):
                  if sensitive.search(key):
                      return {'names':sorted(map(str,v.keys())),'values_redacted':True}
                  return {str(k):scrub(val,str(k)) for k,val in v.items() if str(k).lower() not in {'value','data','content'}}
              if isinstance(v,list): return [scrub(x,key) for x in v]
              if sensitive.search(key) and v is not None: return '<redacted>'
              return v
          def get(path,label):
              url=API+path
              req=urllib.request.Request(url,headers=headers,method='GET')
              status=None; body=b''
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      status=r.status; body=r.read()
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read()
              digest=hashlib.sha256(body).hexdigest()
              rec={'label':label,'method':'GET','path':path,'status':status,'body_sha256':digest,'bytes':len(body)}
              out['requests'].append(rec)
              try: parsed=json.loads(body.decode() or '{}')
              except Exception: parsed={'non_json':True}
              out['objects'][label]=scrub(parsed)
              return status,parsed
          status,projects=get('/projects?per_page=100','projects')
          if status!=200: raise SystemExit(f'projects status {status}')
          get('/teams?per_page=100','teams')
          pdata=projects.get('data',{})
          plist=pdata.get('projects',[]) if isinstance(pdata,dict) else []
          if not plist: raise SystemExit('no projects visible')
          targets=[]
          for p in plist:
              pid=p.get('id')
              if not pid: continue
              get(f'/projects/{pid}',f'project:{pid}')
              _,services=get(f'/projects/{pid}/services?per_page=100',f'services:{pid}')
              _,jobs=get(f'/projects/{pid}/jobs?per_page=100',f'jobs:{pid}')
              _,addons=get(f'/projects/{pid}/addons?per_page=100',f'addons:{pid}')
              _,volumes=get(f'/projects/{pid}/volumes?per_page=100',f'volumes:{pid}')
              sl=(services.get('data',{}) or {}).get('services',[]) if isinstance(services,dict) else []
              jl=(jobs.get('data',{}) or {}).get('jobs',[]) if isinstance(jobs,dict) else []
              al=(addons.get('data',{}) or {}).get('addons',[]) if isinstance(addons,dict) else []
              vd=volumes.get('data',[]) if isinstance(volumes,dict) else []
              vl=vd if isinstance(vd,list) else (vd or {}).get('volumes',[])
              for s in sl:
                  sid=s.get('id'); name=(s.get('name') or '').lower()
                  if not sid: continue
                  get(f'/projects/{pid}/services/{sid}',f'service:{pid}:{sid}')
                  get(f'/projects/{pid}/services/{sid}/deployment',f'service-deployment:{pid}:{sid}')
                  get(f'/projects/{pid}/services/{sid}/build?per_page=100',f'service-builds:{pid}:{sid}')
                  get(f'/projects/{pid}/services/{sid}/containers?per_page=100',f'service-containers:{pid}:{sid}')
                  get(f'/projects/{pid}/services/{sid}/metrics?queryType=single&metricTypes=cpu&metricTypes=memory&metricTypes=diskUsage',f'service-metrics:{pid}:{sid}')
                  if 'senecio' in name or 'h011' in name or 'senecio' in sid.lower() or 'h011' in sid.lower(): targets.append({'project_id':pid,'service_id':sid,'name':s.get('name')})
              for j in jl:
                  jid=j.get('id')
                  if jid:
                      get(f'/projects/{pid}/jobs/{jid}',f'job:{pid}:{jid}')
                      get(f'/projects/{pid}/jobs/{jid}/deployment',f'job-deployment:{pid}:{jid}')
                      get(f'/projects/{pid}/jobs/{jid}/runs?per_page=100',f'job-runs:{pid}:{jid}')
              for a in al:
                  aid=a.get('id')
                  if aid:
                      get(f'/projects/{pid}/addons/{aid}',f'addon:{pid}:{aid}')
                      get(f'/projects/{pid}/addons/{aid}/backups?per_page=100',f'addon-backups:{pid}:{aid}')
                      get(f'/projects/{pid}/addons/{aid}/restores?per_page=100',f'addon-restores:{pid}:{aid}')
              for v in vl:
                  vid=v.get('id') if isinstance(v,dict) else None
                  if vid:
                      get(f'/projects/{pid}/volumes/{vid}',f'volume:{pid}:{vid}')
                      get(f'/projects/{pid}/volumes/{vid}/backups?per_page=100',f'volume-backups:{pid}:{vid}')
          out['senex_targets']=targets
          out['auth']={'authenticated':True,'projects_visible':len(plist),'senex_targets_found':len(targets),'secret_values_exported':False}
          if not targets: raise SystemExit('SENECIO/H011 service not identified')
          raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode()
          open('evidence/northflank_phase_c_inventory.json','wb').write(raw+b'\n')
          open('evidence/northflank_phase_c_inventory.sha256','w').write(hashlib.sha256(raw+b'\n').hexdigest()+'  northflank_phase_c_inventory.json\n')
          summary={'captured_at':out['captured_at'],'projects_visible':len(plist),'targets':targets,'request_count':len(out['requests']),'http_statuses':sorted(set(r['status'] for r in out['requests'])),'inventory_sha256':hashlib.sha256(raw+b'\n').hexdigest(),'secret_values_exported':False}
          open('evidence/summary.json','w').write(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
          (cd evidence && sha256sum -c northflank_phase_c_inventory.sha256)
      - name: Upload sanitized Phase C evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: northflank-phase-c-authenticated-${{ github.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
