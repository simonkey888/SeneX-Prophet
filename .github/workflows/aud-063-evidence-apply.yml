name: AUD-063 One-Shot Evidence Materializer

on:
  push:
    branches:
      - audit/aud-063-settlement-starvation-recovery

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ contains(github.event.head_commit.message, '[AUD063_EVIDENCE_APPLY]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Verify exact base ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 49c5f0a69609c005da80e48b585e91d8582a5ac6 HEAD
          test "$(git rev-parse '49c5f0a69609c005da80e48b585e91d8582a5ac6^{tree}')" = "3e323bcc2795f97b29242883d3bf2a015c092ccd"
      - name: Generate tracked evidence
        run: python senecio_polymarket/scripts/aud063_generate_evidence.py
      - name: Commit evidence only
        run: |
          set -euo pipefail
          git config user.name "senex-aud063-bot"
          git config user.email "actions@users.noreply.github.com"
          git add senecio_polymarket/docs/AUD-063-REPORT.md senecio_polymarket/docs/evidence/aud-063-*.json
          git diff --cached --check
          git commit -m "[AUD063_EVIDENCE_DONE] materialize deterministic evidence bundle"
          git push origin HEAD:audit/aud-063-settlement-starvation-recovery
