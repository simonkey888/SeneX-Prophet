name: SENEX 021 Governance Diagnose 2

on:
  push:
    branches:
      - feat/senex-real-data-evidence-campaign-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare committed manifest with fresh generation
        shell: bash
        run: |
          set -euo pipefail
          cp governance/repository_manifest.json /tmp/before.json
          git rm .github/workflows/senex-021-governance-diagnose2.yml >/dev/null
          python tools/verify_repository_contract.py --root . --generate >/tmp/generated.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/before.json'))
          b=json.load(open('governance/repository_manifest.json'))
          print('TOP_CHANGED=', {k:(a.get(k),b.get(k)) for k in sorted(set(a)|set(b)) if k!='files' and a.get(k)!=b.get(k)})
          aa={x['path']:x for x in a['files']}; bb={x['path']:x for x in b['files']}
          print('ONLY_COMMITTED=', sorted(set(aa)-set(bb)))
          print('ONLY_GENERATED=', sorted(set(bb)-set(aa)))
          changed=[]
          for p in sorted(set(aa)&set(bb)):
            if aa[p]!=bb[p]:
              delta={k:(aa[p].get(k),bb[p].get(k)) for k in sorted(set(aa[p])|set(bb[p])) if aa[p].get(k)!=bb[p].get(k)}
              changed.append((p,delta))
          print('CHANGED_COUNT=',len(changed))
          for p,d in changed[:50]: print('CHANGED_PATH=',p,'DELTA=',json.dumps(d,sort_keys=True,separators=(',',':')))
          PY
