name: SENEX Diagnostic State Contract Correction Once

on:
  push:
    branches:
      - fix/senex-arm64-reproducible-runtime-v2
    paths:
      - .github/workflows/senex-diagnostic-state-contract-correction-once.yml

permissions:
  contents: write

jobs:
  correct-regenerate-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-reproducible-runtime-v2
          persist-credentials: true

      - name: Correct diagnostic runtime assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('tools/verify_h011_arm64_reproducibility.sh')
          text = script.read_text()

          old_ready = '''      | jq -e '.ok==true and .readiness==true and .runtime_state=="RUNNING"' \\
                >/dev/null 2>&1 \\
              && curl -fsS "$BASE_URL/api/v3/integrity" \\
              | jq -e --arg sha "$HEAD_SHA" \\
                '.code_sha==$sha and .paper_only==true and .orders_enabled==false and .live_capital_locked==true and .chain_verified==true and .replay_verified==true and .file_sha256_matches==true and .readiness==true' \\
                >/dev/null 2>&1; then
          '''
          new_ready = '''      | jq -e '.ok==true and .readiness==true and .runtime_state=="DEGRADED"' \\
                >/dev/null 2>&1 \\
              && curl -fsS "$BASE_URL/api/v3/integrity" \\
              | jq -e --arg sha "$HEAD_SHA" \\
                '.code_sha==$sha and .paper_only==true and .orders_enabled==false and .live_capital_locked==true and .chain_verified==true and .replay_verified==true and .file_sha256_matches==true and .readiness==true and .runtime.runtime_state=="DEGRADED" and .runtime.scanner_enabled==false and .runtime.publication_enabled==false and .runtime.blocking_reason=="diagnostic_only_mode"' \\
                >/dev/null 2>&1; then
          '''
          if text.count(old_ready) != 1:
              raise SystemExit(f'initial diagnostic assertion count={text.count(old_ready)}')
          text = text.replace(old_ready, new_ready)

          old_initial_fail = '''[[ "$ready" == "true" ]] || die "INITIAL_ENDPOINT_GATE_FAILED"
          '''
          new_initial_fail = '''if [[ "$ready" != "true" ]]; then
            docker inspect "$CONTAINER" | jq -S '.[0].State' \\
              > "$EVIDENCE/container-initial-failure-state.json" 2>/dev/null || true
            docker logs "$CONTAINER" \\
              > "$EVIDENCE/container-initial-failure.log" 2>&1 || true
            curl -sS "$BASE_URL/readyz" \\
              > "$EVIDENCE/readyz-initial-failure.json" 2>/dev/null || true
            curl -sS "$BASE_URL/api/v3/integrity" \\
              > "$EVIDENCE/integrity-initial-failure.json" 2>/dev/null || true
            die "INITIAL_ENDPOINT_GATE_FAILED"
          fi
          '''
          if text.count(old_initial_fail) != 1:
              raise SystemExit(f'initial failure diagnostic count={text.count(old_initial_fail)}')
          text = text.replace(old_initial_fail, new_initial_fail)

          endpoint_loop = '''for endpoint in livez readyz healthz api/v3/state api/v3/integrity api/v3/replay; do
            name="${endpoint//\\//_}"
            curl -fsS "$BASE_URL/$endpoint" | jq -S . \\
              > "$EVIDENCE/$name.json"
          done
          '''
          endpoint_loop_new = endpoint_loop + '''jq -e \\
            '.ok==true and .status=="DEGRADED" and .readiness==true and .runtime.runtime_state=="DEGRADED" and .runtime.scanner_enabled==false and .runtime.publication_enabled==false and .runtime.blocking_reason=="diagnostic_only_mode"' \\
            "$EVIDENCE/healthz.json" >/dev/null \\
            || die "DIAGNOSTIC_HEALTH_CONTRACT_FAILED"
          '''
          if text.count(endpoint_loop) != 1:
              raise SystemExit(f'endpoint loop count={text.count(endpoint_loop)}')
          text = text.replace(endpoint_loop, endpoint_loop_new)

          old_restart = '''        '.paper_only==true and .orders_enabled==false and .live_capital_locked==true and .chain_verified==true and .replay_verified==true and .file_sha256_matches==true and .readiness==true' \\
                >/dev/null 2>&1; then
          '''
          new_restart = '''        '.paper_only==true and .orders_enabled==false and .live_capital_locked==true and .chain_verified==true and .replay_verified==true and .file_sha256_matches==true and .readiness==true and .runtime.runtime_state=="DEGRADED" and .runtime.scanner_enabled==false and .runtime.publication_enabled==false and .runtime.blocking_reason=="diagnostic_only_mode"' \\
                >/dev/null 2>&1; then
          '''
          if text.count(old_restart) != 1:
              raise SystemExit(f'restart diagnostic assertion count={text.count(old_restart)}')
          text = text.replace(old_restart, new_restart)
          script.write_text(text)

          checker = Path('tools/verify_h011_shell_harness.py')
          ctext = checker.read_text()
          marker = '''    "SYNTHETIC_BASELINE_IDENTITY_MISMATCH",
          )
          '''
          replacement = '''    "SYNTHETIC_BASELINE_IDENTITY_MISMATCH",
              '.runtime_state=="DEGRADED"',
              '.runtime.runtime_state=="DEGRADED"',
              '.runtime.scanner_enabled==false',
              '.runtime.publication_enabled==false',
              '.runtime.blocking_reason=="diagnostic_only_mode"',
              "DIAGNOSTIC_HEALTH_CONTRACT_FAILED",
              "container-initial-failure.log",
          )
          '''
          if ctext.count(marker) != 1:
              raise SystemExit(f'harness diagnostic marker count={ctext.count(marker)}')
          checker.write_text(ctext.replace(marker, replacement))

          docs = Path('docs/H011_REPRODUCIBLE_RUNTIME.md')
          dtext = docs.read_text()
          old_doc = '''checks do not depend on current Polymarket network state. Both pre- and
          post-restart raw-chain sequences must be decimal integers, and the committed
          baseline identity must match the fixed run and scan IDs.
          '''
          new_doc = '''checks do not depend on current Polymarket network state. The expected
          supervisor state is explicitly `DEGRADED` with readiness true, scanner and
          publication disabled, and `blocking_reason=diagnostic_only_mode`; treating this
          controlled state as `RUNNING` is forbidden. Both pre- and post-restart raw-chain
          sequences must be decimal integers, and the committed baseline identity must
          match the fixed run and scan IDs.
          '''
          if dtext.count(old_doc) != 1:
              raise SystemExit(f'documentation diagnostic contract count={dtext.count(old_doc)}')
          docs.write_text(dtext.replace(old_doc, new_doc))
          PY

          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 tools/verify_h011_shell_harness.py \
            --script tools/verify_h011_arm64_reproducibility.sh \
            --output /tmp/harness-static.json
          bash tools/verify_h011_arm64_reproducibility.sh \
            --self-test /tmp/harness-self-test
          (cd /tmp/harness-self-test && sha256sum -c SHA256SUMS)

      - name: Remove temporary workflow and regenerate governance
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/senex-diagnostic-state-contract-correction-once.yml
          test -z "$(git ls-files .github/workflows/senex-diagnostic-state-contract-correction-once.yml)"
          python3 tools/verify_repository_contract.py --generate \
            > /tmp/senex-governance-generation.json
          git add \
            tools/verify_h011_arm64_reproducibility.sh \
            tools/verify_h011_shell_harness.py \
            docs/H011_REPRODUCIBLE_RUNTIME.md \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          git diff --check --cached
          (cd governance && sha256sum -c repository_manifest.json.sha256)

      - name: Commit diagnostic contract correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'test(senex): enforce diagnostic runtime state contract'
          git push origin HEAD:fix/senex-arm64-reproducible-runtime-v2
