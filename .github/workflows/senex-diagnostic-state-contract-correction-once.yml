name: SENEX Diagnostic State Contract Correction Once

on:
  push:
    branches:
      - fix/senex-arm64-reproducible-runtime-v2
    paths:
      - .github/workflows/senex-diagnostic-state-contract-correction-once.yml

permissions:
  contents: write

jobs:
  correct-regenerate-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-reproducible-runtime-v2
          persist-credentials: true

      - name: Correct diagnostic runtime assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('tools/verify_h011_arm64_reproducibility.sh')
          text = script.read_text()

          running = '.ok==true and .readiness==true and .runtime_state=="RUNNING"'
          degraded = '.ok==true and .readiness==true and .runtime_state=="DEGRADED"'
          if text.count(running) != 1:
              raise SystemExit(f'initial ready-state count={text.count(running)}')
          text = text.replace(running, degraded)

          restart_old = '.paper_only==true and .orders_enabled==false and .live_capital_locked==true and .chain_verified==true and .replay_verified==true and .file_sha256_matches==true and .readiness==true'
          restart_new = restart_old + ' and .runtime.runtime_state=="DEGRADED" and .runtime.scanner_enabled==false and .runtime.publication_enabled==false and .runtime.blocking_reason=="diagnostic_only_mode"'
          restart_index = text.rfind(restart_old)
          if restart_index < 0:
              raise SystemExit('restart diagnostic expression missing')
          text = text[:restart_index] + restart_new + text[restart_index + len(restart_old):]

          initial_old = '.code_sha==$sha and ' + restart_old
          initial_new = initial_old + ' and .runtime.runtime_state=="DEGRADED" and .runtime.scanner_enabled==false and .runtime.publication_enabled==false and .runtime.blocking_reason=="diagnostic_only_mode"'
          if text.count(initial_old) != 1:
              raise SystemExit(f'initial integrity expression count={text.count(initial_old)}')
          text = text.replace(initial_old, initial_new)

          old_failure = '[[ "$ready" == "true" ]] || die "INITIAL_ENDPOINT_GATE_FAILED"'
          new_failure = '''if [[ "$ready" != "true" ]]; then
            docker inspect "$CONTAINER" | jq -S '.[0].State' \\
              > "$EVIDENCE/container-initial-failure-state.json" 2>/dev/null || true
            docker logs "$CONTAINER" \\
              > "$EVIDENCE/container-initial-failure.log" 2>&1 || true
            curl -sS "$BASE_URL/readyz" \\
              > "$EVIDENCE/readyz-initial-failure.json" 2>/dev/null || true
            curl -sS "$BASE_URL/api/v3/integrity" \\
              > "$EVIDENCE/integrity-initial-failure.json" 2>/dev/null || true
            die "INITIAL_ENDPOINT_GATE_FAILED"
          fi'''
          if text.count(old_failure) != 1:
              raise SystemExit(f'initial failure assertion count={text.count(old_failure)}')
          text = text.replace(old_failure, new_failure)

          anchor = 'cp "$EVIDENCE/api_v3_integrity.json" "$EVIDENCE/integrity-before.json"'
          health_contract = '''jq -e \\
            '.ok==true and .status=="DEGRADED" and .readiness==true and .runtime.runtime_state=="DEGRADED" and .runtime.scanner_enabled==false and .runtime.publication_enabled==false and .runtime.blocking_reason=="diagnostic_only_mode"' \\
            "$EVIDENCE/healthz.json" >/dev/null \\
            || die "DIAGNOSTIC_HEALTH_CONTRACT_FAILED"

          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'health contract anchor count={text.count(anchor)}')
          text = text.replace(anchor, health_contract + anchor)
          script.write_text(text)

          checker = Path('tools/verify_h011_shell_harness.py')
          ctext = checker.read_text()
          marker = '    "SYNTHETIC_BASELINE_IDENTITY_MISMATCH",\n)'
          replacement = '''    "SYNTHETIC_BASELINE_IDENTITY_MISMATCH",
              '.runtime_state=="DEGRADED"',
              '.runtime.runtime_state=="DEGRADED"',
              '.runtime.scanner_enabled==false',
              '.runtime.publication_enabled==false',
              '.runtime.blocking_reason=="diagnostic_only_mode"',
              "DIAGNOSTIC_HEALTH_CONTRACT_FAILED",
              "container-initial-failure.log",
          )'''
          if ctext.count(marker) != 1:
              raise SystemExit(f'harness diagnostic marker count={ctext.count(marker)}')
          checker.write_text(ctext.replace(marker, replacement))

          docs = Path('docs/H011_REPRODUCIBLE_RUNTIME.md')
          dtext = docs.read_text()
          addition = '''

          The expected supervisor state for this isolated diagnostic gate is explicitly
          `DEGRADED` with readiness true, scanner and publication disabled, and
          `blocking_reason=diagnostic_only_mode`. Treating this controlled state as
          `RUNNING` is forbidden.
          '''
          if 'Treating this controlled state as' not in dtext:
              docs.write_text(dtext.rstrip() + addition)
          PY

          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 tools/verify_h011_shell_harness.py \
            --script tools/verify_h011_arm64_reproducibility.sh \
            --output /tmp/harness-static.json
          bash tools/verify_h011_arm64_reproducibility.sh \
            --self-test /tmp/harness-self-test
          (cd /tmp/harness-self-test && sha256sum -c SHA256SUMS)

      - name: Remove temporary workflow and regenerate governance
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/senex-diagnostic-state-contract-correction-once.yml
          test -z "$(git ls-files .github/workflows/senex-diagnostic-state-contract-correction-once.yml)"
          python3 tools/verify_repository_contract.py --generate \
            > /tmp/senex-governance-generation.json
          git add \
            tools/verify_h011_arm64_reproducibility.sh \
            tools/verify_h011_shell_harness.py \
            docs/H011_REPRODUCIBLE_RUNTIME.md \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          git diff --check --cached
          (cd governance && sha256sum -c repository_manifest.json.sha256)

      - name: Commit diagnostic contract correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'test(senex): enforce diagnostic runtime state contract'
          git push origin HEAD:fix/senex-arm64-reproducible-runtime-v2
