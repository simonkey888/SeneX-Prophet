name: SENEX Harness Self-Test Correction Once

on:
  push:
    branches:
      - fix/senex-arm64-reproducible-runtime-v2
    paths:
      - .github/workflows/senex-harness-selftest-correction-once.yml

permissions:
  contents: write

jobs:
  correct-test-regenerate-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-reproducible-runtime-v2
          persist-credentials: true

      - name: Correct expected-child-failure handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/verify_h011_arm64_reproducibility.sh')
          text=path.read_text()
          old='''  set +e
            env -i \\
              PATH="$PATH" \\
              HOME="${HOME:-/tmp}" \\
              bash "$ROOT/tools/verify_h011_arm64_reproducibility.sh" \\
                --controlled-failure "$nested"
            child_rc=$?
            set -e
          '''
          new='''  if env -i \\
              PATH="$PATH" \\
              HOME="${HOME:-/tmp}" \\
              bash "$ROOT/tools/verify_h011_arm64_reproducibility.sh" \\
                --controlled-failure "$nested"; then
            child_rc="0"
            else
              child_rc=$?
            fi
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one self-test block, found {text.count(old)}')
          path.write_text(text.replace(old,new))
          PY
          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 tools/verify_h011_shell_harness.py \
            --script tools/verify_h011_arm64_reproducibility.sh \
            --output /tmp/harness-static.json
          bash tools/verify_h011_arm64_reproducibility.sh \
            --self-test /tmp/harness-self-test
          grep -qx 'ARM64_PREFLIGHT=PASS' /tmp/harness-self-test/result.env
          grep -qx 'FAILURE_REASON=HARNESS_SELF_TEST_PASS' \
            /tmp/harness-self-test/result.env

      - name: Remove temporary workflow and regenerate governance
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/senex-harness-selftest-correction-once.yml
          test -z "$(git ls-files .github/workflows/senex-harness-selftest-correction-once.yml)"
          python3 tools/verify_repository_contract.py --generate \
            > /tmp/senex-governance-generation.json
          git add \
            tools/verify_h011_arm64_reproducibility.sh \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          git diff --check --cached
          (cd governance && sha256sum -c repository_manifest.json.sha256)

      - name: Commit corrected canonical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'test(senex): close controlled-failure harness propagation'
          git push origin HEAD:fix/senex-arm64-reproducible-runtime-v2
