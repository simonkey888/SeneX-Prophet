name: ORDER070 Northflank Credential Scope Probe

on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]

permissions:
  contents: read

env:
  NF_API: https://api.northflank.com/v1
  PROJECT_ID: seneciobot

jobs:
  repo-scope:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe repository-scope secrets safely
        shell: bash
        env:
          API_KEY: ${{ secrets.NORTHFLANK_API_TOKEN }}
          MAINT_KEY: ${{ secrets.NORTHFLANK_SENEX_MAINTENANCE_TOKEN }}
        run: |
          set +x
          python - <<'PY'
          import os,urllib.request,urllib.error
          base=os.environ['NF_API']; project=os.environ['PROJECT_ID']
          for name,var in [('NORTHFLANK_API_TOKEN','API_KEY'),('NORTHFLANK_SENEX_MAINTENANCE_TOKEN','MAINT_KEY')]:
              token=os.environ.get(var,'')
              if not token:
                  print(f'{name}_PRESENT=NO'); continue
              print(f'{name}_PRESENT=YES')
              req=urllib.request.Request(f'{base}/projects/{project}',headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'senex-order070-key-probe/1'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: status=r.status
              except urllib.error.HTTPError as e: status=e.code
              print(f'{name}_AUTH_HTTP={status}')
          PY

  env-scope:
    strategy:
      fail-fast: false
      matrix:
        envname: [northflank-readonly-audit, production, senecio-h011, seneciobot]
    environment: ${{ matrix.envname }}
    runs-on: ubuntu-24.04
    steps:
      - name: Probe environment secret safely
        shell: bash
        env:
          API_KEY: ${{ secrets.NORTHFLANK_API_TOKEN }}
          MAINT_KEY: ${{ secrets.NORTHFLANK_SENEX_MAINTENANCE_TOKEN }}
        run: |
          set +x
          echo "SCOPE=${{ matrix.envname }}"
          python - <<'PY'
          import os,urllib.request,urllib.error
          base=os.environ['NF_API']; project=os.environ['PROJECT_ID']
          for name,var in [('NORTHFLANK_API_TOKEN','API_KEY'),('NORTHFLANK_SENEX_MAINTENANCE_TOKEN','MAINT_KEY')]:
              token=os.environ.get(var,'')
              if not token:
                  print(f'{name}_PRESENT=NO'); continue
              print(f'{name}_PRESENT=YES')
              req=urllib.request.Request(f'{base}/projects/{project}',headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'senex-order070-key-probe/1'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: status=r.status
              except urllib.error.HTTPError as e: status=e.code
              print(f'{name}_AUTH_HTTP={status}')
          PY
