name: ORDER070 R6 Final B438 Deploy Stability Seal
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: order070-r6-final-b438
  cancel-in-progress: true
jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':'pending','context':'ORDER070/R6-final-b438','description':f"run {os.environ['RUN_ID']} exact deploy + edge + 8 rounds + 30m",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r6-final/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
      - name: Checkout exact final candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b438c0d6dc156d4183929366963df988d97a5283
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout ops runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Reassert exact candidate public boundary and memory headroom
        env: {PYTHONPATH: candidate/senecio_polymarket}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = b438c0d6dc156d4183929366963df988d97a5283
          test "$(git -C candidate rev-parse HEAD^{tree})" = e1e4b002aa90402517edb90412b755bc8529327e
          test -z "$(git -C candidate status --porcelain)"
          python -m pip install --quiet --require-hashes -r candidate/senecio_polymarket/requirements.lock
          python -m unittest -v candidate/senecio_polymarket/tests/test_order_070_r6_public_boundary.py
          /usr/bin/time -f '%M' -o /tmp/rss_kb python -c 'import backend.main_real'
          rss=$(tail -1 /tmp/rss_kb)
          echo "IMPORT_RSS_KB=$rss"
          test "$rss" -gt 0
          test "$rss" -lt 81920
          echo "R6_IMPORT_RSS_KB=$rss" >> "$GITHUB_ENV"
      - name: Exact deploy edge reconciliation E2E and 30m stability
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          CANDIDATE_DIR: candidate
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python ops/.github/scripts/order070_r6_terminal_v4.py
          (cd order070-r6-final-evidence && sha256sum -c MANIFEST.sha256)
      - name: Upload final R6 sealed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-r6-final-b438c0d6
          path: order070-r6-final-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':state,'context':'ORDER070/R6-final-b438','description':f"run {os.environ['RUN_ID']} {state}",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r6-final/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
