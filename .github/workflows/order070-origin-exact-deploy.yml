name: ORDER070 R5 Final Edge Reconciliation Seal
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: order070-r5-final-edge-seal
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':'pending','context':'ORDER070/R5-final-edge-seal','description':f"run {os.environ['RUN_ID']} started",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r5-status/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 483b389a83610992800181c0a21b5a337009f7b4
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout ops runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Bounded origin authority readiness gate
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://h011-web--senecio-h011--wbjggn89fnf8.code.run'
          ok=0
          for i in $(seq 1 60); do
            snapshot=$(curl -sS -o /tmp/snapshot -w '%{http_code}' --max-time 30 "$ORIGIN/api/authority/snapshot?symbol=BTCUSDT" || true)
            health=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 30 "$ORIGIN/healthz" || true)
            ready=$(curl -sS -o /tmp/ready -w '%{http_code}' --max-time 30 "$ORIGIN/readyz?symbol=BTCUSDT" || true)
            provenance=$(curl -sS -o /tmp/provenance -w '%{http_code}' --max-time 30 "$ORIGIN/api/runtime/provenance" || true)
            echo "ORIGIN_GATE_ATTEMPT=$i SNAPSHOT=$snapshot HEALTH=$health READY=$ready PROVENANCE=$provenance"
            if [ "$snapshot" = 200 ] && [ "$health" = 200 ] && [ "$ready" = 200 ] && [ "$provenance" = 200 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Final edge proof reconciliation and seal
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          CANDIDATE_DIR: candidate
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python ops/.github/scripts/order070_r5_reconcile_seal_verified_edge.py
          (cd order070-r5-final-evidence && sha256sum -c MANIFEST.sha256)
      - name: Upload final R5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-r5-final-sealed-483b389a83610992800181c0a21b5a337009f7b4
          path: order070-r5-final-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':state,'context':'ORDER070/R5-final-edge-seal','description':f"run {os.environ['RUN_ID']} {state}",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r5-status/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
