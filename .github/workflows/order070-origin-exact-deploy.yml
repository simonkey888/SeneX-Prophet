name: ORDER070 R5 Exact Origin Edge Finalize
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]
permissions:
  contents: read
concurrency:
  group: order070-r5-finalize
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 483b389a83610992800181c0a21b5a337009f7b4
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout ops runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Run R5 exact build deploy edge reconciliation and seal
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          CANDIDATE_DIR: candidate
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python ops/.github/scripts/order070_r5_finish.py
          (cd order070-r5-final-evidence && sha256sum -c MANIFEST.sha256)
      - name: Upload final R5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-r5-final-483b389a83610992800181c0a21b5a337009f7b4
          path: order070-r5-final-evidence/
          if-no-files-found: warn
          retention-days: 30
