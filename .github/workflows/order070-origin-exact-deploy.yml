name: ORDER070 Origin Exact Reversible Deploy
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/senex-zero-cost-audit-20260809
          persist-credentials: false
      - name: Execute exact deployment helper
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          set +x
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python .github/scripts/order070_origin_deploy.py
          (cd order070-origin-evidence && sha256sum -c SHA256SUMS)
      - name: Upload origin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-origin-exact-202f154a71915eb4b1e3cdf0e1eec8005760a028
          path: order070-origin-evidence/
          if-no-files-found: warn
          retention-days: 30
