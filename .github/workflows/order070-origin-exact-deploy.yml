name: ORDER070 R6 Terminal Deploy Stability Resume
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: order070-r6-terminal-resume
  cancel-in-progress: true
jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':'pending','context':'ORDER070/R6-terminal','description':f"run {os.environ['RUN_ID']} deploy + >=30m stability after exact gates 32578328152",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r6-resume/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
      - name: Checkout pristine exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d166495e9a74f528ccce1adeb5ce97a281b175cf
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout ops runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Reassert exact candidate and memory fix
        env: {PYTHONPATH: candidate/senecio_polymarket}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = d166495e9a74f528ccce1adeb5ce97a281b175cf
          test "$(git -C candidate rev-parse HEAD^{tree})" = 6106f1c2f39b4509d3a237eb807db5d45feb7463
          test -z "$(git -C candidate status --porcelain)"
          test "$(git -C candidate diff --name-only 483b389a83610992800181c0a21b5a337009f7b4..HEAD)" = senecio_polymarket/backend/main.py
          python -m pip install --quiet --require-hashes -r candidate/senecio_polymarket/requirements.lock
          /usr/bin/time -f '%M' -o /tmp/rss_kb python -c 'import backend.main_real'
          rss=$(tail -1 /tmp/rss_kb)
          echo "IMPORT_RSS_KB=$rss"
          test "$rss" -gt 0
          test "$rss" -lt 81920
          echo "R6_IMPORT_RSS_KB=$rss" >> "$GITHUB_ENV"
      - name: Execute exact deploy Cloudflare E2E and >=30m stability
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          CANDIDATE_DIR: candidate
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python ops/.github/scripts/order070_r6_terminal.py
          (cd order070-r6-final-evidence && sha256sum -c MANIFEST.sha256)
      - name: Upload R6 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-r6-terminal-d166495e
          path: order070-r6-final-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':state,'context':'ORDER070/R6-terminal','description':f"run {os.environ['RUN_ID']} {state}",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r6-resume/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
