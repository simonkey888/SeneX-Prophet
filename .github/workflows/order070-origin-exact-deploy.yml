name: ORDER070 Combined Service Safe Inspect
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]
permissions:
  contents: read
env:
  NF_API: https://api.northflank.com/v1
  PROJECT_ID: seneciobot
  SERVICE_ID: senecio-h011
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Read only whitelisted service configuration
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python - <<'PY'
          import json,os,urllib.request
          api=os.environ['NF_API'].rstrip('/'); p=os.environ['PROJECT_ID']; s=os.environ['SERVICE_ID']; token=os.environ['NORTHFLANK_API_TOKEN']
          req=urllib.request.Request(f'{api}/projects/{p}/services/{s}',headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'senex-order070-inspect/1'},method='GET')
          with urllib.request.urlopen(req,timeout=30) as r: obj=json.load(r)
          d=obj.get('data',obj); vcs=d.get('vcsData') or {}; bs=d.get('buildSettings') or {}; docker=bs.get('dockerfile') or {}
          safe={'id':d.get('id'),'serviceType':d.get('serviceType'),'disabledCI':d.get('disabledCI'),'disabledCD':d.get('disabledCD'),'buildSource':d.get('buildSource'),'vcsData':{k:vcs.get(k) for k in ('projectUrl','projectType','accountLogin','vcsLinkId','projectBranch') if vcs.get(k) is not None},'dockerfile':{k:docker.get(k) for k in ('dockerFilePath','dockerWorkDir','buildEngine') if docker.get(k) is not None}}
          print(json.dumps(safe,sort_keys=True))
          PY
