name: ORDER070 R6 Consolidated Terminal Finish
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths:
      - .github/workflows/order070-r6-terminal.yml
      - .github/scripts/order070_r6_consolidated_terminal.py
permissions:
  contents: read
  statuses: write
concurrency:
  group: order070-r6-consolidated-terminal
  cancel-in-progress: true
env:
  TARGET_SHA: 4b107bfb427cb85ea84850ffd9ddd5d7a4231d94
  TARGET_TREE: 5d1d9ec806b7d0e02031726565f08ef75d5a9340
  BUILD_DIGEST: sha256:8f4511e0ac2499e3b7408843a82e7f3a5bc4cc466c296003eb363842ad2023ac
jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CANDIDATE_DIR: candidate
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':'pending','context':'ORDER070/R6-consolidated-terminal','description':f"run {os.environ['RUN_ID']} exact deploy + E2E + 30m stability",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r6-terminal/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
      - name: Checkout exact final candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4b107bfb427cb85ea84850ffd9ddd5d7a4231d94
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout exact ops runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Assert exact immutable candidate and native CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git -C candidate status --porcelain)"
          python - <<'PY'
          import json,os,urllib.request
          runs={
            'ORDER070':32585446334,
            'SCORE001':32585446345,
            'SCORE002':32585446326,
            'SMOKE':32585446328,
          }
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','User-Agent':'senex-r6-ci-proof/1'}
          for name,rid in runs.items():
            u=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{rid}"
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: x=json.load(r)
            print(f"CI_{name}_RUN={rid} STATUS={x.get('status')} CONCLUSION={x.get('conclusion')}")
            assert x.get('status')=='completed' and x.get('conclusion')=='success', (name,x.get('status'),x.get('conclusion'))
          PY
      - name: Verify consolidated contract before production mutation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e candidate/senecio_polymarket/Dockerfile
          grep -q '^USER senex:senex$' candidate/Dockerfile
          ! grep -q 'chmod -R 777' candidate/Dockerfile
          ! grep -q 'mv /app/oracle/predict_only.py' candidate/Dockerfile
          ! grep -q 'cp /app/oracle_runtime/predict_only.py' candidate/Dockerfile
          grep -q 'from oracle_runtime.predict_only import' candidate/senecio_polymarket/backend/oracle_runner.py
          grep -q '"/api/oracle/predictions/db"' candidate/edge/order070/worker.js
          grep -q 'setInterval(refreshPredictions, 60000)' candidate/senecio_polymarket/frontend/app.js
          python -m py_compile ops/.github/scripts/order070_r6_consolidated_terminal.py
      - name: Build ONLY canonical root Dockerfile for exact final candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false -f Dockerfile \
            --build-arg SENEX_SOURCE_COMMIT="$TARGET_SHA" \
            --build-arg SENEX_SOURCE_TREE="$TARGET_TREE" \
            --build-arg SENEX_BUILD_DIGEST="$BUILD_DIGEST" \
            --build-arg SENEX_IMAGE_DIGEST=unknown \
            -t senex-order070-r6-final .
      - name: Inspect exact built image
        shell: bash
        run: |
          set -euo pipefail
          user="$(docker inspect --format '{{.Config.User}}' senex-order070-r6-final)"
          echo "IMAGE_CONFIG_USER=$user"
          test "$user" = 'senex:senex'
          uid="$(docker run --rm --entrypoint sh senex-order070-r6-final -c 'id -u')"
          echo "IMAGE_RUNTIME_UID=$uid"
          test "$uid" = '10001'
          ww="$(docker run --rm --entrypoint sh senex-order070-r6-final -c 'find /app -xdev -type d -perm -0002 -print')"
          printf 'WORLD_WRITABLE_APP_PATHS=%s\n' "$ww"
          test -z "$ww"
          docker run --rm --entrypoint python senex-order070-r6-final -c "from backend import oracle_runner; import inspect; s=inspect.getsource(oracle_runner._run_one_prediction); assert 'oracle_runtime.predict_only' in s; print('EXPLICIT_RUNTIME_IMPORT=PASS')"
      - name: Exact deploy Cloudflare reconciliation E2E and 30m production stability
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python ops/.github/scripts/order070_r6_consolidated_terminal.py
          (cd order070-r6-final-evidence && sha256sum -c MANIFEST.sha256)
      - name: Upload fresh terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-r6-terminal-4b107bfb427cb85ea84850ffd9ddd5d7a4231d94
          path: order070-r6-final-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':state,'context':'ORDER070/R6-consolidated-terminal','description':f"run {os.environ['RUN_ID']} {state}",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r6-terminal/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
