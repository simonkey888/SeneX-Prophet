name: ARQ Public Runtime Baseline

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-public-runtime-baseline.yml

permissions:
  contents: read

env:
  PUBLIC_BASE: https://h011-web--senecio-h011--wbjggn89fnf8.code.run

jobs:
  curl-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture with curl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-curl
          for spec in root:/ health:/healthz state:/api/v3/state integrity:/api/v3/integrity replay:/api/v3/replay; do
            name="${spec%%:*}"
            path="${spec#*:}"
            status="$(curl --silent --show-error --location --max-time 30 --output "evidence-curl/${name}.body" --write-out '%{http_code}' "${PUBLIC_BASE}${path}" || true)"
            printf '%s\n' "$status" > "evidence-curl/${name}.status"
          done
          sha256sum evidence-curl/* > evidence-curl/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-public-baseline-curl-${{ github.sha }}
          path: evidence-curl/
          retention-days: 14

  python-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture with Python urllib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-python
          python - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          base=os.environ['PUBLIC_BASE']
          paths={'root':'/','health':'/healthz','state':'/api/v3/state','integrity':'/api/v3/integrity','replay':'/api/v3/replay'}
          report={'captured_at':datetime.now(timezone.utc).isoformat(),'client':'python-urllib','base':base,'responses':{}}
          for name,path in paths.items():
              request=urllib.request.Request(base+path,headers={'Accept':'application/json','User-Agent':'senex-independent-baseline/1'})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      body=response.read().decode('utf-8',errors='replace')
                      report['responses'][name]={'status':response.status,'body':body[:100000]}
              except urllib.error.HTTPError as exc:
                  report['responses'][name]={'status':exc.code,'body':exc.read().decode('utf-8',errors='replace')[:100000]}
              except Exception as exc:
                  report['responses'][name]={'status':0,'error':type(exc).__name__,'message':str(exc)[:500]}
          out=Path('evidence-python/public-baseline.json')
          out.write_text(json.dumps(report,indent=2,sort_keys=True),encoding='utf-8')
          Path('evidence-python/SHA256SUMS').write_text(f"{hashlib.sha256(out.read_bytes()).hexdigest()}  {out.name}\n",encoding='utf-8')
          print(json.dumps({k:v['status'] for k,v in report['responses'].items()},sort_keys=True))
          PY
          (cd evidence-python && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-public-baseline-python-${{ github.sha }}
          path: evidence-python/
          retention-days: 14
