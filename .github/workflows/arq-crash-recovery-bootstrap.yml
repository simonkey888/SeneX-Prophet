name: ARQ Crash Recovery Bootstrap

on:
  push:
    branches: [feat/senex-paper-execution-truth-v1]
    paths: [.github/workflows/arq-crash-recovery-bootstrap.yml]

permissions:
  contents: read

concurrency:
  group: senex-arq-crash-recovery-bootstrap
  cancel-in-progress: false

jobs:
  apply-verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: feat/senex-paper-execution-truth-v1
      - name: Verify authorized lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e91faa59233bc33b8fa8964aa5cb9502ace2dfaf HEAD
          test "$(git branch --show-current)" = "feat/senex-paper-execution-truth-v1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Apply bounded correction
        run: |
          set -euo pipefail
          cat .arq-bootstrap/patch.* | base64 --decode | gzip --decompress > tools/apply_arq_crash_recovery.py
          python tools/apply_arq_crash_recovery.py
          git rm -r .arq-bootstrap
          python tools/verify_repository_contract.py --generate
          git diff --check
          python -m compileall polymarket/paper tools tests/paper_trial
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt
      - name: Focused verification
        run: |
          set -euo pipefail
          PYTHONPATH=.:polymarket python -m pytest -q tests/paper_trial/test_crash_recovery.py tests/paper_trial/test_engine_reporting_and_safety.py tests/paper_trial/test_execution_truth_artifact_builder.py tests/monitoring/test_monitoring_truth.py tests/governance
      - name: Global regression
        run: |
          set -euo pipefail
          PYTHONPATH=.:polymarket python -m pytest -q
      - name: Package verified index
        run: |
          set -euo pipefail
          mkdir -p /tmp/senex-verified
          git add -A
          test -n "$(git status --porcelain)"
          BASE_HEAD="$(git rev-parse HEAD)"
          FINAL_TREE="$(git write-tree)"
          git diff --cached --binary > /tmp/senex-verified/crash-recovery.patch
          git archive --format=tar.gz --output=/tmp/senex-verified/crash-recovery-tree.tar.gz "${FINAL_TREE}"
          printf '%s\n' "${BASE_HEAD}" > /tmp/senex-verified/base-head.txt
          printf '%s\n' "${FINAL_TREE}" > /tmp/senex-verified/final-tree.txt
          git status --short > /tmp/senex-verified/status.txt
          (cd /tmp/senex-verified && sha256sum crash-recovery.patch crash-recovery-tree.tar.gz base-head.txt final-tree.txt status.txt > SHA256SUMS)
      - name: Upload verified tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-crash-recovery-verified-${{ github.sha }}
          path: /tmp/senex-verified
          retention-days: 14
          if-no-files-found: error
