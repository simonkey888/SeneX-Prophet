name: ARQ Crash Recovery Bootstrap

on:
  push:
    branches: [feat/senex-paper-execution-truth-v1]
    paths: [.github/workflows/arq-crash-recovery-bootstrap.yml]

permissions:
  contents: write

concurrency:
  group: senex-arq-crash-recovery-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: feat/senex-paper-execution-truth-v1
      - name: Verify authorized lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e91faa59233bc33b8fa8964aa5cb9502ace2dfaf HEAD
          test "$(git branch --show-current)" = "feat/senex-paper-execution-truth-v1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Apply bounded correction
        env:
          ARQ_PATCH_GZIP_B64: ""
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64, gzip, os
          from pathlib import Path
          Path('tools/apply_arq_crash_recovery.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['ARQ_PATCH_GZIP_B64'])))
          PYCODE
          python tools/apply_arq_crash_recovery.py
          git diff --check
          python -m compileall polymarket/paper tools tests/paper_trial
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt
      - name: Focused verification
        run: |
          set -euo pipefail
          PYTHONPATH=.:polymarket python -m pytest -q tests/paper_trial/test_crash_recovery.py tests/paper_trial/test_engine_reporting_and_safety.py tests/paper_trial/test_execution_truth_artifact_builder.py tests/monitoring/test_monitoring_truth.py tests/governance
      - name: Global regression
        run: |
          set -euo pipefail
          PYTHONPATH=.:polymarket python -m pytest -q
      - name: Commit verified correction
        run: |
          set -euo pipefail
          git config user.name "SENEX ARQ"
          git config user.email "simonkey888@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(paper): make sequential recovery crash-consistent"
          git push origin HEAD:feat/senex-paper-execution-truth-v1
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
