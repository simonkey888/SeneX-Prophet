name: ARQ Governance Integration Fix

on:
  push:
    branches: [feat/senex-paper-execution-truth-v1]
    paths: [.github/workflows/arq-governance-integration-fix.yml]

permissions:
  contents: write

jobs:
  classify-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: feat/senex-paper-execution-truth-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Apply explicit authority classifications
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/arq-governance-integration-fix.yml /tmp/arq-governance-integration-fix.yml
          python tools/arq_apply_integration_governance_fix.py
          git rm tools/arq_apply_integration_governance_fix.py
          git add -A
          python tools/verify_repository_contract.py --generate
          git add -A
          git diff --cached --check
          python -m compileall tools tests/governance
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt
      - name: Verify classifications and full repository
        run: |
          set -euo pipefail
          PYTHONPATH=.:polymarket python -m pytest -q tests/governance tests/paper_trial tests/monitoring
          PYTHONPATH=.:polymarket python -m pytest -q
      - name: Commit verified governance correction
        run: |
          set -euo pipefail
          git clean -fdx
          mkdir -p .github/workflows
          cp /tmp/arq-governance-integration-fix.yml .github/workflows/arq-governance-integration-fix.yml
          git add -A
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/arq-governance-integration-fix.yml$' || true)"
          git config user.name "SENEX ARQ"
          git config user.email "simonkey888@users.noreply.github.com"
          git commit -m "fix(governance): classify integrated package and research boundaries"
          git push origin HEAD:feat/senex-paper-execution-truth-v1
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
