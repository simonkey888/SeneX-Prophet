name: AUD063-R1-Apply

on:
  push:
    branches:
      - audit/aud-063-settlement-starvation-recovery

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Verify lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0320f47657d4433bfc4dc3396fd0d31ffabe2270 HEAD
          test "$(git rev-parse origin/main)" = "49c5f0a69609c005da80e48b585e91d8582a5ac6"
      - name: Apply R1 patch
        shell: bash
        run: |
          set -euo pipefail
          python senecio_polymarket/scripts/aud063_r1_apply_patch.py
      - name: Generate evidence and verify focused suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r senecio_polymarket/requirements.txt
          python senecio_polymarket/scripts/aud063_generate_evidence.py --out senecio_polymarket/docs/evidence
          cd senecio_polymarket
          python -m unittest tests.test_aud_063 -v 2>&1 | tee /tmp/aud063-r1-focused.log
          grep -Eq 'Ran 33 tests' /tmp/aud063-r1-focused.log
          grep -q '^OK$' /tmp/aud063-r1-focused.log
          python -m compileall -q .
      - name: Commit linear R1 candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/aud063-r1-apply.yml senecio_polymarket/scripts/aud063_r1_apply_patch.py
          git config user.name 'Simon Dalmasso'
          git config user.email 'simondalmasso44@gmail.com'
          git add .github/workflows/aud-063.yml senecio_polymarket/backend/settlement_contract.py senecio_polymarket/backend/supabase_client.py senecio_polymarket/backend/oracle_runner.py senecio_polymarket/tests/test_aud_063.py senecio_polymarket/scripts/aud063_generate_evidence.py senecio_polymarket/docs/AUD-063-REPORT.md senecio_polymarket/docs/evidence/aud-063-*.json
          git commit -m 'aud063-r1: close maturity restart fairness and startup quarantine'
          git push origin HEAD:audit/aud-063-settlement-starvation-recovery
