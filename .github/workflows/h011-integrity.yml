name: SENEX Repository-Wide Paper-Only Integrity

on:
  pull_request:
    branches:
      - feat/h011-v3-discovery-refresh
  push:
    branches:
      - feat/h011-v3-discovery-refresh

permissions:
  contents: read

concurrency:
  group: senex-paper-only-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-wide-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install exact hashed runtime and test requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r polymarket/requirements-h011-v3.txt \
            -r polymarket/requirements-h011-v3-test.txt

      - name: Verify dependency lock and repository-wide paper-only boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senex-paper-only
          python tools/verify_h011_dependency_lock.py \
            --runtime polymarket/requirements-h011-v3.txt \
            --test polymarket/requirements-h011-v3-test.txt \
            --output /tmp/senex-paper-only/dependency-lock.json
          python tools/verify_paper_only_repository.py \
            --repo-root . \
            --output /tmp/senex-paper-only/current.json
          python -m compileall -q exchange_connector.py polymarket senecio_polymarket tools tests
          PYTHONPATH=.:polymarket python -m pytest -q \
            tests/governance/test_paper_only_repository.py \
            tests/h011_v3 tests/cp

      - name: Prove the gate rejects the accepted pre-fix tree
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PRE_FIX_SHA: d5047b2055d30d199954dd4e68ae2e676aa8a4ba
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/senex-pre-fix "${PRE_FIX_SHA}"
          set +e
          python tools/verify_paper_only_repository.py \
            --repo-root /tmp/senex-pre-fix \
            --output /tmp/senex-paper-only/pre-fix.json
          rc=$?
          set -e
          test "$rc" -eq 1
          python - <<'PY'
          import json
          report=json.load(open('/tmp/senex-paper-only/pre-fix.json'))
          assert report['status']=='FAIL'
          paths={x['path'] for x in report['findings']}
          rules={x['rule'] for x in report['findings']}
          assert 'exchange_connector.py' in paths
          assert 'senecio_polymarket/oracle/exchange_connector.py' in paths
          assert '.github/workflows/oracle.yml' in paths
          assert 'AUTHENTICATED_TRADING_CALL' in rules
          assert 'TRADING_CREDENTIAL_LOADER' in rules
          assert 'WORKFLOW_WRITE_PERMISSION' in rules
          PY

      - name: Upload integrity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-paper-only-integrity-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/senex-paper-only
          retention-days: 30
          if-no-files-found: error
