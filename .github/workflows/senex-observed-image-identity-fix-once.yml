name: SENEX Observed Image Identity Fix Once

on:
  push:
    branches:
      - fix/senex-arm64-evidence-pinning-v3
    paths:
      - .github/workflows/senex-observed-image-identity-fix-once.yml

permissions:
  contents: write

jobs:
  fix-test-regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-evidence-pinning-v3
          persist-credentials: true

      - name: Replace tautological tag check with observed RepoTags evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script=Path('tools/verify_h011_arm64_reproducibility.sh')
          text=script.read_text(encoding='utf-8')
          old='''IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"\nIMAGE_REVISION_LABEL="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"\nprintf '%s\\n' "$IMAGE_ID" > "$EVIDENCE/runtime-image-id.txt"\nprintf '%s\\n' "$IMAGE_REVISION_LABEL" > "$EVIDENCE/runtime-image-revision-label.txt"\n[[ "$IMAGE" == "senex-h011-repro:${CANDIDATE_HEAD_SHA}" ]] \\\n  || die "RUNTIME_IMAGE_TAG_NOT_CANDIDATE_HEAD"\n[[ "$IMAGE_REVISION_LABEL" == "$CANDIDATE_HEAD_SHA" ]] \\\n  || die "RUNTIME_IMAGE_REVISION_LABEL_NOT_CANDIDATE_HEAD"\n{\n'''
          new='''IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"\nIMAGE_REVISION_LABEL="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"\nIMAGE_OBSERVED_TAG="$(docker image inspect "$IMAGE" --format '{{range .RepoTags}}{{println .}}{{end}}' \\\n  | awk -v expected="$IMAGE" '$0==expected {print; exit}')"\nprintf '%s\\n' "$IMAGE_ID" > "$EVIDENCE/runtime-image-id.txt"\nprintf '%s\\n' "$IMAGE_REVISION_LABEL" > "$EVIDENCE/runtime-image-revision-label.txt"\nprintf '%s\\n' "$IMAGE_OBSERVED_TAG" > "$EVIDENCE/runtime-image-observed-tag.txt"\n[[ "$IMAGE_OBSERVED_TAG" == "$IMAGE" ]] \\\n  || die "RUNTIME_IMAGE_TAG_NOT_CANDIDATE_HEAD"\n[[ "$IMAGE_REVISION_LABEL" == "$CANDIDATE_HEAD_SHA" ]] \\\n  || die "RUNTIME_IMAGE_REVISION_LABEL_NOT_CANDIDATE_HEAD"\nidentity_field=""\nfor identity_field in \\\n  CANDIDATE_HEAD_SHA CANDIDATE_HEAD_TREE EVENT_SHA IMAGE_OBSERVED_TAG IMAGE_ID \\\n  IMAGE_REVISION_LABEL QEMU_BINFMT_REFERENCE QEMU_BINFMT_DIGEST \\\n  BUILDKIT_REFERENCE BUILDKIT_DIGEST BUILDKIT_VERSION_1; do\n  [[ -n "${!identity_field}" && "${!identity_field}" != "unknown" ]] \\\n    || die "RUNTIME_IMAGE_IDENTITY_FIELD_EMPTY_${identity_field}"\ndone\n{\n'''
          if text.count(old)!=1:
              raise SystemExit(f'observed image anchor count={text.count(old)}')
          text=text.replace(old,new)
          text=text.replace("  printf 'IMAGE_TAG=%s\\n' \"$IMAGE\"\n  printf 'IMAGE_ID=%s\\n' \"$IMAGE_ID\"\n", "  printf 'IMAGE_TAG=%s\\n' \"$IMAGE_OBSERVED_TAG\"\n  printf 'IMAGE_ID=%s\\n' \"$IMAGE_ID\"\n", 1)
          old_count='''[[ "$(wc -l < "$EVIDENCE/runtime-image-identity.env")" -eq 11 ]] \\\n  || die "RUNTIME_IMAGE_IDENTITY_EVIDENCE_INCOMPLETE"\n'''
          if text.count(old_count)!=1:
              raise SystemExit(f'identity line-count anchor count={text.count(old_count)}')
          text=text.replace(old_count,'')
          old_json='''    "image_id": text("runtime-image-id.txt"),\n    "image_revision_label": text("runtime-image-revision-label.txt"),\n'''
          new_json='''    "image_id": text("runtime-image-id.txt"),\n    "image_observed_tag": text("runtime-image-observed-tag.txt"),\n    "image_revision_label": text("runtime-image-revision-label.txt"),\n'''
          if text.count(old_json)!=1:
              raise SystemExit(f'result image JSON anchor count={text.count(old_json)}')
          script.write_text(text.replace(old_json,new_json),encoding='utf-8')

          test=Path('tests/h011_v3/test_arm64_evidence_pinning.py')
          body=test.read_text(encoding='utf-8')
          marker='''        "runtime-image-identity.env",\n'''
          replacement='''        "runtime-image-identity.env",\n        "runtime-image-observed-tag.txt",\n        "IMAGE_OBSERVED_TAG",\n        "RUNTIME_IMAGE_IDENTITY_FIELD_EMPTY_",\n'''
          if body.count(marker)!=1:
              raise SystemExit(f'identity test marker count={body.count(marker)}')
          body=body.replace(marker,replacement)
          append='''\n\ndef test_runtime_tag_and_identity_completeness_are_observed_not_tautological() -> None:\n    text = HARNESS.read_text(encoding="utf-8")\n    assert "{{range .RepoTags}}{{println .}}{{end}}" in text\n    assert '[[ "$IMAGE_OBSERVED_TAG" == "$IMAGE" ]]' in text\n    assert '[[ "$IMAGE" == "senex-h011-repro:${CANDIDATE_HEAD_SHA}" ]]' not in text\n    assert 'wc -l < "$EVIDENCE/runtime-image-identity.env"' not in text\n    assert "for identity_field in" in text\n    assert '[[ -n "${!identity_field}"' in text\n'''
          if 'test_runtime_tag_and_identity_completeness_are_observed_not_tautological' not in body:
              body=body.rstrip()+append+'\n'
          test.write_text(body,encoding='utf-8')

          docs=Path('docs/H011_REPRODUCIBLE_RUNTIME.md')
          dtext=docs.read_text(encoding='utf-8')
          sentence='''\nThe runtime tag assertion is based on the actual `.RepoTags` returned by\n`docker image inspect`, not the variable used to invoke the build. Every\nidentity field is individually required to be non-empty before the runtime\nevidence can pass.\n'''
          if 'actual `.RepoTags`' not in dtext:
              docs.write_text(dtext.rstrip()+sentence,encoding='utf-8')
          PY
          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 -m py_compile tests/h011_v3/test_arm64_evidence_pinning.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('tests/h011_v3/test_arm64_evidence_pinning.py')
          spec=importlib.util.spec_from_file_location('pinning_test',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in sorted(x for x in dir(module) if x.startswith('test_')):
              getattr(module,name)()
          PY

      - name: Regenerate governance twice without temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          self='.github/workflows/senex-observed-image-identity-fix-once.yml'
          git rm --cached "$self"
          test -z "$(git ls-files | grep 'senex-.*-once.yml' || true)"
          python3 tools/verify_repository_contract.py --generate > /tmp/generate-one.json
          cp governance/repository_manifest.json /tmp/manifest-one.json
          cp governance/component_registry.json /tmp/registry-one.json
          cp governance/migration_map.json /tmp/migration-one.json
          cp governance/target_architecture.yaml /tmp/architecture-one.yaml
          python3 tools/verify_repository_contract.py --generate > /tmp/generate-two.json
          cmp /tmp/manifest-one.json governance/repository_manifest.json
          cmp /tmp/registry-one.json governance/component_registry.json
          cmp /tmp/migration-one.json governance/migration_map.json
          cmp /tmp/architecture-one.yaml governance/target_architecture.yaml
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          git restore --staged "$self"
          git add \
            tools/verify_h011_arm64_reproducibility.sh \
            tests/h011_v3/test_arm64_evidence_pinning.py \
            docs/H011_REPRODUCIBLE_RUNTIME.md \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git diff --check --cached
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'fix(senex): validate observed runtime image identity'
          git push origin HEAD:fix/senex-arm64-evidence-pinning-v3
