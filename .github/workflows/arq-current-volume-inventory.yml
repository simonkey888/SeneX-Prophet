name: ARQ Current Volume Inventory

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-current-volume-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: northflank-readonly-audit
    steps:
      - name: Capture current sanitized volume and job inventory
        shell: bash
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          mkdir -p evidence
          python - <<'PY'
          import datetime,hashlib,json,os,urllib.error,urllib.request
          base='https://api.northflank.com/v1'
          token=os.environ['NORTHFLANK_API_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'senex-current-inventory/1'}
          out={'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requests':[],'volumes':[],'jobs':[],'services':[],'secret_values_exported':False}
          def get(route,label):
              req=urllib.request.Request(base+route,headers=headers,method='GET')
              status=0; raw=b''
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: status=r.status; raw=r.read()
              except urllib.error.HTTPError as exc: status=exc.code; raw=exc.read()
              digest=hashlib.sha256(raw).hexdigest(); out['requests'].append({'label':label,'method':'GET','path':route,'status':status,'bytes':len(raw),'body_sha256':digest})
              try: obj=json.loads(raw.decode() or '{}')
              except Exception: obj={'non_json':True}
              if status!=200: raise SystemExit(f'{route} status={status} sha256={digest}')
              return obj.get('data',obj) if isinstance(obj,dict) else obj
          def items(obj,key):
              if isinstance(obj,list): return obj
              if isinstance(obj,dict):
                  value=obj.get(key,obj.get('items',[]))
                  return value if isinstance(value,list) else []
              return []
          volume_list=items(get('/projects/seneciobot/volumes?per_page=100','volumes'),'volumes')
          for volume in volume_list:
              vid=volume.get('id')
              detail=get(f'/projects/seneciobot/volumes/{vid}',f'volume:{vid}') if vid else volume
              out['volumes'].append({k:detail.get(k) for k in ('id','name','status','createdAt','updatedAt','spec','mounts','attachedObjects','source')})
          job_list=items(get('/projects/seneciobot/jobs?per_page=100','jobs'),'jobs')
          for job in job_list:
              out['jobs'].append({k:job.get(k) for k in ('id','name','type','createdAt','updatedAt','status')})
          service_list=items(get('/projects/seneciobot/services?per_page=100','services'),'services')
          for service in service_list:
              out['services'].append({k:service.get(k) for k in ('id','name','type','createdAt','updatedAt','status')})
          encoded=json.dumps(out,sort_keys=True,indent=2).encode()+b'\n'
          open('evidence/current_inventory.json','wb').write(encoded)
          open('evidence/SHA256SUMS','w').write(hashlib.sha256(encoded).hexdigest()+'  current_inventory.json\n')
          print(json.dumps({'volumes':out['volumes'],'jobs':out['jobs'],'services':out['services'],'request_count':len(out['requests']),'secret_values_exported':False},sort_keys=True))
          PY
          (cd evidence && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-current-inventory-${{ github.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
