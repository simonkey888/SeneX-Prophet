name: SENEX 020 Regenerate Governance

on:
  push:
    branches:
      - feat/senex-mega-research-fusion-v2
    paths:
      - ".github/workflows/senex-020-regenerate-governance.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact 020 head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Regenerate deterministic governance and self-retire
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/senex-mega-research-fusion-v2"
          git config user.name "senex-arq-020"
          git config user.email "senex-arq-020@users.noreply.github.com"
          git rm --quiet .github/workflows/senex-020-regenerate-governance.yml
          python tools/verify_repository_contract.py --generate
          test "$(python - <<'PY'
          import json
          print(json.load(open('governance/repository_manifest.json'))['files_tracked_total'])
          PY
          )" = "331"
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          git add governance/repository_manifest.json governance/repository_manifest.json.sha256 \
            governance/component_registry.json governance/migration_map.json governance/target_architecture.yaml
          mapfile -t changed < <(git diff --cached --name-only | sort)
          allowed=(
            .github/workflows/senex-020-regenerate-governance.yml
            governance/component_registry.json
            governance/migration_map.json
            governance/repository_manifest.json
            governance/repository_manifest.json.sha256
            governance/target_architecture.yaml
          )
          for path in "${changed[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/senex-020-regenerate-governance.yml' >/dev/null
          printf '%s\n' "${changed[@]}" | grep -Fx 'governance/repository_manifest.json' >/dev/null
          printf '%s\n' "${changed[@]}" | grep -Fx 'governance/repository_manifest.json.sha256' >/dev/null
          git diff --cached --check
          git commit -m "chore(mega-research): regenerate governance after duplicate classification"
          git push origin HEAD:refs/heads/feat/senex-mega-research-fusion-v2
