name: ARQ Rebind CI Base

on:
  push:
    branches:
      - ops/senex-phases-fh-predeployment-20260805
    paths:
      - .github/workflows/arq-rebind-ci-base.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ops/senex-phases-fh-predeployment-20260805
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Exclude temporary finalizer and generate candidate manifests
        run: |
          set -euo pipefail
          cp .github/workflows/arq-rebind-ci-base.yml /tmp/arq-rebind-ci-base.yml
          git rm .github/workflows/arq-rebind-ci-base.yml
          python tools/verify_repository_contract.py --generate
      - name: Verify exact governed candidate
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt
          PYTHONPATH=.:polymarket python -m pytest -q tests/operations tests/governance tests/paper_trial tests/monitoring
          PYTHONPATH=.:polymarket python -m pytest -q
          git clean -fdx
          python tools/verify_repository_contract.py --generate
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest=json.loads(Path('governance/repository_manifest.json').read_text())
          actual=sorted(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          expected=sorted(item['path'] for item in manifest['files'])
          assert manifest['files_tracked_total'] == len(actual)
          assert expected == actual, {'missing':sorted(set(actual)-set(expected)),'extra':sorted(set(expected)-set(actual))}
          assert '.github/workflows/arq-rebind-ci-base.yml' not in actual
          PY
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          git add governance/repository_manifest.json governance/repository_manifest.json.sha256 governance/component_registry.json governance/migration_map.json governance/target_architecture.yaml
          git diff --cached --check
      - name: Commit without workflow mutation
        run: |
          set -euo pipefail
          git restore --staged .github/workflows/arq-rebind-ci-base.yml
          mkdir -p .github/workflows
          cp /tmp/arq-rebind-ci-base.yml .github/workflows/arq-rebind-ci-base.yml
          test -z "$(git diff --name-only -- .github/workflows/arq-rebind-ci-base.yml)"
          git config user.name "SENEX ARQ"
          git config user.email "simonkey888@users.noreply.github.com"
          git commit -m "chore(governance): bind dynamic exact-base workflows"
          git push origin HEAD:ops/senex-phases-fh-predeployment-20260805
