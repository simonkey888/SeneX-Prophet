name: SENEX 021 Governance Diagnose

on:
  push:
    branches:
      - feat/senex-real-data-evidence-campaign-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Diagnose fixed-tree generator drift
        shell: bash
        run: |
          set -euo pipefail
          cp governance/repository_manifest.json /tmp/manifest.committed
          cp governance/component_registry.json /tmp/registry.committed
          cp governance/migration_map.json /tmp/migration.committed
          cp governance/target_architecture.yaml /tmp/architecture.committed
          git rm .github/workflows/senex-021-governance-diagnose.yml >/dev/null
          python tools/verify_repository_contract.py --root . --generate >/tmp/generated.json
          echo '=== MANIFEST DIFF ==='
          diff -u /tmp/manifest.committed governance/repository_manifest.json | head -200 || true
          echo '=== REGISTRY DIFF ==='
          diff -u /tmp/registry.committed governance/component_registry.json | head -120 || true
          echo '=== MIGRATION DIFF ==='
          diff -u /tmp/migration.committed governance/migration_map.json | head -80 || true
          echo '=== ARCH DIFF ==='
          diff -u /tmp/architecture.committed governance/target_architecture.yaml | head -80 || true
          echo '=== HASHES ==='
          sha256sum /tmp/manifest.committed governance/repository_manifest.json /tmp/registry.committed governance/component_registry.json /tmp/migration.committed governance/migration_map.json /tmp/architecture.committed governance/target_architecture.yaml
