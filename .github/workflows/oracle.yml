name: SENECIO Oracle Read-Only Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senecio-oracle-read-only-evidence
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Verify read-only paper boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senecio-oracle-evidence
          python tools/verify_paper_only_repository.py \
            --repo-root . \
            --output /tmp/senecio-oracle-evidence/paper-only-repository.json
          python -m compileall -q exchange_connector.py senecio_polymarket/oracle
          python exchange_connector.py | tee /tmp/senecio-oracle-evidence/public-connector-self-test.log
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload read-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senecio-oracle-read-only-${{ github.sha }}
          path: /tmp/senecio-oracle-evidence
          retention-days: 14
          if-no-files-found: error
