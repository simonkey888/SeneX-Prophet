# SENECIO Oracle Cycle — manual diagnostic artifact only
# NOTE (ACT XIX): scheduled cron DISABLED — oracle now runs in Northflank
# every 15 min via backend/oracle_runner.py. This workflow is kept for
# manual backfill / verification only (workflow_dispatch).
name: SENECIO Oracle Cycle

on:
  # schedule:
  #   - cron: '*/15 * * * *'   # disabled — moved to Northflank
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "oracle-cycle"
  cancel-in-progress: false

jobs:
  predict-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ── PREDICTION PIPELINE ──

      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify past predictions
        run: |
          echo "=== VERIFY — filling outcomes for past predictions ==="
          python3 predict_only.py --verify --symbol ETH/USDT 2>&1 || true
          python3 predict_only.py --verify --symbol BTC/USDT 2>&1 || true

      - name: Run Oracle — ETH/USDT
        run: |
          echo "=== SENECIO ORACLE — $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          python3 predict_only.py --symbol ETH/USDT --timeframe 15m --json 2>&1 | tee oracle_cycle.log

      - name: Run Oracle — BTC/USDT
        run: |
          python3 predict_only.py --symbol BTC/USDT --timeframe 15m --json 2>&1 | tee oracle_cycle_btc.log || true

      - name: Data quality gate — remove garbage entries from diagnostic copy
        run: |
          python3 -c "
          import json
          with open('senecio_output/predictions.jsonl') as f:
              lines = [l.strip() for l in f if l.strip()]
          clean = []
          removed = 0
          for line in lines:
              p = json.loads(line)
              if p.get('price_now', 0) == 0 and p.get('confidence', 0) == 0:
                  removed += 1
              else:
                  clean.append(line)
          if removed > 0:
              with open('senecio_output/predictions.jsonl', 'w') as f:
                  for line in clean:
                      f.write(line + '\n')
              print(f'Data quality gate: removed {removed} garbage, kept {len(clean)}')
          else:
              print(f'Data quality gate: all {len(clean)} entries clean')
          "

      - name: Health check — verify diagnostic predictions exist
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone, timedelta
          with open('senecio_output/predictions.jsonl') as f:
              preds = [json.loads(l.strip()) for l in f if l.strip()]
          now = datetime.now(timezone.utc)
          one_hour_ago = now - timedelta(hours=1)
          recent = [p for p in preds
                    if p.get('timestamp') and
                    datetime.fromisoformat(p['timestamp'].replace('Z','+00:00')) > one_hour_ago
                    and p.get('price_now', 0) > 0]
          if len(recent) == 0:
              print(f'HEALTH CHECK FAILED: No valid predictions in the last hour')
              print(f'Total predictions: {len(preds)}, Recent valid: {len(recent)}')
              exit(1)
          else:
              print(f'HEALTH CHECK OK: {len(recent)} valid prediction(s) in the last hour')
          "

      - name: Generate Oracle Lab report
        run: |
          python3 oracle_lab.py 2>&1 | tee oracle_lab.log || true

      - name: Upload diagnostic outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: senecio-oracle-diagnostic-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            senecio_output/predictions.jsonl
            senecio_output/oracle_report.json
            senecio_output/oracle_report.md
            senecio_output/last_heartbeat.json
            oracle_cycle.log
            oracle_cycle_btc.log
            oracle_lab.log
