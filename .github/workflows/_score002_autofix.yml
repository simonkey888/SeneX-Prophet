name: SCORE-002 Authorized Autofix

on:
  push:
    branches: [fix/senex-score-002-authoritative-reconciliation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[score-002-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: senecio_polymarket
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply SCORE-002 fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(path, old, new):
              p = root / path
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # Proof gate: central reusable filter + scorer boundary.
          proof = root / 'backend/settlement_proof.py'
          s = proof.read_text(encoding='utf-8')
          marker = 'def proof_status(row: dict[str, Any]) -> str:\n'
          if 'def filter_proof_qualified' not in s:
              insert = '''def filter_proof_qualified(rows: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    """Return only rows that satisfy the complete authoritative proof contract."""\n    return [row for row in rows if is_proof_qualified(row)]\n\n\ndef score_qualified_rows(rows: list[dict[str, Any]]) -> dict[str, Any]:\n    """Compute the authoritative 1h score from proof-qualified rows only."""\n    verified = filter_proof_qualified(rows)\n    wins = sum(1 for row in verified if row.get("outcome") == "WIN")\n    losses = sum(1 for row in verified if row.get("outcome") == "LOSS")\n    return {\n        "rows": verified,\n        "verified": len(verified),\n        "wins": wins,\n        "losses": losses,\n        "win_rate_pct": (wins / len(verified) * 100) if verified else 0.0,\n    }\n\n\n'''
              proof.write_text(s.replace(marker, insert + marker), encoding='utf-8')

          # Main scorer/live gate/research-derived metrics: use the gate.
          main = root / 'backend/main.py'
          s = main.read_text(encoding='utf-8')
          s = s.replace('from . import oracle_runner\n', 'from . import oracle_runner\nfrom .settlement_proof import filter_proof_qualified, score_qualified_rows\n', 1)
          s = s.replace('verified = [r for r in rows if r.get("outcome") in ("WIN", "LOSS")]', 'verified = filter_proof_qualified(rows)')
          s = s.replace('''        outcome = (rec.get("outcome") or "").upper()\n        if outcome in ("WIN", "CORRECT"):\n''', '''        from .settlement_proof import is_proof_qualified\n        if not is_proof_qualified(rec):\n            continue\n        outcome = (rec.get("outcome") or "").upper()\n        if outcome in ("WIN", "CORRECT"):\n''')
          main.write_text(s, encoding='utf-8')

          # Oracle producer: persist origin_price_v1 at prediction creation time.
          oracle = root / 'backend/oracle_runner.py'
          s = oracle.read_text(encoding='utf-8')
          s = s.replace('from typing import Any, Optional\n', 'from typing import Any, Optional\n\nfrom .settlement_proof import is_proof_qualified\n', 1)
          anchor = '''        if "_audit" in prediction:\n            prediction["_audit"]["exchange_used"] = exchange_used\n\n'''
          origin_block = '''        if "_audit" in prediction:\n            prediction["_audit"]["exchange_used"] = exchange_used\n\n        # SCORE-002: immutable origin witness captured at prediction time.\n        # The timestamp is exactly the prediction timestamp and the source is\n        # the exchange that supplied the prediction snapshot.\n        audit = prediction.setdefault("_audit", {})\n        if not isinstance(audit, dict):\n            audit = {}\n            prediction["_audit"] = audit\n        audit["origin_price_v1"] = {\n            "version": "origin-price-v1",\n            "price": float(prediction.get("price_now") or 0),\n            "timestamp": prediction.get("timestamp"),\n            "source": exchange_used,\n        }\n\n'''
          if '"origin-price-v1"' not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('oracle_runner: origin anchor mismatch')
              s = s.replace(anchor, origin_block, 1)
          # Gate directional stats on proof qualification.
          old = '''        if direction not in ("LONG", "SHORT", "FLAT"):\n            continue\n        # 1h outcome = primary outcome column\n'''
          new = '''        if direction not in ("LONG", "SHORT", "FLAT"):\n            continue\n        if not is_proof_qualified(r):\n            continue\n        # 1h outcome = primary outcome column\n'''
          if old in s:
              s = s.replace(old, new, 1)
          old2 = '''    _state["directional_stats"]["by_window"] = by_window\n\n    # Apply gates'''
          new2 = '''    _state["directional_stats"]["by_window"] = by_window\n    # Only proof-qualified rows are authoritative evidence.\n    _state["verified_total"] = by_window["1h"]["global"]["verified"]\n\n    # Apply gates'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          oracle.write_text(s, encoding='utf-8')

          # Forensics: only proof-qualified rows enter statistical evidence.
          fp = root / 'backend/forensics/pipeline.py'
          s = fp.read_text(encoding='utf-8')
          s = s.replace('from typing import Any, Optional\n', 'from typing import Any, Optional\n\nfrom ..settlement_proof import is_proof_qualified\n', 1)
          s = s.replace('if r.get("outcome") in ("WIN", "LOSS"):', 'if is_proof_qualified(r):', 1)
          fp.write_text(s, encoding='utf-8')

          # Research coordinator: feature matrix is an authoritative metric boundary.
          rc = root / 'backend/research/coordinator.py'
          s = rc.read_text(encoding='utf-8')
          s = s.replace('from .observability import get_registry, timed\n', 'from .observability import get_registry, timed\nfrom ..settlement_proof import is_proof_qualified\n', 1)
          s = s.replace('''            outcome = (rec.get("outcome") or "").upper()\n            if outcome not in ("WIN", "LOSS"):\n                continue\n''', '''            if not is_proof_qualified(rec):\n                continue\n            outcome = (rec.get("outcome") or "").upper()\n''', 1)
          rc.write_text(s, encoding='utf-8')

          # Reconciler: evidence repair only; never mutate outcome; protect PATCH with CAS-like filters.
          rr = root / 'backend/settlement_reconciler.py'
          s = rr.read_text(encoding='utf-8')
          s = s.replace('total_scanned = repaired = skipped = errors = 0', 'total_scanned = repaired = skipped = errors = conflicts = 0', 1)
          old = '''                    audit["outcomes_dual"] = {\n                        "outcome_15m": o15,\n                        "outcome_1h": o1h,\n                        "price_15m_later": p15,\n                        "price_1h_later": p1h,\n                        "primary_window": "1h",\n                        "reconciled_by": "SENEX-SCORE-002",\n                        "reconciled_at": datetime.now(timezone.utc).isoformat(),\n                    }\n                    patch = {"outcome": o1h, "price_15m_later": p15, "audit": audit}\n                    pr = await client.patch(\n                        f"{SUPABASE_URL}/rest/v1/{SUPABASE_TABLE}",\n                        params={"id": f"eq.{row['id']}"},\n                        json=patch,\n                    )\n                    try:\n                        body = pr.json() if pr.content else []\n                    except Exception:\n                        body = []\n                    if pr.status_code in (200, 204) and isinstance(body, list) and body:\n                        repaired += 1\n                        log.info("reconciled id=%s primary=%s dual15=%s dual1h=%s", row["id"], o1h, o15, o1h)\n                    else:\n                        errors += 1\n                        log.error("reconcile update failed id=%s status=%s body=%r", row["id"], pr.status_code, body)\n'''
          new = '''                    stored_outcome = row.get("outcome")\n                    conflict = stored_outcome != o1h\n                    audit["outcomes_dual"] = {\n                        "outcome_15m": o15,\n                        "outcome_1h": o1h,\n                        "price_15m_later": p15,\n                        "price_1h_later": p1h,\n                        "primary_window": "1h",\n                        "reconciled_by": "SENEX-SCORE-002",\n                        "reconciled_at": datetime.now(timezone.utc).isoformat(),\n                    }\n                    if conflict:\n                        audit["reconciliation_conflict"] = {\n                            "stored_outcome": stored_outcome,\n                            "computed_outcome_1h": o1h,\n                            "detected_at": datetime.now(timezone.utc).isoformat(),\n                            "action": "NO_OUTCOME_OVERWRITE",\n                        }\n                    else:\n                        audit.pop("reconciliation_conflict", None)\n\n                    # Evidence-only repair. The existing outcome is immutable here.\n                    # Both outcome and outcomes_dual-null are CAS-like PATCH filters,\n                    # so a concurrent authority write causes a confirmed no-op.\n                    patch = {"price_15m_later": p15, "audit": audit}\n                    pr = await client.patch(\n                        f"{SUPABASE_URL}/rest/v1/{SUPABASE_TABLE}",\n                        params={\n                            "id": f"eq.{row['id']}",\n                            "outcome": f"eq.{stored_outcome}",\n                            "audit->outcomes_dual": "is.null",\n                        },\n                        json=patch,\n                    )\n                    try:\n                        body = pr.json() if pr.content else []\n                    except Exception:\n                        body = []\n                    if pr.status_code in (200, 204) and isinstance(body, list) and body:\n                        if conflict:\n                            conflicts += 1\n                            log.warning(\n                                "reconciled evidence conflict id=%s stored=%s computed_1h=%s; outcome left unchanged",\n                                row["id"], stored_outcome, o1h,\n                            )\n                        else:\n                            repaired += 1\n                            log.info("reconciled evidence id=%s primary=%s dual15=%s dual1h=%s", row["id"], stored_outcome, o15, o1h)\n                    else:\n                        errors += 1\n                        log.error("reconcile update failed/no-op id=%s status=%s body=%r", row["id"], pr.status_code, body)\n'''
          if old not in s:
              raise SystemExit('settlement_reconciler: patch block mismatch')
          s = s.replace(old, new, 1)
          s = s.replace('result = {"scanned": total_scanned, "repaired": repaired, "skipped": skipped, "errors": errors}', 'result = {"scanned": total_scanned, "repaired": repaired, "skipped": skipped, "errors": errors, "conflicts": conflicts}', 1)
          rr.write_text(s, encoding='utf-8')

          # Remove all Supabase credential fallbacks repo-wide for Python sources.
          for p in root.rglob('*.py'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              text2 = re.sub(r'os\.environ\.get\(\s*"SUPABASE_URL"\s*,\s*"[^"]+"\s*\)', 'os.environ.get("SUPABASE_URL")', text)
              text2 = re.sub(r'os\.environ\.get\(\s*"SUPABASE_KEY"\s*,\s*"[^"]+"\s*\)', 'os.environ.get("SUPABASE_KEY")', text2)
              if text2 != text:
                  p.write_text(text2, encoding='utf-8')

          # Tests: update the old expectation and add race/pagination/retry/scorer-boundary coverage.
          test = root / 'tests/test_senex_score_002.py'
          s = test.read_text(encoding='utf-8')
          s = s.replace('from backend.settlement_proof import is_proof_qualified, proof_status\n', 'from backend.settlement_proof import filter_proof_qualified, is_proof_qualified, proof_status, score_qualified_rows\n', 1)
          s = s.replace('self.assertEqual(patch["outcome"], "WIN")\n', 'self.assertNotIn("outcome", patch)\n        self.assertEqual(client.patch_calls[0][1]["audit->outcomes_dual"], "is.null")\n        self.assertEqual(client.patch_calls[0][1]["outcome"], "eq.WIN")\n', 1)
          s = s.replace('''    def test_patch_failure_never_counts_as_repaired(self):\n''', '''    def test_conflicting_1h_evidence_never_overwrites_outcome(self):\n        rows = [{"id": 6, "ts": TS, "symbol": "BTCUSDT", "prediction": "LONG", "price_now": 100, "outcome": "WIN", "audit": None, "exchange_used": "okx"}]\n        result, client = run_reconcile(rows)\n        # Default fake prices are WIN/WIN; force the 1h computation to LOSS.\n        # Re-run with a client-level price override below.\n        self.assertEqual(result["repaired"], 1)\n\n    def test_patch_failure_never_counts_as_repaired(self):\n''', 1)
          # Replace the placeholder conflict test with a deterministic custom run helper.
          s = s.replace('''    def test_conflicting_1h_evidence_never_overwrites_outcome(self):\n        rows = [{"id": 6, "ts": TS, "symbol": "BTCUSDT", "prediction": "LONG", "price_now": 100, "outcome": "WIN", "audit": None, "exchange_used": "okx"}]\n        result, client = run_reconcile(rows)\n        # Default fake prices are WIN/WIN; force the 1h computation to LOSS.\n        # Re-run with a client-level price override below.\n        self.assertEqual(result["repaired"], 1)\n\n''', '''    def test_conflicting_1h_evidence_never_overwrites_outcome(self):\n        rows = [{"id": 6, "ts": TS, "symbol": "BTCUSDT", "prediction": "LONG", "price_now": 100, "outcome": "WIN", "audit": None, "exchange_used": "okx"}]\n        client = FakeClient(rows)\n        old_url, old_key, old_limit = reconciler.SUPABASE_URL, reconciler.SUPABASE_KEY, reconciler.BATCH_LIMIT\n        reconciler.SUPABASE_URL = "https://example.supabase.co"\n        reconciler.SUPABASE_KEY = "test-key"\n        reconciler.BATCH_LIMIT = 50\n        try:\n            with patch.object(reconciler.httpx, "AsyncClient", return_value=client), patch.object(reconciler.ccxt, "okx", return_value=FakeExchange()), patch.object(reconciler, "_price_at", side_effect=lambda *args: 101.0 if args[-1] == 900 else 99.0):\n                result = asyncio.run(reconciler.reconcile_once())\n        finally:\n            reconciler.SUPABASE_URL, reconciler.SUPABASE_KEY, reconciler.BATCH_LIMIT = old_url, old_key, old_limit\n        self.assertEqual(result["repaired"], 0)\n        self.assertEqual(result["conflicts"], 1)\n        patch = client.patch_calls[0][2]\n        self.assertNotIn("outcome", patch)\n        self.assertEqual(patch["audit"]["reconciliation_conflict"]["action"], "NO_OUTCOME_OVERWRITE")\n\n''', 1)
          # Add explicit scorer-boundary and retry tests before ProofQualificationTests.
          marker = '\n\nclass ProofQualificationTests(unittest.TestCase):\n'
          extra = '''\n\nclass AuthoritativeScoringBoundaryTests(unittest.TestCase):\n    def _qualified(self):\n        return {\n            "ts": TS, "prediction": "LONG", "outcome": "WIN",\n            "audit": {\n                "origin_price_v1": {"version": "origin-price-v1", "price": 100, "timestamp": TS, "source": "okx"},\n                "outcomes_dual": {"outcome_15m": "WIN", "outcome_1h": "WIN", "price_15m_later": 101, "price_1h_later": 102, "primary_window": "1h"},\n            },\n        }\n\n    def test_only_proof_qualified_rows_enter_authoritative_score(self):\n        qualified = self._qualified()\n        raw = {"ts": TS, "prediction": "LONG", "outcome": "WIN", "audit": None}\n        dual_only = {"ts": TS, "prediction": "LONG", "outcome": "LOSS", "audit": {"outcomes_dual": {"outcome_15m": "LOSS", "outcome_1h": "LOSS", "price_15m_later": 99, "price_1h_later": 98, "primary_window": "1h"}}}\n        rows = [qualified, raw, dual_only]\n        self.assertEqual(len(filter_proof_qualified(rows)), 1)\n        scored = score_qualified_rows(rows)\n        self.assertEqual(scored["verified"], 1)\n        self.assertEqual(scored["wins"], 1)\n        self.assertEqual(scored["losses"], 0)\n        self.assertEqual(scored["win_rate_pct"], 100.0)\n\n    def test_patch_failure_is_retryable_next_cycle(self):\n        rows = [{"id": 7, "ts": TS, "symbol": "BTCUSDT", "prediction": "LONG", "price_now": 100, "outcome": "WIN", "audit": None, "exchange_used": "okx"}]\n        first, first_client = run_reconcile(rows, patch_status=500)\n        second, second_client = run_reconcile(rows, patch_status=500)\n        self.assertEqual(first["repaired"], 0)\n        self.assertEqual(second["repaired"], 0)\n        self.assertEqual(first["errors"], 1)\n        self.assertEqual(second["errors"], 1)\n        self.assertEqual(len(first_client.patch_calls), 1)\n        self.assertEqual(len(second_client.patch_calls), 1)\n\n'''
          if marker in s and 'class AuthoritativeScoringBoundaryTests' not in s:
              s = s.replace(marker, extra + marker, 1)
          test.write_text(s, encoding='utf-8')

          # Ensure the legacy verifier cannot carry embedded credentials and remains outside production launcher.
          legacy = root / 'oracle/oracle_verifier.py'
          text = legacy.read_text(encoding='utf-8')
          if 'supabase.co"' in text or 'sb_publishable_' in text:
              raise SystemExit('legacy verifier still contains hardcoded Supabase credential')

          print('SCORE-002 source modifications applied')
          PY

      - name: Verify source invariants
        run: |
          python -m py_compile backend/settlement_proof.py backend/settlement_reconciler.py backend/oracle_runner.py backend/supabase_client.py backend/main.py backend/forensics/pipeline.py backend/research/coordinator.py
          sh -n start_single_authority.sh
          ! grep -RInE 'supabase\.co|sb_publishable_[A-Za-z0-9_-]+' --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' .
          grep -RIn 'origin-price-v1' backend/oracle_runner.py backend/settlement_proof.py
          grep -RIn 'filter_proof_qualified' backend/main.py backend/settlement_proof.py
          grep -RIn 'is_proof_qualified' backend/oracle_runner.py backend/forensics/pipeline.py backend/research/coordinator.py
          grep -n 'audit->outcomes_dual.*is.null' backend/settlement_reconciler.py
          ! grep -n 'patch = {"outcome"' backend/settlement_reconciler.py

      - name: Run focused SCORE-002 tests
        run: python -m unittest discover -s tests -p 'test_senex_score_002.py' -v

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile full Python tree
        run: python -m compileall -q .

      - name: Repo-wide raw outcome audit
        run: |
          echo '--- raw outcome comparison inventory ---'
          grep -RInE 'outcome[[:space:]]*(in|==)|get\("outcome"\).*WIN|outcome.*LOSS' --include='*.py' backend oracle tests || true

      - name: Commit and push fixes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(score-002): enforce proof-qualified scoring and safe reconciliation [score-002-autofix]'
          git push origin "$BRANCH"
