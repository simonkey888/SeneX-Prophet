name: ORDER-069 Binance Futures Shadow E2E

on:
  push:
    branches: [feat/order-069-binance-futures-shadow]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/order-069-binance-futures-shadow.yml'
      - 'senecio_polymarket/backend/portfolio/binance_usdm_shadow.py'
      - 'senecio_polymarket/backend/portfolio/shadow_live.py'
      - 'senecio_polymarket/scripts/order069_e2e.py'
      - 'senecio_polymarket/tests/test_order_069.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 43c8023d3a4623381e45da02d9efa8e9b5888f47
  BASE_TREE: 20ec5775ea37a7288e8cd8748ea304843d9b0866

jobs:
  order069-semantic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Assert exact base head and isolated scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          bad="$(git diff --name-only "$BASE_SHA...HEAD" | grep -Ev '^(\.github/workflows/order-069-binance-futures-shadow\.yml|senecio_polymarket/backend/portfolio/binance_usdm_shadow\.py|senecio_polymarket/backend/portfolio/shadow_live\.py|senecio_polymarket/scripts/order069_e2e\.py|senecio_polymarket/tests/test_order_069\.py)$' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! git diff --name-only "$BASE_SHA...HEAD" | grep -Eiq 'runtime017|runtime_017|oracle_runtime|execution_engine\.py|risk_engine\.py|live_gate\.py|supabase|northflank|dockerfile'
          git diff --check "$BASE_SHA...HEAD"
          echo PRODUCTION_MUTATION=0
          echo RUNTIME017_MUTATION=0
          echo MODEL_WEIGHT_THRESHOLD_TUNING=0
          echo REAL_ORDER_COUNT=0
          echo REAL_CAPITAL_MOVEMENT=0

      - name: Install SENEX dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r senecio_polymarket/requirements.txt

      - name: Focused ORDER-069 offline adversarial and failure matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/order069"
          python -m unittest -v senecio_polymarket/tests/test_order_069.py 2>&1 | tee "$RUNNER_TEMP/order069/focused-tests.log"
          grep -F 'Ran 19 tests' "$RUNNER_TEMP/order069/focused-tests.log"
          grep -F 'OK' "$RUNNER_TEMP/order069/focused-tests.log"
          python -m py_compile senecio_polymarket/backend/portfolio/binance_usdm_shadow.py senecio_polymarket/backend/portfolio/shadow_live.py senecio_polymarket/scripts/order069_e2e.py senecio_polymarket/tests/test_order_069.py

      - name: Relevant portfolio regression smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/order069/portfolio-regression.log"
          import tempfile
          from pathlib import Path
          from senecio_polymarket.backend.portfolio.shadow_live import ShadowLive
          with tempfile.TemporaryDirectory() as td:
              s=ShadowLive(config={"fetch_real_book":False,"output_path":str(Path(td)/"trades.jsonl"),"report_path":str(Path(td)/"report.json")})
              assert s.stats()["n_trades"] == 0
              r=s.generate_report(); assert r["passed"] is False and r["status"] == "insufficient_data"
          print("PORTFOLIO_SHADOWLIVE_BACKCOMPAT=PASS")
          PY
          grep -F 'PORTFOLIO_SHADOWLIVE_BACKCOMPAT=PASS' "$RUNNER_TEMP/order069/portfolio-regression.log"

      - name: Live official Binance USD-M public E2E plus current SENEX decision
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/order069/evidence"
          mkdir -p "$E"
          python senecio_polymarket/scripts/order069_e2e.py --out "$E" --source-sha "$(git rev-parse HEAD)" 2>&1 | tee "$RUNNER_TEMP/order069/live-e2e.log"

      - name: Secret-scan captured logs and evidence
        shell: bash
        run: |
          set -euo pipefail
          P='(-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9._-]{16,}|(api[_-]?secret|api[_-]?key)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_.-]{16,})'
          ! grep -RIE --binary-files=without-match "$P" "$RUNNER_TEMP/order069"
          echo LOG_AND_EVIDENCE_SECRET_SCAN=PASS

      - name: Fail-closed ORDER-069 terminal semantic gate
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/order069/evidence"
          python - "$E" "$(git rev-parse HEAD)" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          e=Path(sys.argv[1]); head=sys.argv[2]
          required={'order069_manifest.json','remote_baseline.json','binance_public_live_capture_manifest.json','binance_public_live_capture.json','senex_decision_envelope.json','shadow_intent.json','shadow_ledger.json','replay_result.json','network_allowlist_audit.json','forbidden_call_audit.json','secret_scan.json','test_summary.json','sha256sums.txt'}
          names={p.name for p in e.iterdir() if p.is_file()}; assert required <= names; assert bool({'shadow_fill.json','no_order.json'} & names)
          m=json.loads((e/'order069_manifest.json').read_text()); assert m['source_sha']==head and m['base_sha']=='43c8023d3a4623381e45da02d9efa8e9b5888f47'
          for k in ('OFFLINE_LONG_E2E','OFFLINE_SHORT_E2E','OFFLINE_FLAT_E2E','LIVE_BINANCE_USDM_PUBLIC_E2E','REAL_SENEX_DECISION_ROUTED','BINANCE_FILTER_VALIDATION','DETERMINISTIC_BOOK_WALK','REPLAY_BYTE_STABLE','FORBIDDEN_NETWORK_BOUNDARY','SECRET_SCAN','FAILURE_MATRIX','REGRESSION_SUITE','EVIDENCE_MANIFEST'):
              assert m[k]=='PASS',(k,m.get(k))
          for k in ('PRIVATE_ENDPOINT_CALLS','REAL_ORDER_COUNT','REAL_CAPITAL_MOVEMENT','SUPABASE_MUTATION','PRODUCTION_MUTATION','RUNTIME017_MUTATION','MODEL_WEIGHT_THRESHOLD_TUNING','EXTERNAL_DIRECTIONAL_ACTIVATION'):
              assert m[k]==0,(k,m.get(k))
          r=json.loads((e/'replay_result.json').read_text()); assert r['REPLAY_BYTE_STABLE']=='PASS' and r['first_route_sha256']==r['replay_route_sha256']
          n=json.loads((e/'network_allowlist_audit.json').read_text()); assert n['status']=='PASS' and n['NETWORK_METHODS_USED']==['GET'] and n['PRIVATE_ENDPOINT_CALLS']==0
          f=json.loads((e/'forbidden_call_audit.json').read_text()); assert f['status']=='PASS' and not f['transport_calls_after_denials']
          s=json.loads((e/'secret_scan.json').read_text()); assert s['status']=='PASS'
          for line in (e/'sha256sums.txt').read_text().splitlines():
              h,name=line.split('  ',1); assert hashlib.sha256((e/name).read_bytes()).hexdigest()==h,(name,'digest')
          print('ORDER_069_SEMANTIC_GATE=PASS')
          print('REGRESSION_SUITE=PASS')
          PY

      - name: Upload exact-head ORDER-069 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: order-069-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/order069/evidence/
          if-no-files-found: error
          retention-days: 14
