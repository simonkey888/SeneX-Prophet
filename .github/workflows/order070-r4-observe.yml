name: ORDER070 R5 Repository Scoped Northflank Probe
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-r4-observe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Bounded GET auth probe using repository-scoped secret only
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python - <<'PY'
          import json,os,urllib.error,urllib.request
          api='https://api.northflank.com/v1'
          token=os.environ['NORTHFLANK_API_TOKEN']
          def probe(path):
              req=urllib.request.Request(api+path,headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'senex-order070-r5-repo-scope/1'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(); return r.status,len(raw)
              except urllib.error.HTTPError as e:
                  raw=e.read(); return e.code,len(raw)
          p=probe('/projects/seneciobot')
          d=probe('/projects/seneciobot/services/senecio-h011/deployment')
          print('REPOSITORY_SECRET_SOURCE=NO_ENVIRONMENT_SHADOW')
          print(f'PROJECT_HTTP={p[0]}')
          print(f'DEPLOYMENT_HTTP={d[0]}')
          ok=200<=p[0]<300 and 200<=d[0]<300
          print('AUTH_PROBE='+('PASS' if ok else 'FAIL'))
          if not ok: raise SystemExit(1)
          PY
