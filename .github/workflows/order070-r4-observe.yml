name: ORDER070 R4 Observe Origin Deploy
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-r4-observe.yml]
permissions:
  actions: read
  contents: read
  statuses: write
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish target deployment run status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; target='60335437d149af4374286422187867eb7dac3878'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-order070-r4-observer/2'}
          u=f'https://api.github.com/repos/{repo}/actions/runs?head_sha={target}&per_page=50'
          with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r:d=json.load(r)
          rows=[x for x in d.get('workflow_runs',[]) if x.get('name')=='ORDER070 R4 Origin Exact Deploy And OCI Bind']
          x=rows[0] if rows else {}
          conclusion=x.get('conclusion'); status=x.get('status')
          state='success' if conclusion=='success' else ('failure' if status=='completed' else 'pending')
          rid=str(x.get('id','NONE')); desc=f'run={rid} status={status} conclusion={conclusion}'[:140]
          payload={'state':state,'context':'ORDER070/origin-r4-observer','description':desc,'target_url':x.get('html_url') or f'https://github.com/{repo}/actions'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{target}',data=json.dumps(payload).encode(),headers=h,method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: print('STATUS_HTTP='+str(r.status))
          PY
