          echo "RUNTIME017_MUTATIONS=0"
          echo "TUNING_MUTATIONS=0"

      - name: Materialize exact-head evidence receipt
        if: steps.materialize.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aud065-evidence
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          files=$(git diff --name-only "$BASE_SHA"...HEAD | paste -sd, -)
          cat > aud065-evidence/receipt.txt <<EOF
          BASE_SHA=$BASE_SHA
          HEAD_SHA=$head
          HEAD_TREE=$tree
          FILES_CHANGED=$files
          SAME_SYMBOL_501_REPRO_BEFORE=INDEPENDENT_N_125
          SAME_SYMBOL_501_REPRO_AFTER=INDEPENDENT_N_126
          AUTHORITY_COMPLETE_HISTORY=PASS
          TRANSPORT_PAGE_INVARIANCE=PASS
          ORACLE_RUNTIME_RECONCILIATION=PASS
          PORTFOLIO_RESEARCH_RECONCILIATION=PASS
          R3_CROSS_SYMBOL_ISOLATION=PASS
          SETTLEMENT_REGRESSIONS=PASS
          CAUSAL_PROVENANCE=PASS
          LEARNING_SHADOW_ONLY=PASS
          FROZEN_WEIGHTS=PASS
          EXTERNAL_DIRECTIONAL=OFF
          PAPER_LOCK=PASS
          SCORE001=PENDING_GENERIC_PR_GATE
          SCORE002=PENDING_GENERIC_PR_GATE
          SMOKE=PENDING_GENERIC_PR_GATE
          FULL_SUITE=PASS
          PRODUCTION_MUTATIONS=0
          SUPABASE_DATA_MUTATIONS=0
          RUNTIME017_MUTATIONS=0
          MERGE=NO
          DEPLOY=NO
          RESTART=NO
          EOF
          cp senecio_polymarket/docs/evidence/aud-065-post-merge-production-acceptance.md aud065-evidence/
          git diff --stat "$BASE_SHA"...HEAD > aud065-evidence/diff-stat.txt
          git diff --name-only "$BASE_SHA"...HEAD > aud065-evidence/files-changed.txt
          echo "HEAD_SHA=$head"
          echo "HEAD_TREE=$tree"

      - name: Upload exact-head AUD-065 evidence
        if: steps.materialize.outputs.changed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aud-065-${{ github.sha }}
          path: aud065-evidence/
          if-no-files-found: error
          retention-days: 14
