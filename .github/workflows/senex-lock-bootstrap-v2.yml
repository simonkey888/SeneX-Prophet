name: SENEX H-011 Lock Bootstrap V2
on:
  push:
    branches: [fix/senex-arm64-reproducible-runtime-v2]
    paths: [.github/workflows/senex-lock-bootstrap-v2.yml]
permissions:
  contents: write
jobs:
  generate-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-reproducible-runtime-v2
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Resolve and write exact wheel-only locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senex-lock-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,sys,re
          root=pathlib.Path.cwd(); ev=pathlib.Path('/tmp/senex-lock-evidence')
          groups={'runtime':['httpx','numpy','fastapi','uvicorn'],'test':['pytest']}
          plats={'arm64':'manylinux2014_aarch64','amd64':'manylinux2014_x86_64'}
          def canon(s): return re.sub(r'[-_.]+','-',s).lower()
          def resolve(group,direct):
            allp={}
            for arch,platform in plats.items():
              dest=ev/f'{group}-{arch}-wheels'; dest.mkdir()
              cmd=[sys.executable,'-m','pip','download','--disable-pip-version-check','--only-binary=:all:','--platform',platform,'--implementation','cp','--python-version','311','--abi','cp311','--dest',str(dest),*direct]
              cp=subprocess.run(cmd,text=True,capture_output=True)
              (ev/f'{group}-{arch}.stdout').write_text(cp.stdout); (ev/f'{group}-{arch}.stderr').write_text(cp.stderr)
              if cp.returncode: raise SystemExit(f'{group}/{arch} resolution rc={cp.returncode}')
              pkgs={}; rows=[]
              for whl in sorted(dest.glob('*.whl')):
                parts=whl.name[:-4].split('-'); name=canon(parts[0]); version=parts[1]
                sha=hashlib.sha256(whl.read_bytes()).hexdigest()
                item=pkgs.setdefault(name,{'version':version,'hashes':set(),'files':[]})
                if item['version']!=version: raise SystemExit(f'version collision {name}')
                item['hashes'].add(sha); item['files'].append(whl.name)
                rows.append({'name':name,'version':version,'file':whl.name,'sha256':sha})
              (ev/f'{group}-{arch}-wheels.json').write_text(json.dumps(rows,sort_keys=True,indent=2)+'\n')
              allp[arch]=pkgs
            av={k:v['version'] for k,v in allp['arm64'].items()}; xv={k:v['version'] for k,v in allp['amd64'].items()}
            if av!=xv: raise SystemExit(f'{group} platform version sets differ')
            merged={}
            for arch in plats:
              for name,item in allp[arch].items():
                target=merged.setdefault(name,{'version':item['version'],'hashes':set()})
                target['hashes'].update(item['hashes'])
            return merged
          def render(pkgs):
            out=['# Generated by SENEX H-011 lock bootstrap V2.','# Complete CPython 3.11 ARM64/AMD64 wheel-only lock; do not edit manually.']
            for name in sorted(pkgs):
              hashes=sorted(pkgs[name]['hashes']); out.append(f"{name}=={pkgs[name]['version']} \\")
              for i,h in enumerate(hashes): out.append(f"    --hash=sha256:{h}"+(' \\' if i<len(hashes)-1 else ''))
            return '\n'.join(out)+'\n'
          resolved={g:resolve(g,d) for g,d in groups.items()}
          overlap=set(resolved['runtime'])&set(resolved['test'])
          if overlap or 'pytest' in resolved['runtime'] or 'pytest' not in resolved['test']: raise SystemExit(f'separation failed {sorted(overlap)}')
          rp=root/'polymarket/requirements-h011-v3.txt'; tp=root/'polymarket/requirements-h011-v3-test.txt'
          rp.write_text(render(resolved['runtime'])); tp.write_text(render(resolved['test']))
          summary={'runtime_package_count':len(resolved['runtime']),'test_package_count':len(resolved['test']),'runtime_lock_sha256':hashlib.sha256(rp.read_bytes()).hexdigest(),'test_lock_sha256':hashlib.sha256(tp.read_bytes()).hexdigest(),'runtime_and_test_separated':True,'source_distributions_allowed':0,'only_binary':True,'pip_require_hashes':True}
          (ev/'summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          PY
          for p in manylinux2014_aarch64 manylinux2014_x86_64; do
            for f in polymarket/requirements-h011-v3.txt polymarket/requirements-h011-v3-test.txt; do
              d="/tmp/senex-lock-evidence/verify-$(basename "$f")-$p"; mkdir -p "$d"
              python -m pip download --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps --platform "$p" --implementation cp --python-version 311 --abi cp311 -r "$f" -d "$d"
            done
          done
          find /tmp/senex-lock-evidence -type f ! -name SHA256SUMS -print0|sort -z|xargs -0 sha256sum >/tmp/senex-lock-evidence/SHA256SUMS
      - name: Commit generated locks and remove transient workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/senex-lock-bootstrap.yml .github/workflows/senex-lock-bootstrap-v2.yml
          git add polymarket/requirements-h011-v3.txt polymarket/requirements-h011-v3-test.txt
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'build(senex): lock ARM64 and AMD64 dependencies'
          git push origin HEAD:fix/senex-arm64-reproducible-runtime-v2
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-h011-lock-bootstrap-v2-${{ github.run_id }}
          path: /tmp/senex-lock-evidence
          retention-days: 30
          if-no-files-found: error
