name: SENEX ARM64 Exact-Tree Preflight

on:
  push:
    branches:
      - audit/senex-arm64-preflight-6ee7a139

permissions:
  contents: read

concurrency:
  group: senex-arm64-preflight-6ee7a139
  cancel-in-progress: false

env:
  PRODUCT_SHA: 6ee7a139055766a1e2fda1eae7e39358e88974c2
  PRODUCT_TREE: b6eeb359f7e177a33f4b7bed77a8f77fe9acf96e

jobs:
  arm64-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exclusive control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact product SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6ee7a139055766a1e2fda1eae7e39358e88974c2
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Register ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Run fail-closed exact-tree preflight
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          uname -a > "$GITHUB_WORKSPACE/evidence/runner-uname.txt"
          docker version > "$GITHUB_WORKSPACE/evidence/docker-version.txt"
          docker buildx version > "$GITHUB_WORKSPACE/evidence/buildx-version.txt"
          bash "$GITHUB_WORKSPACE/control/audit/arm64_preflight.sh"

      - name: Upload checksummed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-arm64-preflight-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce preflight verdict
        if: always()
        shell: bash
        run: |
          test -f evidence/result.env
          cat evidence/result.env
          grep -qx 'ARM64_PREFLIGHT=PASS' evidence/result.env
