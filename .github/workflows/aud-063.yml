name: AUD-063-R1 Settlement Authority Historical Replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  AUD_EXACT_HEAD_GATE:
    name: AUD_EXACT_HEAD_GATE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable AUD-063 accepted head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 84f4694056282f4b39a53ddc09f3b4a3930ac1a9
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Verify immutable historical identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "84f4694056282f4b39a53ddc09f3b4a3930ac1a9"
          test "$(git rev-parse HEAD^{tree})" = "0cb5abaa024f1325bf88e5fd3390dcec8f5f972d"
          git merge-base --is-ancestor 49c5f0a69609c005da80e48b585e91d8582a5ac6 HEAD

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r senecio_polymarket/requirements.txt

      - name: Re-run AUD-063/R1 preservation suite
        working-directory: senecio_polymarket
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_aud_063 -v 2>&1 | tee /tmp/aud063-focused.log
          grep -Eq 'Ran 33 tests' /tmp/aud063-focused.log
          grep -q '^OK$' /tmp/aud063-focused.log
          python -m compileall -q .

      - name: Confirm historical safety locks
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only 49c5f0a69609c005da80e48b585e91d8582a5ac6...HEAD | grep -Ei 'runtime017|runtime-017'
          grep -q '^MIN_LEARNING_EXAMPLES = 10$' senecio_polymarket/oracle_runtime/institutional_core.py
          grep -q '^MIN_GLOBAL_N = 100$' senecio_polymarket/backend/authoritative_score.py
          grep -q '^MIN_DIRECTION_N = 30$' senecio_polymarket/backend/authoritative_score.py

      - name: Upload historical replay receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aud-063-r1-historical-replay-84f4694056282f4b39a53ddc09f3b4a3930ac1a9
          path: /tmp/aud063-focused.log
          if-no-files-found: error
          retention-days: 14
