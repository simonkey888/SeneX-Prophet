name: SENEX Materialize Active Window Fix

on:
  push:
    branches:
      - ops/senex-paper-trial-materialize-20260804
    paths:
      - ".github/workflows/senex-materialize-paper-trial.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Reconstruct and verify exact active-window bundle
        shell: bash
        run: |
          set -euo pipefail
          cp audit/senex_bundle_parts/part-00 /tmp/senex-active-fix.b64
          echo "adda7f538df936443028be2ca8984984a78b8634aae3cf02a0f2584e709eb680  /tmp/senex-active-fix.b64" | sha256sum -c -
          base64 --decode /tmp/senex-active-fix.b64 > /tmp/senex-active-fix.bundle
          echo "bc87316c1c06df9087524a8c843b3aaa5dfbd1b0272805851a54b359c0faa437  /tmp/senex-active-fix.bundle" | sha256sum -c -
          git bundle verify /tmp/senex-active-fix.bundle
          git fetch /tmp/senex-active-fix.bundle refs/heads/release/senex-paper-trial-v1:refs/remotes/bundle/active-fix
          test "$(git rev-parse refs/remotes/bundle/active-fix)" = "0b0571083fe79b691efd064c9e958651bcdb609d"
          test "$(git rev-parse refs/remotes/bundle/active-fix^{tree})" = "ef113d343c343a8b032f46020c3e4888ef54b1f2"
          test "$(git rev-parse refs/remotes/bundle/active-fix^)" = "a3ab36ccdc5784edf1625c36bc245a7165cfb9e4"

      - name: Publish isolated fix branch without force
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/remotes/bundle/active-fix:refs/heads/ops/senex-paper-active-window-fix-20260804
