name: SENEX Materialize Paper Trial Fix

on:
  push:
    branches:
      - ops/senex-paper-trial-materialize-20260804
    paths:
      - ".github/workflows/senex-materialize-paper-trial.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Reconstruct and verify exact fix bundle
        shell: bash
        run: |
          set -euo pipefail
          cp audit/senex_bundle_parts/part-00 /tmp/senex-fix.b64
          echo "10a72e885c88315d6de42546aadf38aa0a694d77c3dc1881e709ca70634d5510  /tmp/senex-fix.b64" | sha256sum -c -
          base64 --decode /tmp/senex-fix.b64 > /tmp/senex-fix.bundle
          echo "0d410cffd46fd0c8f2cf94019df9f1ed6a630d84ed38ced5696b1afb58b7ccca  /tmp/senex-fix.bundle" | sha256sum -c -
          git bundle verify /tmp/senex-fix.bundle
          git fetch /tmp/senex-fix.bundle refs/heads/release/senex-paper-trial-v1:refs/remotes/bundle/paper-fix
          test "$(git rev-parse refs/remotes/bundle/paper-fix)" = "a3ab36ccdc5784edf1625c36bc245a7165cfb9e4"
          test "$(git rev-parse refs/remotes/bundle/paper-fix^{tree})" = "00e6e6471c64ad05d962a44eed3c5c0173fa1dd6"
          test "$(git rev-parse refs/remotes/bundle/paper-fix^)" = "105360f5a8b6d38c5d1722feb3ec00151bd8a0d1"
          test "$(git rev-list --count 105360f5a8b6d38c5d1722feb3ec00151bd8a0d1..refs/remotes/bundle/paper-fix)" = "1"

      - name: Fast-forward paper-trial branch without force
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/release/senex-paper-trial-v1)" = "105360f5a8b6d38c5d1722feb3ec00151bd8a0d1"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/remotes/bundle/paper-fix:refs/heads/release/senex-paper-trial-v1
