name: SENEX Materialize Observed Semantics Fix

on:
  push:
    branches:
      - ops/senex-paper-trial-materialize-20260804
    paths:
      - ".github/workflows/senex-materialize-paper-trial.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Reconstruct and verify exact observed-semantics bundle
        shell: bash
        run: |
          set -euo pipefail
          cp audit/senex_bundle_parts/part-00 /tmp/senex-observed-fix.b64
          echo "b61962f8ed77bae630a872f0e2a5a4272c85aa2dfd63d6dda9feb7fd516eb683  /tmp/senex-observed-fix.b64" | sha256sum -c -
          base64 --decode /tmp/senex-observed-fix.b64 > /tmp/senex-observed-fix.bundle
          echo "c877ffe8aed1067420fb06fef3d06ded8ab910ef00d116094d7e0318c4be1b47  /tmp/senex-observed-fix.bundle" | sha256sum -c -
          git bundle verify /tmp/senex-observed-fix.bundle
          git fetch /tmp/senex-observed-fix.bundle refs/heads/materialize/senex-paper-final:refs/remotes/bundle/observed-fix
          test "$(git rev-parse refs/remotes/bundle/observed-fix)" = "24b38368c5786fc771fd5c761bc4288886649e21"
          test "$(git rev-parse refs/remotes/bundle/observed-fix^{tree})" = "2f160251195b64979963d5da6f6b35a80d4742f7"
          test "$(git rev-parse refs/remotes/bundle/observed-fix^)" = "b7a3c724af4a23fd2ad15f231e4beaa8735eef99"
          test "$(git rev-parse origin/release/senex-paper-trial-v1)" = "b7a3c724af4a23fd2ad15f231e4beaa8735eef99"

      - name: Fast-forward paper-trial branch without force
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/remotes/bundle/observed-fix:refs/heads/release/senex-paper-trial-v1
