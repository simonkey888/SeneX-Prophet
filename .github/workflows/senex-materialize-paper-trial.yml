name: SENEX Materialize Paper Trial

on:
  push:
    branches:
      - ops/senex-paper-trial-materialize-20260804
    paths:
      - ".github/workflows/senex-materialize-paper-trial.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Capture actual remote transport bytes
        shell: bash
        run: |
          set -euo pipefail
          cat \
            audit/senex_bundle_parts/part-00 \
            audit/senex_bundle_parts/part-01a \
            audit/senex_bundle_parts/part-01b \
            audit/senex_bundle_parts/part-02 \
            audit/senex_bundle_parts/part-03 \
            audit/senex_bundle_parts/part-04a \
            audit/senex_bundle_parts/part-04b \
            audit/senex_bundle_parts/part-05a \
            audit/senex_bundle_parts/part-05b \
            audit/senex_bundle_parts/part-06 \
            > /tmp/current-remote.b64
          sha256sum /tmp/current-remote.b64
          wc -c /tmp/current-remote.b64
          cp /tmp/current-remote.b64 current-remote.b64

      - name: Upload captured transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-current-remote-transport-${{ github.sha }}
          path: current-remote.b64
          if-no-files-found: error
          retention-days: 1
