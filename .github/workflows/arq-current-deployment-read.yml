name: ARQ Current Deployment Read

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-current-deployment-read.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: northflank-readonly-audit
    steps:
      - name: Read complete sanitized deployment
        shell: bash
        env:
          NORTHFLANK_SENEX_MAINTENANCE_TOKEN: ${{ secrets.NORTHFLANK_SENEX_MAINTENANCE_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_SENEX_MAINTENANCE_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_SENEX_MAINTENANCE_TOKEN}"
          python - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          base='https://api.northflank.com/v1'; token=os.environ['NORTHFLANK_SENEX_MAINTENANCE_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'senex-current-deployment-read/4'}
          def get(route):
              req=urllib.request.Request(base+route,headers=headers,method='GET'); raw=b''; status=0
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: status=r.status; raw=r.read()
              except urllib.error.HTTPError as exc: status=exc.code; raw=exc.read()
              if status!=200: raise SystemExit(f'{route} status={status} sha256={hashlib.sha256(raw).hexdigest()}')
              obj=json.loads(raw.decode()).get('data',{})
              return obj,hashlib.sha256(raw).hexdigest()
          dep,dep_hash=get('/projects/seneciobot/services/senecio-h011/deployment')
          service,service_hash=get('/projects/seneciobot/services/senecio-h011')
          containers,containers_hash=get('/projects/seneciobot/services/senecio-h011/containers?per_page=10')
          clist=containers.get('containers',[]) if isinstance(containers,dict) else containers if isinstance(containers,list) else []
          allowed_dep={k:dep.get(k) for k in ('buildpack','docker','instances','internal','region','storage')}
          if isinstance(allowed_dep.get('internal'),dict):
              allowed_dep['internal']={k:allowed_dep['internal'].get(k) for k in ('appId','branch','buildId','buildSHA','deployedSHA','nfObjectId','nfObjectType','repository')}
          result={'deployment':allowed_dep,'deployment_body_sha256':dep_hash,'service_status':service.get('status'),'service_body_sha256':service_hash,'containers':[{'status':c.get('status'),'startedAt':c.get('startedAt'),'restartCount':c.get('restartCount'),'message':c.get('message'),'reason':c.get('reason')} for c in clist[:10]],'containers_body_sha256':containers_hash,'secret_values_exported':False}
          print(json.dumps(result,sort_keys=True))
          PY
