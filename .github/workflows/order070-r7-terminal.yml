name: ORDER070 R7 Harness-Only Terminal
on:
  workflow_call:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths:
      - .github/workflows/order070-r7-terminal.yml
permissions:
  contents: read
  statuses: write
concurrency:
  group: order070-r7-terminal
  cancel-in-progress: true
env:
  TARGET_SHA: 4b107bfb427cb85ea84850ffd9ddd5d7a4231d94
  TARGET_TREE: 5d1d9ec806b7d0e02031726565f08ef75d5a9340
  BUILD_DIGEST: sha256:8f4511e0ac2499e3b7408843a82e7f3a5bc4cc466c296003eb363842ad2023ac
  IMAGE_DIGEST: sha256:431702a5e4bb08d139151b5d484428423fa3cc15927d155b768ed2142aee1084
  CANDIDATE_DIR: candidate
jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['TARGET_SHA']}"
          p={'state':'pending','context':'ORDER070/R7-terminal','description':f"run {os.environ['RUN_ID']} harness-only reconciliation + 30m stability",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r7-status/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4b107bfb427cb85ea84850ffd9ddd5d7a4231d94
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ops

      - name: R7 immutable-candidate and harness-only preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git -C candidate status --porcelain)"
          python -m py_compile ops/.github/scripts/order070_r7_terminal.py
          ! grep -q 'wrangler@4.102.0.*dev.*--remote' ops/.github/scripts/order070_r7_terminal.py
          ! grep -Eq "nf_(post|patch|delete)|nf\('(POST|PATCH|DELETE)|nf\(\"(POST|PATCH|DELETE)" ops/.github/scripts/order070_r7_terminal.py
          grep -q 'curl_probe(edge, "POST"' ops/.github/scripts/order070_r7_terminal.py
          grep -q 'curl_probe(edge, "GET", "/__order070_unknown__")' ops/.github/scripts/order070_r7_terminal.py

      - name: Verify native exact-head CI remains green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          runs={'ORDER070':32585446334,'SCORE001':32585446345,'SCORE002':32585446326,'SMOKE':32585446328}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','User-Agent':'senex-r7-ci-proof/1'}
          for name,rid in runs.items():
              u=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{rid}"
              with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: x=json.load(r)
              print(f"CI_{name}_RUN={rid} STATUS={x.get('status')} CONCLUSION={x.get('conclusion')}")
              assert x.get('status')=='completed' and x.get('conclusion')=='success'
              assert x.get('head_sha')==os.environ['TARGET_SHA']
          PY

      - name: R7 exact-origin reuse edge reconciliation E2E and 30m stability
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python ops/.github/scripts/order070_r7_terminal.py
          (cd order070-r7-final-evidence && sha256sum -c MANIFEST.sha256)

      - name: Upload R7 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-r7-terminal-4b107bfb
          path: order070-r7-final-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['TARGET_SHA']}"
          p={'state':state,'context':'ORDER070/R7-terminal','description':f"run {os.environ['RUN_ID']} {state}",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r7-status/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
