name: ARQ Final Cleanup

on:
  push:
    branches: [feat/senex-paper-execution-truth-v1]
    paths: [.github/workflows/arq-standalone-builder-fix.yml]

permissions:
  contents: write

jobs:
  remove-regenerate-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: feat/senex-paper-execution-truth-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Remove temporary workflow and regenerate final governance tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/arq-standalone-builder-fix.yml
          python tools/verify_repository_contract.py --generate
          git add -A
          git diff --cached --check
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt
      - name: Verify standalone builder, manifests, tests and safety
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/senex-final-builder
          python tools/build_execution_truth_artifacts.py \
            --output-dir /tmp/senex-final-builder \
            --code-sha "$(printf 'a%.0s' {1..40})" \
            --tree-sha "$(printf 'b%.0s' {1..40})" \
            --generated-at 2026-08-05T00:00:00Z \
            --regression-count 1
          (cd /tmp/senex-final-builder && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('governance/repository_manifest.json').read_text(encoding='utf-8'))
          manifest_paths = sorted(item['path'] for item in manifest['files'])
          tracked_paths = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          assert manifest['files_tracked_total'] == len(tracked_paths), (
              manifest['files_tracked_total'], len(tracked_paths)
          )
          assert manifest_paths == tracked_paths, {
              'missing_from_manifest': sorted(set(tracked_paths) - set(manifest_paths)),
              'extra_in_manifest': sorted(set(manifest_paths) - set(tracked_paths)),
          }
          workflow_paths = [path for path in tracked_paths if path.startswith('.github/workflows/')]
          forbidden = [
              path for path in workflow_paths
              if Path(path).name.startswith('arq-')
              or 'bootstrap' in Path(path).name.lower()
              or 'remediation' in Path(path).name.lower()
          ]
          assert not forbidden, forbidden
          PY
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          PYTHONPATH=.:polymarket python -m pytest -q tests/governance tests/paper_trial tests/monitoring
          PYTHONPATH=.:polymarket python -m pytest -q
      - name: Commit exact final cleanup tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SENEX ARQ"
          git config user.email "simonkey888@users.noreply.github.com"
          git add -A
          test ! -e .github/workflows/arq-standalone-builder-fix.yml
          git commit -m "fix(governance): finalize exact cleanup tree"
          git push origin HEAD:feat/senex-paper-execution-truth-v1
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
