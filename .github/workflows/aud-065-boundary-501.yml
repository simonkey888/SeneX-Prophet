name: AUD-065-BP1 Real Boundary 501

on:
  push:
    branches: [audit/aud-065-boundary-501-r1]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 43c8023d3a4623381e45da02d9efa8e9b5888f47
  BASE_TREE: 20ec5775ea37a7288e8cd8748ea304843d9b0866

jobs:
  boundary-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE || vars.SUPABASE_TABLE }}
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Assert exact head, canonical base and audit-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          bad="$(git diff --name-only "$BASE_SHA...HEAD" | grep -Ev '^(\.github/workflows/aud-065-boundary-501\.yml|tools/audit/aud065_boundary_501\.py|tests/audit/test_aud065_boundary_501\.py|docs/evidence/aud-065-boundary-501/)' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! git diff --name-only "$BASE_SHA...HEAD" | grep -Eiq 'runtime017|runtime_017|senex-017|senecio_polymarket/backend|senecio_polymarket/oracle_runtime|senecio_polymarket/oracle/'
          git diff --check "$BASE_SHA...HEAD"
          echo PRODUCTION_MUTATION=0
          echo RUNTIME017_MUTATION=0
          echo THRESHOLD_TUNING=0
          echo WEIGHT_TUNING=0
          echo REAL_TRADING=0
          echo OUTGOING_SPEND_USD=0

      - name: Self-tests before any real production read
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aud065bp1"
          python -m unittest -v tests/audit/test_aud065_boundary_501.py 2>&1 | tee "$RUNNER_TEMP/aud065bp1/self-tests.log"
          grep -F 'Ran 14 tests' "$RUNNER_TEMP/aud065bp1/self-tests.log"
          grep -F 'OK' "$RUNNER_TEMP/aud065bp1/self-tests.log"
          python tools/audit/aud065_boundary_501.py --self-test | tee "$RUNNER_TEMP/aud065bp1/self-test-contract.log"

      - name: Compile and immutable network-policy audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/audit/aud065_boundary_501.py tests/audit/test_aud065_boundary_501.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/audit/aud065_boundary_501.py').read_text()
          assert 'ALLOWED_METHODS={"GET","HEAD"}' in p
          assert 'build_authoritative_score' not in p
          assert 'requests.post' not in p and 'requests.patch' not in p and 'requests.put' not in p and 'requests.delete' not in p
          print('PRIMARY_AUTHORITY_IMPORT=NONE')
          print('NETWORK_MUTATION_METHODS=UNREACHABLE')
          PY

      - name: Execute real read-only boundary proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/evidence/aud-065-boundary-501/generated
          mkdir -p docs/evidence/aud-065-boundary-501/generated
          export AUD065_TEST_RESULT="14/14 unittest PASS; 12-contract self-test PASS; executed before production reads"
          python tools/audit/aud065_boundary_501.py --out docs/evidence/aud-065-boundary-501/generated --source-sha "$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/aud065bp1/real-proof.log"

      - name: Secret-scan logs and evidence then reseal manifest
        shell: bash
        run: |
          set -euo pipefail
          E=docs/evidence/aud-065-boundary-501/generated
          P='(-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9._-]{16,})'
          ! grep -RIE --binary-files=without-match "$P" "$E" "$RUNNER_TEMP/aud065bp1"
          printf 'PASS evidence+captured-logs; secret values never emitted\n' > "$E/SECRET_SCAN.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          e=Path('docs/evidence/aud-065-boundary-501/generated')
          files=sorted(p for p in e.iterdir() if p.is_file() and p.name!='MANIFEST.sha256')
          (e/'MANIFEST.sha256').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          for line in (e/'MANIFEST.sha256').read_text().splitlines():
              h,n=line.split('  ',1); assert hashlib.sha256((e/n).read_bytes()).hexdigest()==h
          required={'REMOTE_TRUTH.json','TRIGGER_PROOF.json','DIRECT_SOURCE_SUMMARY.json','DIRECT_SOURCE_CANONICAL_SHA256.txt','INDEPENDENT_RECOMPUTATION.json','LEGACY_500_COMPARISON.json','PRODUCTION_API_RECONCILIATION.json','RUNTIME_SURFACE_RECONCILIATION.json','GLOBAL_COUNT_RECONCILIATION.json','SAFETY_READBACK.json','TEST_RESULTS.txt','CI_EXACT_HEAD.json','SECRET_SCAN.txt','MANIFEST.sha256','BOUNDARY_VERDICT.json','HTTP_READ_RECEIPTS.json'}
          assert required <= {p.name for p in e.iterdir()}
          print('EVIDENCE_MANIFEST=PASS')
          PY

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aud-065-bp1-${{ github.sha }}
          path: docs/evidence/aud-065-boundary-501/generated/
          if-no-files-found: error
          retention-days: 14
