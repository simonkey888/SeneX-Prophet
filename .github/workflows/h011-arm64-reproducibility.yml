name: SENEX H-011 ARM64 Reproducibility

on:
  pull_request:
    branches:
      - feat/h011-v3-discovery-refresh
  push:
    branches:
      - feat/h011-v3-discovery-refresh

permissions:
  contents: read

concurrency:
  group: senex-h011-arm64-repro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-arm64-reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Fail-fast harness preflight before emulation
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/senex-arm64-evidence"
          mkdir -p "$evidence"
          bash -n tools/verify_h011_arm64_reproducibility.sh
          python tools/verify_h011_shell_harness.py \
            --script tools/verify_h011_arm64_reproducibility.sh \
            --output "$evidence/harness-static-audit.json"
          bash tools/verify_h011_arm64_reproducibility.sh \
            --self-test "$evidence/harness-self-test"
          grep -qx 'ARM64_PREFLIGHT=PASS' \
            "$evidence/harness-self-test/result.env"
          python - "$evidence/harness-self-test/harness-self-test.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report == {
              'schema_version':'senex-h011-harness-self-test-v1',
              'status':'PASS',
              'bash_syntax_check':'PASS',
              'unbound_variable_static_or_unit_check':'PASS',
              'argument_and_output_directory_initialization':'PASS',
              'result_env_written_on_every_controlled_failure':'PASS',
              'harness_self_test':'PASS',
          }
          PY
          (cd "$evidence/harness-self-test" && sha256sum -c SHA256SUMS)

      - name: Register ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Execute exact-head reproducibility and runtime gates
        shell: bash
        run: |
          set -euo pipefail
          bash tools/verify_h011_arm64_reproducibility.sh \
            "$RUNNER_TEMP/senex-arm64-evidence"

      - name: Verify portable evidence checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/senex-arm64-evidence"
          sha256sum -c SHA256SUMS

      - name: Upload checksummed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-h011-arm64-repro-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/senex-arm64-evidence
          retention-days: 30
          if-no-files-found: error

      - name: Enforce exact-head verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/senex-arm64-evidence/result.env"
          grep -qx 'ARM64_PREFLIGHT=PASS' \
            "$RUNNER_TEMP/senex-arm64-evidence/result.env"
