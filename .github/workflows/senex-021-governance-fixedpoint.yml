name: SENEX 021 Governance Fixed Point

on:
  push:
    branches:
      - feat/senex-real-data-evidence-campaign-v1

permissions:
  contents: write

concurrency:
  group: senex-021-governance-fixedpoint
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Prove lane and self-retire
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/senex-real-data-evidence-campaign-v1"
          git merge-base --is-ancestor d00d9f7a97209cc0eca8ac327c830a919e027f67 HEAD
          test "$(git rev-parse d00d9f7a97209cc0eca8ac327c830a919e027f67^{tree})" = "7fe5ad20f4f7b4964492775d0d2ebf85510250c8"
          test -f research/real_data_021/materialized/dataset_manifest.json
          test -f research/real_data_021/first_holdout_observed.json
          git rm .github/workflows/senex-021-governance-fixedpoint.yml
          git add -A

      - name: Install exact hashed CI lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r polymarket/requirements-h011-v3.txt

      - name: Converge generated governance
        shell: bash
        run: |
          set -euo pipefail
          files=(governance/target_architecture.yaml governance/component_registry.json governance/migration_map.json governance/repository_manifest.json governance/repository_manifest.json.sha256)
          stable=0
          for n in 1 2 3 4 5; do
            python tools/verify_repository_contract.py --root . --generate > "/tmp/generate-${n}.json"
            sha256sum "${files[@]}" > /tmp/current.hashes
            if [ -f /tmp/previous.hashes ] && cmp -s /tmp/previous.hashes /tmp/current.hashes; then
              stable=1
              echo "GOVERNANCE_FIXED_POINT_ITERATION=${n}"
              break
            fi
            cp /tmp/current.hashes /tmp/previous.hashes
          done
          test "$stable" = 1
          python tools/verify_repository_contract.py --root . --generate > /tmp/generate-proof.json
          sha256sum "${files[@]}" > /tmp/proof.hashes
          cmp /tmp/current.hashes /tmp/proof.hashes
          git add -A
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('governance/repository_manifest.json').read_text())
          tracked=[x for x in subprocess.check_output(['git','ls-files'], text=True).splitlines() if x]
          assert manifest['files_tracked_total']==len(tracked), (manifest['files_tracked_total'],len(tracked))
          assert {x['path'] for x in manifest['files']}==set(tracked)
          assert '.github/workflows/senex-021-governance-fixedpoint.yml' not in tracked
          print(f"GOVERNANCE_TRACKED_TOTAL={len(tracked)}")
          PY

      - name: Verify final candidate
        shell: bash
        run: |
          set -euo pipefail
          (cd research/real_data_021/materialized && sha256sum -c dataset_manifest.json.sha256)
          python -m pytest -q tests/governance tests/mega_research/test_real_data_021.py tests/mega_research/test_mega_research_v2.py
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/paper.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/paper.json'))
          assert r['status']=='PASS'
          assert len(r.get('findings',[]))==0
          assert r.get('secret_values_observed') is False
          PY
          python -m pytest -q

      - name: Commit fixed point and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SENEX ARQ 021"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(021): stabilize generated governance evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "FIXED_POINT_HEAD=$(git rev-parse HEAD)"
          echo "FIXED_POINT_TREE=$(git rev-parse HEAD^{tree})"
