name: ARQ Restart Rollback Baseline

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-restart-rollback-baseline.yml

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: northflank-readonly-audit
    steps:
      - name: Restart exact rollback service and validate
        shell: bash
        env:
          NORTHFLANK_SENEX_MAINTENANCE_TOKEN: ${{ secrets.NORTHFLANK_SENEX_MAINTENANCE_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_SENEX_MAINTENANCE_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_SENEX_MAINTENANCE_TOKEN}"
          mkdir -p evidence
          python - <<'PY'
          import datetime,hashlib,json,os,time,urllib.error,urllib.request
          base='https://api.northflank.com/v1'; token=os.environ['NORTHFLANK_SENEX_MAINTENANCE_TOKEN']
          project='seneciobot'; service='senecio-h011'; expected_build='reach-page-2757'; expected_sha='2f8503533543832147caf4c8e97a0cc6f5af3cbc'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'senex-restart-rollback/1'}
          out={'started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expected_build_id':expected_build,'expected_sha':expected_sha,'requests':[],'secret_values_exported':False,'safety':{'paper_only':True,'orders_enabled':False,'live_capital_locked':True}}
          def call(method,route,payload=None,label=None):
              body=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(base+route,headers=headers,data=body,method=method); raw=b''; status=0
              try:
                  with urllib.request.urlopen(req,timeout=60) as r: status=r.status; raw=r.read()
              except urllib.error.HTTPError as exc: status=exc.code; raw=exc.read()
              digest=hashlib.sha256(raw).hexdigest(); out['requests'].append({'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'label':label or route,'method':method,'path':route,'status':status,'bytes':len(raw),'body_sha256':digest})
              try: obj=json.loads(raw.decode() or '{}')
              except Exception: obj={'non_json':True}
              if not 200<=status<300: raise SystemExit(f'{method} {route} status={status} sha256={digest}')
              return obj.get('data',obj) if isinstance(obj,dict) else obj
          dep=call('GET',f'/projects/{project}/services/{service}/deployment',label='deployment_before')
          internal=dep.get('internal') or {}
          if internal.get('buildId')!=expected_build or internal.get('deployedSHA')!=expected_sha or int(dep.get('instances',0))!=1:
              raise SystemExit('rollback deployment identity not exact before restart')
          call('POST',f'/projects/{project}/services/{service}/restart',{},'restart')
          deadline=time.time()+1200; final=None; containers=[]; service_obj=None
          while time.time()<deadline:
              final=call('GET',f'/projects/{project}/services/{service}/deployment',label='deployment_poll')
              service_obj=call('GET',f'/projects/{project}/services/{service}',label='service_poll')
              cobj=call('GET',f'/projects/{project}/services/{service}/containers?per_page=20',label='containers_poll')
              containers=cobj.get('containers',[]) if isinstance(cobj,dict) else cobj if isinstance(cobj,list) else []
              internal=final.get('internal') or {}
              running=any(c.get('status')=='TASK_RUNNING' for c in containers)
              completed=(service_obj.get('status') or {}).get('deployment',{}).get('status')=='COMPLETED'
              if internal.get('buildId')==expected_build and internal.get('deployedSHA')==expected_sha and int(final.get('instances',0))==1 and running and completed:
                  break
              time.sleep(10)
          else:
              raise SystemExit('rollback restart did not reach TASK_RUNNING/COMPLETED')
          out['infrastructure']={'status':'PASS','build_id':expected_build,'deployed_sha':expected_sha,'instances':1,'service_deployment_status':(service_obj.get('status') or {}).get('deployment'),'containers':[{'name':c.get('name'),'status':c.get('status'),'createdAt':c.get('createdAt'),'updatedAt':c.get('updatedAt')} for c in containers[:20]]}
          public='https://h011-web--senecio-h011--wbjggn89fnf8.code.run/api/v3/state'; public_result=None
          deadline=time.time()+600
          while time.time()<deadline:
              try:
                  req=urllib.request.Request(public,headers={'User-Agent':'senex-restart-rollback-public/1'},method='GET')
                  with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); status=r.status
                  obj=json.loads(raw.decode())
                  candidate=obj.get('code_sha') or obj.get('source_sha') or obj.get('sha') or (obj.get('provenance') or {}).get('code_sha')
                  if status==200 and candidate==expected_sha and obj.get('paper_only') is True and obj.get('orders_enabled') is False and obj.get('live_capital_locked') is True:
                      public_result={'status':status,'body_sha256':hashlib.sha256(raw).hexdigest(),'code_sha':candidate,'paper_only':True,'orders_enabled':False,'live_capital_locked':True}; break
              except Exception: pass
              time.sleep(10)
          if not public_result: raise SystemExit('rollback infrastructure recovered but public state validation failed')
          out['public']=public_result; out['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat(); out['result']='PASS'
          encoded=json.dumps(out,sort_keys=True,indent=2).encode()+b'\n'; open('evidence/restart_rollback.json','wb').write(encoded); open('evidence/SHA256SUMS','w').write(hashlib.sha256(encoded).hexdigest()+'  restart_rollback.json\n')
          print(json.dumps({'result':out['result'],'infrastructure':out['infrastructure'],'public':out['public'],'secret_values_exported':False},sort_keys=True))
          PY
          (cd evidence && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-restart-rollback-${{ github.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
