name: SENEX 021 One-Shot Real Data Materializer

on:
  push:
    branches:
      - feat/senex-real-data-evidence-campaign-v1
    paths:
      - ".github/workflows/senex-021-materialize.yml"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact 021 head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove isolated parent ancestry and retire trigger in working tree
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/senex-real-data-evidence-campaign-v1"
          git merge-base --is-ancestor d00d9f7a97209cc0eca8ac327c830a919e027f67 HEAD
          test "$(git rev-parse d00d9f7a97209cc0eca8ac327c830a919e027f67^{tree})" = "7fe5ad20f4f7b4964492775d0d2ebf85510250c8"
          git rm .github/workflows/senex-021-materialize.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install exact hashed CI lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r polymarket/requirements-h011-v3.txt

      - name: Pre-capture safety and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q polymarket/mega_research/real_data_021.py tests/mega_research/test_real_data_021.py
          python -m pytest -q tests/mega_research/test_real_data_021.py tests/mega_research/test_mega_research_v2.py
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/senex-021-paper-only-before.json

      - name: Bounded official public Polymarket capture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/senex-021-real
          mkdir -p /tmp/senex-021-real
          python -m polymarket.mega_research.real_data_021 collect \
            --output /tmp/senex-021-real \
            --markets 40 \
            --rounds 6 \
            --interval 300

      - name: Freeze actual dataset and code before holdout evaluation
        shell: bash
        env:
          CAPTURE_CODE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/senex-021-real')
          capture=root/'capture_manifest.json'
          protocol=Path('research/real_data_021/evaluation_protocol.json')
          prereg=Path('research/real_data_021/preregistration.json')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          payload={
            'schema_version':'senex-real-data-021-pre-evaluation-freeze-v1',
            'authority_comment_id':5216481413,
            'code_sha':os.environ['CAPTURE_CODE_SHA'],
            'evaluator_sha256':h(Path('polymarket/mega_research/real_data_021.py')),
            'capture_manifest_sha256':h(capture),
            'raw_evidence_sha256':json.loads(capture.read_text())['raw_evidence_sha256'],
            'evaluation_protocol_sha256':h(protocol),
            'preregistration_sha256':h(prereg),
            'holdout_touched_count':0,
            'frozen_before_evaluation':True,
          }
          (root/'pre_evaluation_freeze.json').write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Evaluate frozen real-data evidence exactly once
        shell: bash
        run: |
          set -euo pipefail
          python -m polymarket.mega_research.real_data_021 evaluate \
            --output /tmp/senex-021-real \
            --preregistration research/real_data_021/preregistration.json

      - name: Bind artifact/run provenance and canonical dataset hash
        shell: bash
        env:
          ACTIONS_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/senex-021-real')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          manifest_path=root/'dataset_manifest.json'
          manifest=json.loads(manifest_path.read_text())
          manifest.update({
            'github_actions_run_id':int(os.environ['ACTIONS_RUN_ID']),
            'github_actions_run_attempt':int(os.environ['ACTIONS_RUN_ATTEMPT']),
            'raw_artifact_name':f"senex-021-raw-{os.environ['ACTIONS_RUN_ID']}",
            'pre_evaluation_freeze_sha256':h(root/'pre_evaluation_freeze.json'),
          })
          manifest_path.write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n')
          dataset_hash=h(manifest_path)
          (root/'dataset_manifest.json.sha256').write_text(dataset_hash+'  dataset_manifest.json\n')
          terminal_path=root/'terminal_binding.json'
          terminal=json.loads(terminal_path.read_text())
          terminal['REAL_DATASET_HASH']=dataset_hash
          terminal_path.write_text(json.dumps(terminal,sort_keys=True,separators=(',',':'))+'\n')
          summary={
            'DATASET_MANIFEST_SHA256':dataset_hash,
            'EVALUATION_REPORT_SHA256':h(root/'evaluation_report.json'),
            'PRE_EVALUATION_FREEZE_SHA256':h(root/'pre_evaluation_freeze.json'),
            'RAW_EVIDENCE_SHA256':manifest['raw_artifact_sha256'],
          }
          (root/'materialization_hashes.json').write_text(json.dumps(summary,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Validate real-data truth gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/senex-021-real')
          report=json.loads((root/'evaluation_report.json').read_text())
          manifest=json.loads((root/'dataset_manifest.json').read_text())
          freeze=json.loads((root/'pre_evaluation_freeze.json').read_text())
          assert freeze['holdout_touched_count']==0
          assert freeze['frozen_before_evaluation'] is True
          assert report['point_in_time_leakage']==0
          assert report['future_event_access']==0
          assert report['resolution_leakage']==0
          assert report['replay_determinism']=='PASS'
          assert report['quality']['RAW_HASH_INTEGRITY']=='PASS'
          assert report['safety']=={
            'paper_only':True,'orders_enabled':False,'live_capital_locked':True,
            'real_order_network_calls':0,'wallet_or_private_key_access':0,
            'real_capital_actions':0,'cost_usd':0,
          }
          assert manifest['markets_observed']>=30
          assert manifest['events_observed']>0
          assert set(report['experiments'])=={'EXP021_A','EXP021_B','EXP021_C'}
          assert all(x['status'] in {'PASS','FAIL','INCONCLUSIVE','INVALID'} for x in report['experiments'].values())
          assert 'VALIDATED_EDGE' not in json.dumps(report)
          print(json.dumps({
            'markets':manifest['markets_observed'],
            'events':manifest['events_observed'],
            'time_span_seconds':manifest['time_span_seconds'],
            'experiment_statuses':{k:v['status'] for k,v in report['experiments'].items()},
            'data_quality':report['quality']['DATA_QUALITY_STATE'],
          },sort_keys=True))
          PY

      - name: Materialize only small canonical evidence into Git
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/real_data_021/materialized
          cp /tmp/senex-021-real/capture_manifest.json research/real_data_021/materialized/
          cp /tmp/senex-021-real/pre_evaluation_freeze.json research/real_data_021/materialized/
          cp /tmp/senex-021-real/evaluation_report.json research/real_data_021/materialized/
          cp /tmp/senex-021-real/dataset_manifest.json research/real_data_021/materialized/
          cp /tmp/senex-021-real/dataset_manifest.json.sha256 research/real_data_021/materialized/
          cp /tmp/senex-021-real/terminal_binding.json research/real_data_021/materialized/
          cp /tmp/senex-021-real/materialization_hashes.json research/real_data_021/materialized/
          cp /tmp/senex-021-real/curated_fixture.jsonl research/real_data_021/materialized/
          python tools/verify_repository_contract.py --root . --generate > /tmp/senex-021-governance-generation.json

      - name: Full regression and safety before final materialization commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/senex-021-paper-only-final.json
          test "$(python - <<'PY'
          import json
          print(len(json.load(open('/tmp/senex-021-paper-only-final.json')).get('findings',[])))
          PY
          )" = "0"
          sha256sum -c research/real_data_021/materialized/dataset_manifest.json.sha256

      - name: Upload immutable raw evidence outside Git history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-021-raw-${{ github.run_id }}
          path: |
            /tmp/senex-021-real/raw_evidence.jsonl.gz
            /tmp/senex-021-real/capture_manifest.json
            /tmp/senex-021-real/pre_evaluation_freeze.json
            /tmp/senex-021-real/evaluation_report.json
            /tmp/senex-021-real/dataset_manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Commit material evidence and self-retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SENEX ARQ 021"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research(021): materialize bounded real public OOS evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "MATERIALIZED_HEAD=$(git rev-parse HEAD)"
          echo "MATERIALIZED_TREE=$(git rev-parse HEAD^{tree})"
