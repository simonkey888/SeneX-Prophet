name: ARQ Northflank Secret Presence

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-northflank-secret-presence.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - northflank-readonly-audit
          - production
          - senecio-h011
          - seneciobot
    runs-on: ubuntu-24.04
    environment: ${{ matrix.environment }}
    env:
      S1: ${{ secrets.NORTHFLANK_API_TOKEN }}
      S2: ${{ secrets.NORTHFLANK_TOKEN }}
      S3: ${{ secrets.NF_API_TOKEN }}
      S4: ${{ secrets.NF_TOKEN }}
    steps:
      - name: Report names present without values
        shell: bash
        run: |
          set +x
          set -euo pipefail
          present=()
          test -z "${S1:-}" || present+=(NORTHFLANK_API_TOKEN)
          test -z "${S2:-}" || present+=(NORTHFLANK_TOKEN)
          test -z "${S3:-}" || present+=(NF_API_TOKEN)
          test -z "${S4:-}" || present+=(NF_TOKEN)
          printf 'ENVIRONMENT=%s\n' '${{ matrix.environment }}'
          if ((${#present[@]})); then
            printf 'PRESENT_NAMES=%s\n' "$(IFS=,; echo "${present[*]}")"
          else
            printf 'PRESENT_NAMES=NONE\n'
          fi
          printf 'VALUES_PRINTED=NO\n'
