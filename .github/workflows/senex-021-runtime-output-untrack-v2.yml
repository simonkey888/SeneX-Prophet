name: SENEX 021 Runtime Output Untrack V2

on:
  push:
    branches:
      - feat/senex-real-data-evidence-campaign-v1

permissions:
  contents: write

concurrency:
  group: senex-021-runtime-output-untrack-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Remove transient workflows and tracked runtime journal
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/senex-real-data-evidence-campaign-v1"
          git merge-base --is-ancestor d00d9f7a97209cc0eca8ac327c830a919e027f67 HEAD
          test "$(git rev-parse d00d9f7a97209cc0eca8ac327c830a919e027f67^{tree})" = "7fe5ad20f4f7b4964492775d0d2ebf85510250c8"
          for p in \
            .github/workflows/senex-021-runtime-output-untrack-v2.yml \
            .github/workflows/senex-021-runtime-output-untrack.yml \
            .github/workflows/senex-021-lifecycle-writer-diagnose.yml; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git rm -f "$p"; fi
          done
          if git ls-files --error-unmatch polymarket/results/v3/lifecycle.jsonl >/dev/null 2>&1; then
            git rm -f polymarket/results/v3/lifecycle.jsonl
          fi
          if ! grep -Fxq 'polymarket/results/v3/lifecycle.jsonl' .gitignore; then
            printf '\n# Test/runtime lifecycle journal (generated, never source)\npolymarket/results/v3/lifecycle.jsonl\n' >> .gitignore
          fi
          git add -A
          ! git ls-files --error-unmatch polymarket/results/v3/lifecycle.jsonl >/dev/null 2>&1
          echo 'TRACKED_RUNTIME_OUTPUT_REMOVED=YES'

      - name: Install exact hashed CI lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r polymarket/requirements-h011-v3.txt

      - name: Regenerate governance before regression
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_repository_contract.py --root . --generate > /tmp/generate-pre.json
          git add -A
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('governance/repository_manifest.json').read_text())
          tracked=[x for x in subprocess.check_output(['git','ls-files'],text=True).splitlines() if x]
          paths={x['path'] for x in m['files']}
          assert m['files_tracked_total']==len(tracked), (m['files_tracked_total'],len(tracked))
          assert paths==set(tracked)
          assert 'polymarket/results/v3/lifecycle.jsonl' not in paths
          print('PRE_REGRESSION_GOVERNANCE_TRACKED_SET=PASS')
          PY

      - name: Full regression and evidence safety
        shell: bash
        run: |
          set -euo pipefail
          (cd research/real_data_021/materialized && sha256sum -c dataset_manifest.json.sha256)
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/paper.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/paper.json'))
          assert r['status']=='PASS'
          assert len(r.get('findings',[]))==0
          assert r.get('secret_values_observed') is False
          print('PAPER_ONLY_REPOSITORY=PASS')
          PY
          python -m pytest -q
          test -f polymarket/results/v3/lifecycle.jsonl
          git check-ignore -q polymarket/results/v3/lifecycle.jsonl
          ! git ls-files --error-unmatch polymarket/results/v3/lifecycle.jsonl >/dev/null 2>&1
          echo 'FULL_REGRESSION_RUNTIME_OUTPUT_ISOLATION=PASS'

      - name: Prove governance unchanged after regression
        shell: bash
        run: |
          set -euo pipefail
          files=(governance/target_architecture.yaml governance/component_registry.json governance/migration_map.json governance/repository_manifest.json governance/repository_manifest.json.sha256)
          sha256sum "${files[@]}" > /tmp/before.hashes
          python tools/verify_repository_contract.py --root . --generate > /tmp/generate-post.json
          sha256sum "${files[@]}" > /tmp/after.hashes
          cmp /tmp/before.hashes /tmp/after.hashes
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          git add -A
          echo 'POST_REGRESSION_GOVERNANCE_STABLE=YES'

      - name: Commit, exact-contract prove, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SENEX ARQ 021"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(021): isolate generated lifecycle runtime output"
          final_head=$(git rev-parse HEAD)
          python tools/verify_repository_contract.py \
            --base 74429bb0dfd36a24ec01f0b94856603a9298ab37 \
            --head "$final_head" \
            --report /tmp/final-contract.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/final-contract.json'))
          assert r['pass'] is True
          assert all(g['status']=='PASS' for g in r['gates'])
          print('EXACT_REPOSITORY_CONTRACT_PREPUSH=PASS')
          PY
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "RUNTIME_OUTPUT_FIX_HEAD=$final_head"
          echo "RUNTIME_OUTPUT_FIX_TREE=$(git rev-parse HEAD^{tree})"
