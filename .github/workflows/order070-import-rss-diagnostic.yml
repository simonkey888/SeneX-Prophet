name: ORDER070 Import RSS Diagnostic
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-import-rss-diagnostic.yml]
permissions:
  contents: read
  statuses: write
jobs:
  rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':'pending','context':'ORDER070/import-rss','description':f"run {os.environ['RUN_ID']} started",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-import-rss/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 483b389a83610992800181c0a21b5a337009f7b4
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: senecio_polymarket/requirements.lock
      - name: Install exact locked runtime
        run: python -m pip install --require-hashes -r senecio_polymarket/requirements.lock
      - name: Measure production import RSS variants
        env:
          PYTHONPATH: senecio_polymarket
        shell: bash
        run: |
          set -euo pipefail
          measure() {
            mode="$1"
            BLOCK_MODE="$mode" python - <<'PY'
          import os,sys
          mode=os.environ['BLOCK_MODE']
          blocked=[]
          if mode in {'NO_RESEARCH','NO_BOTH'}: blocked.append('backend.research')
          if mode in {'NO_ANTIFRAGILITY','NO_BOTH'}: blocked.append('backend.antifragility')
          if blocked:
              class Block:
                  def find_spec(self, fullname, path=None, target=None):
                      if any(fullname == p or fullname.startswith(p+'.') for p in blocked):
                          raise ImportError('ORDER070_RSS_BLOCK:'+fullname)
                      return None
              sys.meta_path.insert(0,Block())
          import backend.main_real as mr
          rss_kb=None
          for line in open('/proc/self/status'):
              if line.startswith('VmRSS:'):
                  rss_kb=int(line.split()[1]); break
          legacy=sys.modules.get('backend.main')
          print(f'RSS_MODE={mode} RSS_KB={rss_kb} RSS_MB={rss_kb/1024:.3f}')
          print('RESEARCH_INITIALIZED='+str(getattr(legacy,'_research_coord',None) is not None))
          print('ANTIFRAGILITY_INITIALIZED='+str(getattr(legacy,'_antifragility_coord',None) is not None))
          print('MODULE_COUNT='+str(len(sys.modules)))
          PY
          }
          measure FULL
          measure NO_RESEARCH
          measure NO_ANTIFRAGILITY
          measure NO_BOTH
      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':state,'context':'ORDER070/import-rss','description':f"run {os.environ['RUN_ID']} {state}",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-import-rss/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
