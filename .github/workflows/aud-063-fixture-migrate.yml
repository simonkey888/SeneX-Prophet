name: AUD-063 One-Shot Legacy Fixture Migration

on:
  push:
    branches:
      - audit/aud-063-settlement-starvation-recovery

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ contains(github.event.head_commit.message, '[AUD063_FIXTURE_MIGRATE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Migrate synthetic helper outputs only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def migrate(path, import_anchor, function_name):
              p=Path(path)
              text=p.read_text()
              helper=(
                  import_anchor
                  + 'from tests.aud063_fixture_support import upgrade_proof_row\n\n'
                  + 'def _aud063_upgrade(fn):\n'
                  + '    def wrapped(*args, **kwargs):\n'
                  + '        return upgrade_proof_row(fn(*args, **kwargs))\n'
                  + '    return wrapped\n\n'
              )
              assert text.count(import_anchor) == 1, (path, 'import anchor')
              text=text.replace(import_anchor, helper, 1)
              needle=f'def {function_name}('
              assert text.count(needle) == 1, (path, 'function')
              text=text.replace(needle, f'@_aud063_upgrade\n{needle}', 1)
              p.write_text(text)

          migrate(
              'senecio_polymarket/tests/test_aud_059.py',
              'from oracle_runtime import institutional_core as learning\n\n',
              'proof_row',
          )
          migrate(
              'senecio_polymarket/tests/test_aud_061.py',
              'from oracle_runtime import institutional_core as learning\n\n',
              'proof_row',
          )
          migrate(
              'senecio_polymarket/tests/test_authoritative_learning.py',
              'from oracle_runtime import predict_only as runtime_predictor\n\n\n',
              '_row',
          )

          p=Path('senecio_polymarket/tests/test_aud_061.py')
          text=p.read_text()
          old='        row["audit"]["outcomes_dual"]["settled_at"] = (BASE + timedelta(hours=4)).isoformat()\n'
          new=(old + '        row["audit"]["outcomes_dual"]["settlement_observation_v1"]["observed_at"] = (BASE + timedelta(hours=4)).isoformat()\n')
          assert text.count(old) == 1
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
      - name: Commit migrated fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senex-aud063-bot"
          git config user.email "actions@users.noreply.github.com"
          git add senecio_polymarket/tests/test_aud_059.py senecio_polymarket/tests/test_aud_061.py senecio_polymarket/tests/test_authoritative_learning.py
          git commit -m "[AUD063_FIXTURE_MIGRATED] align legacy synthetic proof fixtures"
          git push origin HEAD:audit/aud-063-settlement-starvation-recovery
