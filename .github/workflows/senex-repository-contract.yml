name: SENEX Repository Contract

on:
  pull_request:
    branches:
      - governance/senex-r0-contract-gates
    paths:
      - "governance/**"
      - "tools/verify_repository_contract.py"
      - "tests/governance/**"
      - "docs/**"
      - "polymarket/paper/**"
      - ".github/workflows/senex-repository-contract.yml"

permissions:
  contents: read

concurrency:
  group: senex-repository-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TERM: xterm

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact head and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "governance/senex-r0-contract-gates"
          test "${{ github.event.pull_request.base.sha }}" = "39e1cf1bdad31a2b6f2178949a2977c837ebdf18"
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt

      - name: Compile governance and paper code
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall tools/verify_repository_contract.py tests/governance polymarket/paper tests/paper_trial

      - name: R0 and R1 governance tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/governance

      - name: Verify deterministic generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp governance/repository_manifest.json /tmp/manifest.committed
          cp governance/component_registry.json /tmp/registry.committed
          cp governance/migration_map.json /tmp/migration.committed
          cp governance/target_architecture.yaml /tmp/architecture.committed
          python tools/verify_repository_contract.py --generate > /tmp/generate-one.json
          cmp /tmp/manifest.committed governance/repository_manifest.json
          cmp /tmp/registry.committed governance/component_registry.json
          cmp /tmp/migration.committed governance/migration_map.json
          cmp /tmp/architecture.committed governance/target_architecture.yaml
          sha256sum governance/repository_manifest.json > /tmp/hash-one
          python tools/verify_repository_contract.py --generate > /tmp/generate-two.json
          sha256sum governance/repository_manifest.json > /tmp/hash-two
          cmp /tmp/hash-one /tmp/hash-two
          (cd governance && sha256sum -c repository_manifest.json.sha256)

      - name: Paper hostile tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/paper_trial

      - name: Global regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Run exact-head repository contract
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_repository_contract.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --report /tmp/senex-repository-contract-report.json
