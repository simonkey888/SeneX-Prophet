name: AUD-064 pre-fix learning reproduction

on:
  push:
    branches:
      - audit/aud-064-learning-authority-freeze

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pre-fix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r senecio_polymarket/requirements.txt

      - name: Reproduce projection mismatch from current main code path
        working-directory: senecio_polymarket
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_KEY: aud064_test_only_placeholder
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from unittest import mock
          from oracle_runtime import institutional_core as learning
          from backend.settlement_proof import is_proof_qualified
          from tests.test_aud_063 import qualified_row

          row = qualified_row(
              64001,
              direction='LONG',
              symbol='BTCUSDT',
              ts='2026-01-01T00:00:00+00:00',
              observed='2026-01-01T02:00:00+00:00',
          )
          assert row['exchange_used'] == 'okx'
          assert is_proof_qualified(row) is True
          seen = {}

          class Response:
              status_code = 200
              def json(self):
                  selected = [x.strip() for x in seen['select'].split(',')]
                  return [{key: row[key] for key in selected if key in row}]

          class Client:
              def __init__(self, *args, **kwargs): pass
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def get(self, url, headers=None, params=None):
                  seen.update(params or {})
                  return Response()

          learning._fetch_cache.clear()
          with mock.patch.object(learning.httpx, 'Client', Client):
              fetched = learning.fetch_authoritative_rows('BTCUSDT')

          assert 'exchange_used' not in seen['select'].split(','), seen
          assert len(fetched) == 1
          assert 'exchange_used' not in fetched[0]
          assert is_proof_qualified(fetched[0]) is False
          core = learning.SingleDecisionCore()
          replay = learning.replay_authoritative_learning(
              core,
              fetched,
              'BTCUSDT',
              decision_cutoff='2026-01-01T03:00:00+00:00',
          )
          assert replay['proof_qualified_n'] == 0
          print('AUD064_PREFX_REPRO=' + json.dumps({
              'base_sha': '2c4dbf284b23d3cf81b93dcfbd262660ab03dd43',
              'projection': seen['select'],
              'persisted_exchange_used': row['exchange_used'],
              'fetched_exchange_used_present': 'exchange_used' in fetched[0],
              'canonical_proof_before_projection': True,
              'canonical_proof_after_projection': False,
              'replay_n': replay['proof_qualified_n'],
              'diagnosis': 'REPRODUCED_PROJECTION_MISMATCH',
          }, sort_keys=True, separators=(',', ':')))
          PY
