name: ATM Worker AUD-067-R1 Exact Head

on:
  push:
    branches: [worker/order-wr-003-senex-readiness]
    paths:
      - 'senecio_polymarket/atm_worker/**'
      - 'senecio_polymarket/tests/test_atm_worker_**'
      - 'senecio_polymarket/tests/atm_worker_aud067_**'
      - 'senecio_polymarket/scripts/atm_worker_*'
      - 'senecio_polymarket/docs/evidence/aud-067/**'
      - '.github/workflows/atm-worker-*'
  pull_request:
    paths:
      - 'senecio_polymarket/atm_worker/**'
      - 'senecio_polymarket/tests/test_atm_worker_**'
      - 'senecio_polymarket/tests/atm_worker_aud067_**'
      - 'senecio_polymarket/scripts/atm_worker_*'
      - 'senecio_polymarket/docs/evidence/aud-067/**'
      - '.github/workflows/atm-worker-*'

permissions:
  contents: read

env:
  BASE_SHA: 43c8023d3a4623381e45da02d9efa8e9b5888f47
  TABLEAU_COMMIT: aa9e3a0bd3114e0dbb7ec41abd4784483fb89277
  TABLEAU_PATH: tableauserverclient/models/user_item.py
  TABLEAU_GIT_BLOB: 0ba1e8eb2ec094471b11b579094555c8275144bc

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact worker head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Assert exact head scope and immutable base
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = 20ec5775ea37a7288e8cd8748ea304843d9b0866
          bad="$(git diff --name-only "$BASE_SHA..HEAD" | grep -Ev '^(senecio_polymarket/atm_worker/|senecio_polymarket/tests/test_atm_worker_|senecio_polymarket/tests/atm_worker_aud067_|senecio_polymarket/scripts/atm_worker_|senecio_polymarket/docs/evidence/aud-067/|\.github/workflows/atm-worker-)' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! git diff --name-only "$BASE_SHA..HEAD" | grep -Eiq 'runtime017|runtime_017|senex-017'
          echo "AUD067_R1_EXACT_HEAD=$SOURCE_SHA"
          echo PRODUCTION_MUTATION=0
          echo SUPABASE_MUTATION=0
          echo NORTHFLANK_MUTATION=0
          echo RUNTIME017_MUTATIONS=0
          echo THRESHOLD_WEIGHT_TUNING=0
          echo REAL_TRADING=0
          echo OUTGOING_SPEND_USD=0

      - name: Worker unit state-machine and red-team tests
        working-directory: senecio_polymarket
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_atm_worker_aud067 2>&1 | tee /tmp/aud067-tests.log
          grep -F 'Ran 18 tests' /tmp/aud067-tests.log
          grep -F 'OK' /tmp/aud067-tests.log
          echo AUD067_R1_FOCUSED_TESTS=18/18_PASS

      - name: Compile worker-only Python
        working-directory: senecio_polymarket
        run: python -m compileall -q atm_worker scripts/atm_worker_materialize.py tests/atm_worker_aud067_common.py tests/test_atm_worker_aud067.py tests/test_atm_worker_aud067_part1.py tests/test_atm_worker_aud067_part2.py

      - name: Prepare exact public Tableau source snapshot
        shell: bash
        run: |
          set -euo pipefail
          export TABLEAU_OUT="$RUNNER_TEMP/tableau-user-item.py"
          python - <<'PY'
          import hashlib, os, urllib.request
          commit=os.environ['TABLEAU_COMMIT']; path=os.environ['TABLEAU_PATH']; expected=os.environ['TABLEAU_GIT_BLOB']
          url=f'https://raw.githubusercontent.com/tableau/server-client-python/{commit}/{path}'
          req=urllib.request.Request(url,headers={'User-Agent':'SENEX-AUD-067-R1'})
          with urllib.request.urlopen(req,timeout=20) as r: data=r.read(1_048_577)
          assert 0 < len(data) <= 1_048_576
          blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest(); assert blob==expected,(blob,expected)
          open(os.environ['TABLEAU_OUT'],'wb').write(data)
          print(f'TABLEAU_EXACT_COMMIT={commit}')
          print(f'TABLEAU_GIT_BLOB={blob}')
          print(f'TABLEAU_SHA256={hashlib.sha256(data).hexdigest()}')
          print(f'TABLEAU_BYTES={len(data)}')
          print('PREPARATION_NETWORK_REQUESTS=1')
          PY

      - name: Materialize ORDER-WR-003-equivalent evidence
        working-directory: senecio_polymarket
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/evidence/aud-067/generated
          SOURCE_SHA="$(git rev-parse HEAD)"
          python scripts/atm_worker_materialize.py --out docs/evidence/aud-067/generated --source-sha "$SOURCE_SHA" --tableau-source "$RUNNER_TEMP/tableau-user-item.py" --expected-tableau-git-blob "$TABLEAU_GIT_BLOB"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path('docs/evidence/aud-067/generated')
          required={'REMOTE_TRUTH.md','WORKER_CONTRACT.json','CAPABILITY_MATRIX.json','SECURITY_BOUNDARY.md','TEMPORAL_TRUTH.md','NEGATIVE_TESTS.json','CRASH_RECOVERY.json','REAL_WORLD_SHADOW.json','ORACLE_PRESERVATION.md','TEST_RESULTS.txt','CI_EXACT_HEAD.md','INTEGRATION_NOTES.md','MANIFEST.sha256','aud-067-receipt.json'}
          assert required <= {x.name for x in p.iterdir()}
          r=json.loads((p/'aud-067-receipt.json').read_text()); head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['SOURCE_SHA']==head and r['CAPABILITY_MATRIX']=='PROVEN_ONLY' and r['F001_F009']=='CLOSED_BY_CODE_AND_EVIDENCE'
          for k in ('PRODUCTION_MUTATION','SUPABASE_MUTATION','NORTHFLANK_MUTATION','RUNTIME017_MUTATIONS','THRESHOLD_WEIGHT_TUNING','REAL_TRADING','OUTGOING_SPEND_USD'): assert r[k]==0
          m=json.loads((p/'CAPABILITY_MATRIX.json').read_text()); assert m['matrix_policy']=='PROVEN_ONLY' and not m['unproven_advertised_capabilities'] and all(x['status']=='PROVEN' for x in m['capabilities'])
          c=json.loads((p/'CRASH_RECOVERY.json').read_text()); assert set(c)=={'after_ack','during_work','after_artifact_before_finalize'}
          s=json.loads((p/'REAL_WORLD_SHADOW.json').read_text())['can_handle']; assert s['classification']=='CAN_HANDLE' and s['public_snapshot_commit']==os.environ['TABLEAU_COMMIT'] and s['public_snapshot_git_blob']==os.environ['TABLEAU_GIT_BLOB']
          assert s['completion']['side_effects']['network_requests']==0
          n=json.loads((p/'NEGATIVE_TESTS.json').read_text()); assert n['independent_acceptance_tamper']['status']=='FAIL'
          print('AUD067_R1_E2E_SHADOW=PASS'); print('CAPABILITY_MATRIX=PROVEN_ONLY'); print('READY_FOR_ATM_INTEGRATION=NOT_CLAIMED_RESERVED_FOR_INDEPENDENT_AUD')
          PY

      - name: Verify evidence manifest and secret scan
        working-directory: senecio_polymarket/docs/evidence/aud-067/generated
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          ! grep -RIE --binary-files=without-match '(-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' .
          echo EVIDENCE_MANIFEST=PASS
          echo SECRET_SCAN=PASS

      - name: Upload exact-head AUD-067-R1 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aud-067-r1-${{ github.event.pull_request.head.sha || github.sha }}
          path: senecio_polymarket/docs/evidence/aud-067/generated/
          if-no-files-found: error
          retention-days: 14
