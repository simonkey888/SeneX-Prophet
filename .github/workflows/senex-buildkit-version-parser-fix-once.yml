name: SENEX BuildKit Version Parser Fix Once

on:
  push:
    branches:
      - fix/senex-arm64-evidence-pinning-v3
    paths:
      - .github/workflows/senex-buildkit-version-parser-fix-once.yml

permissions:
  contents: write

jobs:
  fix-test-regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-evidence-pinning-v3
          persist-credentials: true

      - name: Correct parser and prove actual Buildx output format
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script=Path('tools/verify_h011_arm64_reproducibility.sh')
          text=script.read_text(encoding='utf-8')
          old='''BUILDKIT_VERSION_1="$(awk '$1=="BuildKit:" {print $2; exit}' "$EVIDENCE/build-1-builder.txt")"\nBUILDKIT_VERSION_2="$(awk '$1=="BuildKit:" {print $2; exit}' "$EVIDENCE/build-2-builder.txt")"\n'''
          new='''BUILDKIT_VERSION_1="$(awk '$1=="BuildKit" && $2=="version:" {print $3; exit}' "$EVIDENCE/build-1-builder.txt")"\nBUILDKIT_VERSION_2="$(awk '$1=="BuildKit" && $2=="version:" {print $3; exit}' "$EVIDENCE/build-2-builder.txt")"\n'''
          if text.count(old)!=1:
              raise SystemExit(f'BuildKit parser anchor count={text.count(old)}')
          script.write_text(text.replace(old,new),encoding='utf-8')

          test=Path('tests/h011_v3/test_arm64_evidence_pinning.py')
          body=test.read_text(encoding='utf-8')
          marker='''    assert "moby/buildkit:buildx-stable-1" not in text\n'''
          replacement='''    assert "moby/buildkit:buildx-stable-1" not in text\n    assert '$1=="BuildKit" && $2=="version:" {print $3; exit}' in text\n    assert '$1=="BuildKit:" {print $2; exit}' not in text\n'''
          if body.count(marker)!=1:
              raise SystemExit(f'pinning test parser marker count={body.count(marker)}')
          test.write_text(body.replace(marker,replacement),encoding='utf-8')
          PY
          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 -m py_compile tests/h011_v3/test_arm64_evidence_pinning.py
          fixture="$RUNNER_TEMP/buildx-inspect.txt"
          cat > "$fixture" <<'EOF'
          Name: test
          Driver: docker-container
          BuildKit version:      v0.31.2
          Platforms: linux/amd64, linux/arm64
          EOF
          test "$(awk '$1=="BuildKit" && $2=="version:" {print $3; exit}' "$fixture")" = 'v0.31.2'
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('tests/h011_v3/test_arm64_evidence_pinning.py')
          spec=importlib.util.spec_from_file_location('pinning_test',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.test_workflow_pins_qemu_buildkit_and_always_verifies_checksums()
          module.test_harness_uses_candidate_identity_and_pinned_internal_builders()
          module.test_harness_proves_pr_event_identity_and_failure_checksums()
          PY

      - name: Regenerate governance twice without temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          self='.github/workflows/senex-buildkit-version-parser-fix-once.yml'
          git rm --cached "$self"
          test -z "$(git ls-files | grep 'senex-.*-once.yml' || true)"
          python3 tools/verify_repository_contract.py --generate > /tmp/generate-one.json
          cp governance/repository_manifest.json /tmp/manifest-one.json
          cp governance/component_registry.json /tmp/registry-one.json
          cp governance/migration_map.json /tmp/migration-one.json
          cp governance/target_architecture.yaml /tmp/architecture-one.yaml
          python3 tools/verify_repository_contract.py --generate > /tmp/generate-two.json
          cmp /tmp/manifest-one.json governance/repository_manifest.json
          cmp /tmp/registry-one.json governance/component_registry.json
          cmp /tmp/migration-one.json governance/migration_map.json
          cmp /tmp/architecture-one.yaml governance/target_architecture.yaml
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          git restore --staged "$self"
          git add \
            tools/verify_h011_arm64_reproducibility.sh \
            tests/h011_v3/test_arm64_evidence_pinning.py \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git diff --check --cached
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'fix(senex): parse pinned BuildKit version evidence'
          git push origin HEAD:fix/senex-arm64-evidence-pinning-v3
