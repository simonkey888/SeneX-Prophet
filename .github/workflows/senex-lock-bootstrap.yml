name: SENEX H-011 Lock Bootstrap

on:
  push:
    branches:
      - fix/senex-arm64-reproducible-runtime-v2
    paths:
      - .github/workflows/senex-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-reproducible-runtime-v2
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Resolve binary-only ARM64 and AMD64 locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senex-lock-evidence
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, subprocess, sys
          from packaging.utils import canonicalize_name, parse_wheel_filename

          root = pathlib.Path.cwd()
          evidence = pathlib.Path('/tmp/senex-lock-evidence')
          groups = {
              'runtime': ['httpx', 'numpy', 'fastapi', 'uvicorn'],
              'test': ['pytest'],
          }
          platforms = {
              'arm64': 'manylinux2014_aarch64',
              'amd64': 'manylinux2014_x86_64',
          }

          def resolve(group: str, direct: list[str]) -> dict[str, dict[str, object]]:
              per_platform: dict[str, dict[str, dict[str, object]]] = {}
              for arch, platform in platforms.items():
                  dest = evidence / f'{group}-{arch}-wheels'
                  dest.mkdir(parents=True, exist_ok=True)
                  command = [
                      sys.executable, '-m', 'pip', 'download',
                      '--disable-pip-version-check', '--only-binary=:all:',
                      '--platform', platform, '--implementation', 'cp',
                      '--python-version', '311', '--abi', 'cp311',
                      '--dest', str(dest), *direct,
                  ]
                  completed = subprocess.run(command, text=True, capture_output=True)
                  (evidence / f'{group}-{arch}.stdout').write_text(completed.stdout)
                  (evidence / f'{group}-{arch}.stderr').write_text(completed.stderr)
                  if completed.returncode:
                      raise SystemExit(f'{group}/{arch} resolution failed: {completed.returncode}')
                  packages: dict[str, dict[str, object]] = {}
                  rows = []
                  for wheel in sorted(dest.glob('*.whl')):
                      name, version, _build, tags = parse_wheel_filename(wheel.name)
                      key = canonicalize_name(name)
                      digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
                      row = {'name': key, 'version': str(version), 'file': wheel.name, 'sha256': digest,
                             'tags': sorted(str(tag) for tag in tags)}
                      rows.append(row)
                      previous = packages.setdefault(key, {'version': str(version), 'hashes': set(), 'files': []})
                      if previous['version'] != str(version):
                          raise SystemExit(f'version collision for {key}')
                      previous['hashes'].add(digest)
                      previous['files'].append(wheel.name)
                  (evidence / f'{group}-{arch}-wheels.json').write_text(json.dumps(rows, sort_keys=True, indent=2)+'\n')
                  per_platform[arch] = packages
              arm_versions = {k: v['version'] for k, v in per_platform['arm64'].items()}
              amd_versions = {k: v['version'] for k, v in per_platform['amd64'].items()}
              if arm_versions != amd_versions:
                  raise SystemExit(f'{group} platform resolution differs: {arm_versions} != {amd_versions}')
              merged: dict[str, dict[str, object]] = {}
              for arch in platforms:
                  for name, item in per_platform[arch].items():
                      target = merged.setdefault(name, {'version': item['version'], 'hashes': set(), 'files': []})
                      target['hashes'].update(item['hashes'])
                      target['files'].extend(item['files'])
              return merged

          def render(group: str, packages: dict[str, dict[str, object]]) -> str:
              lines = [
                  '# Generated by SENEX H-011 lock bootstrap.',
                  '# Complete CPython 3.11 ARM64/AMD64 wheel-only lock; do not edit manually.',
              ]
              for name in sorted(packages):
                  item = packages[name]
                  hashes = sorted(item['hashes'])
                  lines.append(f'{name}=={item["version"]} \\')
                  for index, digest in enumerate(hashes):
                      suffix = ' \\' if index < len(hashes)-1 else ''
                      lines.append(f'    --hash=sha256:{digest}{suffix}')
              return '\n'.join(lines) + '\n'

          resolved = {group: resolve(group, direct) for group, direct in groups.items()}
          runtime_names = set(resolved['runtime'])
          test_names = set(resolved['test'])
          overlap = sorted(runtime_names & test_names)
          if overlap:
              raise SystemExit(f'runtime/test overlap: {overlap}')
          if 'pytest' in runtime_names or 'pytest' not in test_names:
              raise SystemExit('runtime/test separation invariant failed')

          runtime_path = root / 'polymarket/requirements-h011-v3.txt'
          test_path = root / 'polymarket/requirements-h011-v3-test.txt'
          runtime_path.write_text(render('runtime', resolved['runtime']))
          test_path.write_text(render('test', resolved['test']))
          summary = {
              'schema_version': 'senex-h011-lock-bootstrap-v1',
              'runtime_package_count': len(runtime_names),
              'test_package_count': len(test_names),
              'runtime_lock_sha256': hashlib.sha256(runtime_path.read_bytes()).hexdigest(),
              'test_lock_sha256': hashlib.sha256(test_path.read_bytes()).hexdigest(),
              'runtime_and_test_separated': True,
              'source_distributions_allowed': 0,
              'only_binary': True,
              'pip_require_hashes': True,
          }
          (evidence / 'summary.json').write_text(json.dumps(summary, sort_keys=True, indent=2)+'\n')
          PY

          for arch in manylinux2014_aarch64 manylinux2014_x86_64; do
            python -m pip download --disable-pip-version-check \
              --require-hashes --only-binary=:all: --no-deps \
              --platform "$arch" --implementation cp --python-version 311 --abi cp311 \
              -r polymarket/requirements-h011-v3.txt \
              -d "/tmp/senex-lock-evidence/verify-runtime-$arch"
            python -m pip download --disable-pip-version-check \
              --require-hashes --only-binary=:all: --no-deps \
              --platform "$arch" --implementation cp --python-version 311 --abi cp311 \
              -r polymarket/requirements-h011-v3-test.txt \
              -d "/tmp/senex-lock-evidence/verify-test-$arch"
          done
          find /tmp/senex-lock-evidence -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/senex-lock-evidence/SHA256SUMS

      - name: Commit locks and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/senex-lock-bootstrap.yml
          git add polymarket/requirements-h011-v3.txt polymarket/requirements-h011-v3-test.txt
          git config user.name 'senex-arq'
          git config user.email 'senex-arq@users.noreply.github.com'
          git commit -m 'build(senex): lock ARM64 and AMD64 runtime dependencies'
          git push origin HEAD:fix/senex-arm64-reproducible-runtime-v2

      - name: Upload lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-h011-lock-bootstrap-${{ github.run_id }}
          path: /tmp/senex-lock-evidence
          retention-days: 30
          if-no-files-found: error
