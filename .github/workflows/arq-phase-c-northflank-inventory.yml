name: ARQ Phase C Northflank Inventory

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-phase-c-northflank-inventory.yml

permissions:
  contents: read

concurrency:
  group: arq-phase-c-northflank-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: northflank-readonly-audit
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NF_PROJECT_SLUG: seneciobot
      NF_SERVICE_SLUG: senecio-h011
      ACCEPTED_PRODUCT_SHA: ac0d1dfd77f8b931cb02a5d67b632e3b169342e3
      AUDIT_BRANCH: audit/h011-northflank-readonly-inspection
    steps:
      - name: Verify audit scope and token presence
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${AUDIT_BRANCH}"
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          product_remote="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/feat/h011-v3-discovery-refresh | awk '{print $1}')"
          test "${product_remote}" = "${ACCEPTED_PRODUCT_SHA}"
          printf 'TOKEN_PRESENT=YES\nPRODUCT_SHA=%s\n' "${product_remote}"

      - name: Execute GET-only authenticated inventory
        shell: bash
        run: |
          set +x
          set -euo pipefail
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          mkdir -p evidence
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          API = "https://api.northflank.com/v1"
          TOKEN = os.environ["NORTHFLANK_API_TOKEN"]
          PROJECT_SLUG = os.environ["NF_PROJECT_SLUG"]
          SERVICE_SLUG = os.environ["NF_SERVICE_SLUG"]
          ACCEPTED_SHA = os.environ["ACCEPTED_PRODUCT_SHA"]
          ledger: list[dict[str, Any]] = []

          def safe_text(value: Any, limit: int = 500) -> str | None:
              if value is None:
                  return None
              text = str(value)
              text = re.sub(r"nf-[A-Za-z0-9._~+/=-]{12,}", "<redacted>", text)
              text = re.sub(r"(?i)(token|secret|password|credential|private.?key)\s*[:=]\s*\S+", r"\1=<redacted>", text)
              return text[:limit]

          def get(path: str, query: dict[str, Any] | None = None) -> dict[str, Any]:
              assert path.startswith("/")
              url = API + path
              if query:
                  url += "?" + urllib.parse.urlencode(query, doseq=True)
              ledger.append({"method": "GET", "path": path})
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/json",
                      "User-Agent": "senex-arq-phase-c-inventory/1",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8", errors="replace")
                      body = json.loads(raw) if raw else {}
                      return {"status": response.status, "body": body}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      body = {"message": safe_text(raw)}
                  return {"status": exc.code, "body": body}
              except Exception as exc:
                  return {"status": 0, "error": type(exc).__name__, "message": safe_text(exc)}

          def data(result: dict[str, Any]) -> Any:
              body = result.get("body")
              return body.get("data") if isinstance(body, dict) else None

          def walk(node: Any):
              if isinstance(node, dict):
                  yield node
                  for child in node.values():
                      yield from walk(child)
              elif isinstance(node, list):
                  for child in node:
                      yield from walk(child)

          def first(node: Any, *keys: str) -> Any:
              wanted = {re.sub(r"[^a-z0-9]", "", k.lower()) for k in keys}
              for item in walk(node):
                  for key, value in item.items():
                      normalized = re.sub(r"[^a-z0-9]", "", str(key).lower())
                      if normalized in wanted and isinstance(value, (str, int, float, bool)) and value not in ("", None):
                          return value
              return None

          def decode_claims(token: str) -> dict[str, Any]:
              try:
                  parts = token.split(".")
                  if len(parts) < 2:
                      return {}
                  payload = parts[1] + "=" * (-len(parts[1]) % 4)
                  decoded = json.loads(base64.urlsafe_b64decode(payload.encode("ascii")))
                  return {k: decoded.get(k) for k in ("entityId", "entityType", "roleId", "roleInternalId")}
              except Exception:
                  return {}

          claims = decode_claims(TOKEN)
          team_id = str(claims.get("entityId")) if claims.get("entityType") == "team" and claims.get("entityId") else None
          teams = get("/teams", {"per_page": 100})
          teams_data = data(teams)
          if not team_id:
              candidates = []
              if isinstance(teams_data, dict):
                  candidates = teams_data.get("teams") or []
              elif isinstance(teams_data, list):
                  candidates = teams_data
              if candidates and isinstance(candidates[0], dict):
                  team_id = str(candidates[0].get("id") or "") or None

          project_candidates: list[tuple[str, dict[str, Any]]] = []
          if team_id:
              project_candidates.append(("team", get(f"/teams/{urllib.parse.quote(team_id)}/projects/{urllib.parse.quote(PROJECT_SLUG)}")))
          project_candidates.append(("direct", get(f"/projects/{urllib.parse.quote(PROJECT_SLUG)}")))
          project_result = next((result for _, result in project_candidates if result.get("status") == 200), None)
          if project_result is None:
              raise SystemExit("PROJECT_LOOKUP_FAILED")
          project = data(project_result)
          if not isinstance(project, dict):
              raise SystemExit("PROJECT_RESPONSE_INVALID")
          project_id = str(project.get("id") or PROJECT_SLUG)
          prefix = f"/teams/{urllib.parse.quote(team_id)}/projects/{urllib.parse.quote(project_id)}" if team_id else f"/projects/{urllib.parse.quote(project_id)}"

          services_result = get(f"{prefix}/services", {"per_page": 100})
          services_data = data(services_result)
          services = services_data.get("services", []) if isinstance(services_data, dict) else services_data if isinstance(services_data, list) else []
          service_summary = next((x for x in services if isinstance(x, dict) and (str(x.get("id")) == SERVICE_SLUG or str(x.get("name")) == SERVICE_SLUG)), None)
          service_id = str((service_summary or {}).get("id") or SERVICE_SLUG)
          service_path = f"{prefix}/services/{urllib.parse.quote(service_id)}"

          results: dict[str, dict[str, Any]] = {
              "service": get(service_path),
              "deployment": get(f"{service_path}/deployment"),
              "ports": get(f"{service_path}/ports"),
              "health_checks": get(f"{service_path}/health-checks"),
              "containers": get(f"{service_path}/containers", {"per_page": 100}),
              "builds": get(f"{service_path}/build", {"per_page": 100}),
              "volumes": get(f"{prefix}/volumes", {"per_page": 100}),
          }
          if results["service"].get("status") != 200:
              raise SystemExit("SERVICE_LOOKUP_FAILED")

          service = data(results["service"]) or {}
          deployment = data(results["deployment"]) or {}
          builds_data = data(results["builds"])
          builds = builds_data.get("builds", []) if isinstance(builds_data, dict) else builds_data if isinstance(builds_data, list) else []
          builds = [x for x in builds if isinstance(x, dict)]
          builds.sort(key=lambda x: str(x.get("createdAt") or x.get("updatedAt") or ""), reverse=True)
          latest_build = builds[0] if builds else {}
          build_id = str(latest_build.get("id") or "") or None
          build_detail: dict[str, Any] = {}
          if build_id:
              result = get(f"{service_path}/build/{urllib.parse.quote(build_id)}")
              if result.get("status") == 200 and isinstance(data(result), dict):
                  build_detail = data(result)

          volumes_data = data(results["volumes"])
          volumes = volumes_data.get("volumes", []) if isinstance(volumes_data, dict) else volumes_data if isinstance(volumes_data, list) else []
          volumes = [x for x in volumes if isinstance(x, dict)]
          volume_reports: list[dict[str, Any]] = []
          for volume in volumes:
              volume_id = str(volume.get("id") or "")
              if not volume_id:
                  continue
              detail_result = get(f"{prefix}/volumes/{urllib.parse.quote(volume_id)}")
              detail = data(detail_result) if detail_result.get("status") == 200 else volume
              detail = detail if isinstance(detail, dict) else volume
              backups_result = get(f"{prefix}/volumes/{urllib.parse.quote(volume_id)}/backups", {"per_page": 100})
              backups_data = data(backups_result)
              backups = backups_data.get("backups", []) if isinstance(backups_data, dict) else backups_data if isinstance(backups_data, list) else []
              backups = [x for x in backups if isinstance(x, dict)]
              attached = detail.get("attachedObjects") if isinstance(detail.get("attachedObjects"), list) else []
              attached_ids = sorted({str(x.get("id") or x.get("serviceId") or x.get("appId") or "") for x in attached if isinstance(x, dict)})
              mount_paths = sorted({str(first(x, "containerMountPath", "mountPath", "path")) for x in [detail] + attached if first(x, "containerMountPath", "mountPath", "path")})
              volume_reports.append({
                  "id": volume_id,
                  "name": safe_text(detail.get("name")),
                  "storage_class": safe_text(first(detail, "storageClassName", "storageClass")),
                  "capacity": first(detail, "storageSize", "capacity", "size"),
                  "access_mode": safe_text(first(detail, "accessMode", "volumeAccessMode")),
                  "mount_paths": mount_paths,
                  "attached_ids": attached_ids,
                  "attached_to_target_service": service_id in attached_ids or SERVICE_SLUG in attached_ids or str(service.get("appId") or "") in attached_ids,
                  "backup_count": len(backups),
                  "backups": [{"id": safe_text(x.get("id")), "name": safe_text(x.get("name")), "status": safe_text(x.get("status")), "created_at": safe_text(x.get("createdAt"))} for x in backups],
              })

          def environment_names(node: Any) -> list[str]:
              names: set[str] = set()
              for item in walk(node):
                  for key, value in item.items():
                      normalized = re.sub(r"[^a-z0-9]", "", str(key).lower())
                      if normalized in {"runtimeenvironment", "environment", "env", "variables"}:
                          if isinstance(value, dict):
                              names.update(str(k) for k in value.keys())
                          elif isinstance(value, list):
                              for entry in value:
                                  if isinstance(entry, dict):
                                      name = entry.get("key") or entry.get("name") or entry.get("variable")
                                      if name:
                                          names.add(str(name))
              return sorted(names)

          ports = data(results["ports"])
          health = data(results["health_checks"])
          containers = data(results["containers"])
          deployed_sha = build_detail.get("sha") or latest_build.get("sha") or first(deployment, "sha", "commitSha", "deployedSha") or first(service, "sha", "commitSha", "deployedSha")
          report = {
              "captured_at": datetime.now(timezone.utc).isoformat(),
              "github_audit_sha": os.environ.get("GITHUB_SHA"),
              "accepted_product_sha": ACCEPTED_SHA,
              "mode": "GET_ONLY",
              "mutating_requests": 0,
              "request_ledger": ledger,
              "request_statuses": {name: result.get("status") for name, result in results.items()},
              "auth": {
                  "teams_status": teams.get("status"),
                  "entity_type": safe_text(claims.get("entityType")),
                  "role_id_present": bool(claims.get("roleId")),
                  "role_internal_id": safe_text(claims.get("roleInternalId")),
              },
              "project": {"id": project_id, "region": safe_text(project.get("region") or first(project, "region"))},
              "service": {
                  "id": service_id,
                  "app_id": safe_text(service.get("appId")),
                  "name": safe_text(service.get("name")),
                  "type": safe_text(service.get("serviceType") or first(service, "serviceType", "type")),
                  "repository": safe_text(first(service, "projectUrl", "repositoryUrl", "repoUrl", "repository")),
                  "branch": safe_text(build_detail.get("branch") or latest_build.get("branch") or first(service, "projectBranch", "branch", "branchName")),
                  "dockerfile": safe_text(first(service, "dockerfilePath", "dockerfile")),
                  "build_context": safe_text(first(service, "dockerWorkDir", "buildContext", "context")),
                  "environment_names": environment_names([service, deployment]),
              },
              "deployment": {
                  "id": safe_text(first(deployment, "deploymentId", "id")),
                  "deployed_sha": safe_text(deployed_sha),
                  "image_digest": safe_text(first([service, deployment, build_detail], "imageDigest", "digest")),
                  "build_id": build_id,
                  "runtime_command": safe_text(first(deployment, "command", "cmd", "entrypoint", "entryPoint")),
                  "replicas": first(deployment, "instances", "replicas", "replicaCount"),
              },
              "ports": ports,
              "health_checks": health,
              "containers": containers,
              "volumes": volume_reports,
              "target_storage_mount_verified": any(v["attached_to_target_service"] and any(p == "/app/polymarket/results" or p.startswith("/app/polymarket/results/") for p in v["mount_paths"]) for v in volume_reports),
              "rollback_surface": {
                  "previous_deployed_sha": safe_text(deployed_sha),
                  "previous_build_id": build_id,
                  "backup_ids": [b["id"] for v in volume_reports for b in v["backups"]],
              },
              "safety": {
                  "paper_only_required": True,
                  "orders_enabled_required": False,
                  "live_capital_locked_required": True,
                  "secret_values_captured": 0,
                  "production_changed": False,
              },
          }
          if any(x.get("method") != "GET" for x in ledger):
              raise SystemExit("NON_GET_REQUEST_DETECTED")
          if TOKEN in json.dumps(report):
              raise SystemExit("TOKEN_LEAK_DETECTED")
          out = Path("evidence/northflank-phase-c-inventory.json")
          out.write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("evidence/SHA256SUMS").write_text(f"{digest}  {out.name}\n", encoding="utf-8")
          summary = {
              "project_id": report["project"]["id"],
              "service_id": report["service"]["id"],
              "deployed_sha": report["deployment"]["deployed_sha"],
              "build_id": report["deployment"]["build_id"],
              "volume_count": len(report["volumes"]),
              "target_storage_mount_verified": report["target_storage_mount_verified"],
              "backup_count": sum(v["backup_count"] for v in report["volumes"]),
              "mutating_requests": 0,
          }
          print(json.dumps(summary, sort_keys=True))
          PY
          (cd evidence && sha256sum -c SHA256SUMS)

      - name: Upload sanitized Phase C inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-phase-c-northflank-inventory-${{ github.sha }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
