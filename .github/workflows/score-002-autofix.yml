name: SCORE-002 one-shot hardening

on:
  push:
    branches:
      - fix/senex-score-002-authoritative-reconciliation

permissions:
  contents: write

jobs:
  repair:
    if: github.event.before == 'b1b9655d2384b6d6e4a104d9bac48c59c250d86c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply F-001/F-002/F-003 fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()

          oracle = root / "senecio_polymarket/backend/oracle_runner.py"
          text = oracle.read_text()
          old = '''    # ACT-XXII-prereq: ONE-TIME backfill of bogus outcomes that were settled
    # with current-price instead of historical price. Runs once at startup
    # before the first prediction cycle, so the dashboard reflects correct
    # win rates as soon as possible.
    try:
        await _backfill_bogus_outcomes()
    except Exception as e:
        log.exception("backfill error (non-fatal, continuing): %s", e)

'''
          if old not in text:
              raise SystemExit("F-001 anchor not found in oracle_runner.py")
          text = text.replace(old, '''    # SCORE-002: legacy settlement backfill is NOT a production startup action.
    # Historical correction must be an explicit, separately reviewed migration.

''', 1)
          oracle.write_text(text)

          sb = root / "senecio_polymarket/backend/supabase_client.py"
          text = sb.read_text()
          old = 'r = await c.patch(f"/{SUPABASE_TABLE}", params={"id": f"eq.{prediction_id}"}, json=patch_body)'
          new = '''r = await c.patch(
            f"/{SUPABASE_TABLE}",
            params={
                "id": f"eq.{prediction_id}",
                "outcome": "is.null",
                "audit->outcomes_dual": "is.null",
            },
            json=patch_body,
        )'''
          if old not in text:
              raise SystemExit("F-001 writer anchor not found in supabase_client.py")
          text = text.replace(old, new, 1)
          sb.write_text(text)

          rec = root / "senecio_polymarket/backend/settlement_reconciler.py"
          text = rec.read_text()
          old = '''async def daemon() -> None:
    log.info("SENEX-SCORE-002 reconciliation guard started interval=%ss", INTERVAL_S)
    while True:
        try:
            await reconcile_once()
        except Exception:
            log.exception("settlement reconciliation cycle failed")
        await asyncio.sleep(INTERVAL_S)
'''
          new = '''async def daemon() -> None:
    """Run the repair-only reconciler and fail fast on invalid configuration."""
    if not SUPABASE_URL or not SUPABASE_KEY:
        raise RuntimeError(
            "SENEX-SCORE-002 reconciler requires SUPABASE_URL and SUPABASE_KEY"
        )
    log.info("SENEX-SCORE-002 reconciliation guard started interval=%ss", INTERVAL_S)
    while True:
        await reconcile_once()
        await asyncio.sleep(INTERVAL_S)
'''
          if old not in text:
              raise SystemExit("F-002 daemon anchor not found")
          text = text.replace(old, new, 1)
          rec.write_text(text)

          start = root / "senecio_polymarket/start_single_authority.sh"
          text = start.read_text()
          anchor = 'echo "[start_single_authority.sh] launching settlement authority + reconciliation guard..."\n\n'
          insert = '''echo "[start_single_authority.sh] launching settlement authority + reconciliation guard..."

if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
  echo "[start_single_authority.sh] FATAL: SUPABASE_URL and SUPABASE_KEY are required" >&2
  exit 78
fi

'''
          if anchor not in text:
              raise SystemExit("F-002 startup anchor not found")
          text = text.replace(anchor, insert, 1)
          start.write_text(text)

          docker = root / "Dockerfile"
          text = docker.read_text()
          old = '''COPY senecio_polymarket/backend ./backend
COPY senecio_polymarket/frontend ./frontend
'''
          new = '''COPY senecio_polymarket/backend ./backend
COPY senecio_polymarket/frontend ./frontend
COPY senecio_polymarket/start_single_authority.sh ./start_single_authority.sh
RUN chmod +x /app/start_single_authority.sh
'''
          if old not in text:
              raise SystemExit("F-003 Docker COPY anchor not found")
          text = text.replace(old, new, 1)
          old = 'CMD ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--log-level", "info", "--no-access-log"]'
          new = 'CMD ["/app/start_single_authority.sh"]'
          if old not in text:
              raise SystemExit("F-003 Docker CMD anchor not found")
          text = text.replace(old, new, 1)
          docker.write_text(text)

          test = root / "senecio_polymarket/tests/test_score_002_hardening.py"
          test.write_text(r'''from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]


def test_startup_does_not_run_legacy_backfill():
    source = (ROOT / "senecio_polymarket/backend/oracle_runner.py").read_text()
    loop = source[source.index("async def _oracle_loop"):source.index("_tasks:")]
    assert "await _backfill_bogus_outcomes()" not in loop


def test_dual_writer_is_atomically_null_guarded():
    source = (ROOT / "senecio_polymarket/backend/supabase_client.py").read_text()
    assert '"outcome": "is.null"' in source
    assert '"audit->outcomes_dual": "is.null"' in source


def test_reconciler_fails_fast_on_missing_credentials():
    source = (ROOT / "senecio_polymarket/backend/settlement_reconciler.py").read_text()
    daemon = source[source.index("async def daemon"):source.index("if __name__ == \"__main__\"")]
    assert "raise RuntimeError" in daemon
    assert "SUPABASE_URL" in daemon and "SUPABASE_KEY" in daemon
    assert "except Exception:" not in daemon


def test_startup_script_fails_closed_without_supabase_config():
    source = (ROOT / "senecio_polymarket/start_single_authority.sh").read_text()
    assert "SUPABASE_URL" in source
    assert "SUPABASE_KEY" in source
    assert "exit 78" in source


def test_root_dockerfile_starts_single_authority_launcher():
    source = (ROOT / "Dockerfile").read_text()
    assert "COPY senecio_polymarket/start_single_authority.sh ./start_single_authority.sh" in source
    assert 'CMD ["/app/start_single_authority.sh"]' in source
''')

      - name: Run focused regression tests
        working-directory: senecio_polymarket
        run: python -m pytest -q tests/test_senex_score_002.py tests/test_score_002_hardening.py

      - name: Compile affected runtime tree
        run: python -m compileall -q senecio_polymarket/backend

      - name: Commit repaired state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senecio_polymarket/backend/oracle_runner.py \
                  senecio_polymarket/backend/supabase_client.py \
                  senecio_polymarket/backend/settlement_reconciler.py \
                  senecio_polymarket/start_single_authority.sh \
                  Dockerfile \
                  senecio_polymarket/tests/test_score_002_hardening.py \
                  .github/workflows/score-002-autofix.yml
          git commit -m "fix(score-002): enforce immutable settlement and production reconciler"
          git push

      - name: Remove one-shot workflow
        if: ${{ success() }}
        shell: bash
        run: |
          git rm .github/workflows/score-002-autofix.yml
          git commit -m "chore(score-002): remove one-shot repair workflow"
          git push
