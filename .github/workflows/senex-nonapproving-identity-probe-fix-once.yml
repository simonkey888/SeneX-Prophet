name: SENEX Non-Approving Identity Probe Fix Once

on:
  push:
    branches:
      - fix/senex-arm64-evidence-pinning-v3
    paths:
      - .github/workflows/senex-nonapproving-identity-probe-fix-once.yml

permissions:
  contents: write

jobs:
  fix-test-regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-evidence-pinning-v3
          persist-credentials: true

      - name: Give identity probe an explicit non-approving result
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script=Path('tools/verify_h011_arm64_reproducibility.sh')
          text=script.read_text(encoding='utf-8')
          anchor='''\ndie() {\n  local reason="${1:?reason required}"\n'''
          function='''\nwrite_identity_probe_result() {\n  set +e\n  mkdir -p "$EVIDENCE"\n  {\n    printf 'PROBE_STATUS=IDENTITY_PROBE\\n'\n    printf 'PROBE_CONCLUSION=NON_APPROVING\\n'\n    printf 'CANDIDATE_HEAD_SHA=%s\\n' "$CANDIDATE_HEAD_SHA"\n    printf 'CANDIDATE_HEAD_TREE=%s\\n' "$CANDIDATE_HEAD_TREE"\n    printf 'EVENT_SHA=%s\\n' "$EVENT_SHA"\n    printf 'IMAGE_TAG_EXPECTED=%s\\n' "$IMAGE"\n    printf 'IMAGE_REVISION_LABEL_EXPECTED=%s\\n' "$IMAGE_REVISION_LABEL_EXPECTED"\n  } > "$EVIDENCE/identity-probe.env"\n  python3 - "$EVIDENCE/identity-probe.json" \\\n    "$CANDIDATE_HEAD_SHA" "$CANDIDATE_HEAD_TREE" "$EVENT_SHA" \\\n    "$IMAGE" "$IMAGE_REVISION_LABEL_EXPECTED" <<'PY_PROBE' || true\nimport json\nimport pathlib\nimport sys\npath = pathlib.Path(sys.argv[1])\n(candidate_sha, candidate_tree, event_sha, image_tag, revision_label) = sys.argv[2:]\nreport = {\n    "schema_version": "senex-h011-identity-probe-v1",\n    "status": "IDENTITY_PROBE",\n    "conclusion": "NON_APPROVING",\n    "candidate_head_sha": candidate_sha,\n    "candidate_head_tree": candidate_tree,\n    "event_sha": event_sha,\n    "image_tag_expected": image_tag,\n    "image_revision_label_expected": revision_label,\n}\npath.write_text(json.dumps(report, sort_keys=True, indent=2) + "\\n", encoding="utf-8")\nPY_PROBE\n  rm -f "$EVIDENCE/result.env" "$EVIDENCE/result.json"\n  (\n    cd "$EVIDENCE"\n    find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.tmp -print0 \\\n      | sort -z | xargs -0 sha256sum > SHA256SUMS.tmp\n    mv SHA256SUMS.tmp SHA256SUMS\n  ) || true\n  RESULT_WRITTEN="1"\n  set -e\n}\n\ndie() {\n  local reason="${1:?reason required}"\n'''
          if text.count(anchor)!=1:
              raise SystemExit(f'identity probe function anchor count={text.count(anchor)}')
          text=text.replace(anchor,function)
          old='''if [[ "$MODE" == "identity-probe" ]]; then\n  exit 0\nfi\n'''
          new='''if [[ "$MODE" == "identity-probe" ]]; then\n  write_identity_probe_result\n  exit 0\nfi\n'''
          if text.count(old)!=1:
              raise SystemExit(f'identity probe mode anchor count={text.count(old)}')
          text=text.replace(old,new)
          old_self='''  grep -qx "IMAGE_REVISION_LABEL_EXPECTED=$HEAD_SHA" "$identity/candidate-identity.env" \\\n    || die "IDENTITY_SELF_TEST_REVISION_LABEL_INVALID"\n  (cd "$identity" && sha256sum -c SHA256SUMS) \\\n'''
          new_self='''  grep -qx "IMAGE_REVISION_LABEL_EXPECTED=$HEAD_SHA" "$identity/candidate-identity.env" \\\n    || die "IDENTITY_SELF_TEST_REVISION_LABEL_INVALID"\n  [[ ! -e "$identity/result.env" && ! -e "$identity/result.json" ]] \\\n    || die "IDENTITY_PROBE_FALSE_PREFLIGHT_VERDICT_PRESENT"\n  grep -qx 'PROBE_STATUS=IDENTITY_PROBE' "$identity/identity-probe.env" \\\n    || die "IDENTITY_PROBE_STATUS_INVALID"\n  grep -qx 'PROBE_CONCLUSION=NON_APPROVING' "$identity/identity-probe.env" \\\n    || die "IDENTITY_PROBE_CONCLUSION_INVALID"\n  python3 - "$identity/identity-probe.json" <<'PY_PROBE_ASSERT' \\\n    || die "IDENTITY_PROBE_JSON_INVALID"\nimport json\nimport sys\nreport = json.load(open(sys.argv[1], encoding="utf-8"))\nassert report["schema_version"] == "senex-h011-identity-probe-v1"\nassert report["status"] == "IDENTITY_PROBE"\nassert report["conclusion"] == "NON_APPROVING"\nassert "invariants" not in report\nPY_PROBE_ASSERT\n  (cd "$identity" && sha256sum -c SHA256SUMS) \\\n'''
          if text.count(old_self)!=1:
              raise SystemExit(f'identity self-test anchor count={text.count(old_self)}')
          text=text.replace(old_self,new_self)
          report_anchor='''    "pr_event_candidate_identity": "PASS",\n    "harness_self_test": "PASS",\n'''
          report_new='''    "pr_event_candidate_identity": "PASS",\n    "identity_probe_non_approving": "PASS",\n    "harness_self_test": "PASS",\n'''
          if text.count(report_anchor)!=1:
              raise SystemExit(f'self-test report anchor count={text.count(report_anchor)}')
          script.write_text(text.replace(report_anchor,report_new),encoding='utf-8')

          harness=Path('tools/verify_h011_shell_harness.py')
          htext=harness.read_text(encoding='utf-8')
          marker='''    "identity-probe-checksums.log",\n'''
          replacement='''    "identity-probe-checksums.log",\n    "write_identity_probe_result()",\n    "PROBE_CONCLUSION=NON_APPROVING",\n    "IDENTITY_PROBE_FALSE_PREFLIGHT_VERDICT_PRESENT",\n'''
          if htext.count(marker)!=1:
              raise SystemExit(f'harness probe marker count={htext.count(marker)}')
          harness.write_text(htext.replace(marker,replacement),encoding='utf-8')

          test=Path('tests/h011_v3/test_arm64_evidence_pinning.py')
          body=test.read_text(encoding='utf-8')
          addition='''\n\ndef test_identity_probe_is_explicitly_non_approving() -> None:\n    text = HARNESS.read_text(encoding="utf-8")\n    probe = text.split('write_identity_probe_result() {', 1)[1].split('\\ndie() {', 1)[0]\n    assert "PROBE_STATUS=IDENTITY_PROBE" in probe\n    assert "PROBE_CONCLUSION=NON_APPROVING" in probe\n    assert 'rm -f "$EVIDENCE/result.env" "$EVIDENCE/result.json"' in probe\n    mode = text.split('if [[ "$MODE" == "identity-probe" ]]', 1)[1].split('fi', 1)[0]\n    assert "write_identity_probe_result" in mode\n    assert 'write_result "PASS"' not in mode\n'''
          if 'test_identity_probe_is_explicitly_non_approving' not in body:
              body=body.rstrip()+addition+'\n'
          test.write_text(body,encoding='utf-8')

          docs=Path('docs/H011_REPRODUCIBLE_RUNTIME.md')
          dtext=docs.read_text(encoding='utf-8')
          paragraph='''\nThe identity probe emits the dedicated schema `senex-h011-identity-probe-v1`\nwith `conclusion=NON_APPROVING`. It never writes `ARM64_PREFLIGHT=PASS`, runtime\ninvariants, or the reproducibility result schema; its files remain checksummed.\n'''
          if 'senex-h011-identity-probe-v1' not in dtext:
              dtext=dtext.rstrip()+paragraph
          docs.write_text(dtext.rstrip()+'\n',encoding='utf-8')
          test.write_text(test.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 -m py_compile \
            tools/verify_h011_shell_harness.py \
            tests/h011_v3/test_arm64_evidence_pinning.py
          python3 tools/verify_h011_shell_harness.py \
            --script tools/verify_h011_arm64_reproducibility.sh \
            --output /tmp/nonapproving-harness-static.json
          rm -rf /tmp/nonapproving-harness-self-test
          bash tools/verify_h011_arm64_reproducibility.sh \
            --self-test /tmp/nonapproving-harness-self-test
          (cd /tmp/nonapproving-harness-self-test && sha256sum -c SHA256SUMS)
          test ! -e /tmp/nonapproving-harness-self-test/nested/identity-probe/result.env
          test ! -e /tmp/nonapproving-harness-self-test/nested/identity-probe/result.json
          grep -qx 'PROBE_CONCLUSION=NON_APPROVING' \
            /tmp/nonapproving-harness-self-test/nested/identity-probe/identity-probe.env
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('tests/h011_v3/test_arm64_evidence_pinning.py')
          spec=importlib.util.spec_from_file_location('pinning_test',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in sorted(x for x in dir(module) if x.startswith('test_')):
              getattr(module,name)()
          PY

      - name: Regenerate governance twice without temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          self='.github/workflows/senex-nonapproving-identity-probe-fix-once.yml'
          git rm --cached "$self"
          test -z "$(git ls-files | grep 'senex-.*-once.yml' || true)"
          python3 tools/verify_repository_contract.py --generate > /tmp/generate-one.json
          cp governance/repository_manifest.json /tmp/manifest-one.json
          cp governance/component_registry.json /tmp/registry-one.json
          cp governance/migration_map.json /tmp/migration-one.json
          cp governance/target_architecture.yaml /tmp/architecture-one.yaml
          python3 tools/verify_repository_contract.py --generate > /tmp/generate-two.json
          cmp /tmp/manifest-one.json governance/repository_manifest.json
          cmp /tmp/registry-one.json governance/component_registry.json
          cmp /tmp/migration-one.json governance/migration_map.json
          cmp /tmp/architecture-one.yaml governance/target_architecture.yaml
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          git restore --staged "$self"
          git add \
            tools/verify_h011_arm64_reproducibility.sh \
            tools/verify_h011_shell_harness.py \
            tests/h011_v3/test_arm64_evidence_pinning.py \
            docs/H011_REPRODUCIBLE_RUNTIME.md \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git diff --check --cached
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'fix(senex): make identity probe explicitly non-approving'
          git push origin HEAD:fix/senex-arm64-evidence-pinning-v3
