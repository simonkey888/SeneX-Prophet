name: SENEX 049-R1 Dashboard Truth CI

on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/senex-049r1-dashboard-truth-ci.yml]

permissions:
  contents: read

env:
  TARGET_SHA: 631c7bdd92a7cbf041dee8b07782504867f0d6c3
  BASE_SHA: 734e1517d6f1a42c3a2dc308b35bff3cc7b5ecc1

jobs:
  truth-super-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR42 head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Scope and diff gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --check "$BASE_SHA" "$TARGET_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA")
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            case "$path" in
              senecio_polymarket/frontend/*) ;;
              *) echo "OUT_OF_SCOPE=$path"; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}"

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check senecio_polymarket/frontend/app.js
          node --check senecio_polymarket/frontend/truth-alignment.js

      - name: Deterministic dashboard truth T1-T15
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('senecio_polymarket/frontend/truth-alignment.js', 'utf8');
          const index = fs.readFileSync('senecio_polymarket/frontend/index.html', 'utf8');
          const css = fs.readFileSync('senecio_polymarket/frontend/truth-alignment.css', 'utf8');

          const nodes = new Map();
          const get = (id) => {
            if (!nodes.has(id)) nodes.set(id, { textContent: '', dataset: {} });
            return nodes.get(id);
          };
          const document = {
            hidden: false,
            getElementById: get,
            querySelector: () => null,
            querySelectorAll: () => [],
            addEventListener: () => {},
          };
          let transport;
          const response = (payload, status=200) => ({ ok: status >= 200 && status < 300, status, json: async () => payload });

          function metric({status='UNKNOWN', auth=null, verified=0, wins=0, losses=0, min=100}={}) {
            return {
              score_status: status,
              authoritative_score_pct: auth,
              observed_win_rate_pct: verified ? wins / verified * 100 : null,
              verified, wins, losses,
              posterior_accuracy: verified ? (wins + 1) / (verified + 2) : null,
              wilson_lower_95: verified ? 0.61 : null,
              raw_confidence_brier: verified ? 0.19 : null,
              raw_confidence_ece: verified ? 0.04 : null,
              minimum_n: min,
              reasons: [],
            };
          }
          function payload({status='UNKNOWN', auth=null, verified=0, wins=0, losses=0, excluded=10, globalMin=100, longMin=null, shortMin=null}={}) {
            const selected = metric({status, auth, verified, wins, losses, min:globalMin});
            if (longMin != null || shortMin != null) {
              const longVerified = Math.floor(verified / 2);
              const shortVerified = verified - longVerified;
              const longWins = Math.min(longVerified, Math.floor(wins / 2));
              const shortWins = wins - longWins;
              selected.by_direction = {
                LONG: metric({status:'CALIBRATED', auth:71.11, verified:longVerified, wins:longWins, losses:longVerified-longWins, min:longMin}),
                SHORT: metric({status:'CALIBRATED', auth:72.22, verified:shortVerified, wins:shortWins, losses:shortVerified-shortWins, min:shortMin}),
              };
            }
            return {
              version:'oracle-score-truth-v1', mode:'PAPER_ONLY', orders_enabled:false, live_capital_locked:true,
              horizon_s:3600, score_semantics:'proof-qualified', score_status:status,
              authoritative_score_pct:auth, requested_symbol:'BTCUSDT',
              input_rows:verified+excluded, proof_qualified_rows:verified, excluded_rows:excluded,
              exclusion_reasons: excluded ? {MISSING_ORIGIN_PRICE_PROOF:excluded} : {},
              selected, by_symbol:{},
            };
          }

          transport = async () => response(payload());
          const context = {
            console,
            document,
            AbortController,
            MutationObserver: undefined,
            Date,
            setTimeout,
            clearTimeout,
            setImmediate,
            window: {
              fetch: (...args) => transport(...args),
              setInterval: () => 0,
              setTimeout,
              clearTimeout,
            },
          };
          vm.createContext(context);
          vm.runInContext(source, context);
          const api = context.window.__senexTruth049;
          if (!api) throw new Error('truth test API missing');

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const allUnavailable = () => [
            'score-authoritative','score-status','score-proof-progress','score-minimum-global','score-long-progress',
            'score-long-minimum','score-short-progress','score-short-minimum','score-excluded','score-exclusion-reasons',
            'score-wins','score-losses','score-observed-winrate','score-wilson','score-brier','score-ece','score-horizon','score-safety'
          ].every(id => get(id).textContent === '—');

          (async () => {
            await sleep(0); await sleep(0);

            // T1 UNKNOWN/null valid payload -> exact not-authoritative state
            api.renderScore(payload());
            if (get('score-status').textContent !== 'UNKNOWN') throw new Error('T1 status');
            if (get('score-authoritative').textContent !== '— / NOT YET AUTHORITATIVE') throw new Error('T1 authoritative');
            if (get('score-availability').textContent !== 'FRESH') throw new Error('T1 availability');
            console.log('T1=PASS');

            // T2 valid CALIBRATED -> exact percentage
            const calibrated = payload({status:'CALIBRATED',auth:73.21,verified:120,wins:88,losses:32,excluded:8,globalMin:100,longMin:30,shortMin:30});
            api.renderScore(calibrated);
            if (get('score-authoritative').textContent !== '73.21%') throw new Error('T2 percentage');
            console.log('T2=PASS');

            // T3 populated -> non-2xx -> clear every score-derived field
            transport = async () => response({}, 503);
            await api.refreshTruth(50);
            if (get('score-availability').textContent !== 'STALE' || !allUnavailable()) throw new Error('T3 fail closed');
            console.log('T3=PASS');

            // T4 populated -> hung request/timeout -> stale + cleared
            api.renderScore(calibrated);
            transport = (input, init) => new Promise((resolve, reject) => {
              init.signal.addEventListener('abort', () => { const e = new Error('aborted'); e.name = 'AbortError'; reject(e); }, {once:true});
            });
            await api.refreshTruth(5);
            if (get('score-availability').textContent !== 'STALE' || !allUnavailable()) throw new Error('T4 timeout');
            console.log('T4=PASS');

            // T5 failure -> successful recovery
            transport = async () => response(calibrated);
            await api.refreshTruth(50);
            if (get('score-availability').textContent !== 'FRESH' || get('score-authoritative').textContent !== '73.21%') throw new Error('T5 recovery');
            console.log('T5=PASS');

            // T6 malformed HTTP200 JSON -> CONTRACT_ERROR
            transport = async () => ({ok:true,status:200,json:async()=>{throw new SyntaxError('bad json');}});
            await api.refreshTruth(50);
            if (get('score-availability').textContent !== 'CONTRACT_ERROR' || !allUnavailable()) throw new Error('T6 malformed');
            console.log('T6=PASS');

            // T7 UNKNOWN + numeric score -> contract error
            const badUnknown = payload(); badUnknown.authoritative_score_pct = 51.2;
            let rejected = false; try { api.validateScoreContract(badUnknown); } catch (_) { rejected = true; }
            if (!rejected) throw new Error('T7 contradictory score accepted');
            console.log('T7=PASS');

            // T8 CALIBRATED + null/nonfinite/out-of-range -> contract error
            for (const bad of [null, NaN, -0.01, 100.01]) {
              const x = payload({status:'CALIBRATED',auth:73.21,verified:120,wins:88,losses:32,excluded:8,globalMin:100,longMin:30,shortMin:30});
              x.authoritative_score_pct = bad;
              let failed = false; try { api.validateScoreContract(x); } catch (_) { failed = true; }
              if (!failed) throw new Error(`T8 accepted ${bad}`);
            }
            console.log('T8=PASS');

            // T9 older slow response cannot overwrite newer response
            let firstResolve;
            let call = 0;
            const oldPayload = payload({status:'CALIBRATED',auth:55.55,verified:120,wins:70,losses:50,excluded:1,globalMin:100,longMin:30,shortMin:30});
            const newPayload = payload({status:'CALIBRATED',auth:88.88,verified:120,wins:105,losses:15,excluded:1,globalMin:100,longMin:30,shortMin:30});
            transport = () => {
              call++;
              if (call === 1) return new Promise(resolve => { firstResolve = resolve; });
              return Promise.resolve(response(newPayload));
            };
            const slow = api.refreshTruth(500);
            await sleep(0);
            const fast = api.refreshTruth(500);
            await fast;
            firstResolve(response(oldPayload));
            await slow;
            if (get('score-authoritative').textContent !== '88.88%') throw new Error('T9 old response overwrote new');
            console.log('T9=PASS');

            // T10 API minimum_n drives display; no UI threshold duplication
            const minPayload = payload({status:'CALIBRATED',auth:81.25,verified:160,wins:130,losses:30,excluded:2,globalMin:137,longMin:41,shortMin:43});
            api.renderScore(minPayload);
            if (get('score-proof-progress').textContent !== '160/137') throw new Error('T10 global min');
            if (!get('score-long-progress').textContent.endsWith('/41') || !get('score-short-progress').textContent.endsWith('/43')) throw new Error('T10 direction min');
            if (source.includes('/100') || source.includes('/30')) throw new Error('T10 hardcoded threshold');
            console.log('T10=PASS');

            // T11 exact BTC Supabase DB route
            if (api.PREDICTIONS_ROUTE !== '/api/oracle/predictions/db?limit=50&symbol=BTCUSDT') throw new Error('T11 route');
            console.log('T11=PASS');

            // T12 stored outcome never visually claims proof-qualified WIN/LOSS
            if (api.normalizeOutcomeLabel('WIN') !== 'RAW / UNVERIFIED WIN') throw new Error('T12 WIN');
            if (api.normalizeOutcomeLabel('LOSS') !== 'RAW / UNVERIFIED LOSS') throw new Error('T12 LOSS');
            if (!api.normalizeOutcomeLabel('PEND').includes('1h pending')) throw new Error('T12 PEND');
            console.log('T12=PASS');

            // T13 1h Oracle vs 5m H011 distinction visible
            if (!index.includes('1H DIRECTIONAL PROOF-QUALIFIED') || !index.includes('H011 5M IS A DISTINCT CONTRACT')) throw new Error('T13 horizon semantics');
            console.log('T13=PASS');

            // T14 synthetic panels unmistakably isolated
            if ((index.match(/data-authority="SYNTHETIC_DEMO_NON_AUTHORITATIVE"/g) || []).length !== 3) throw new Error('T14 zone count');
            if (!css.includes('SYNTHETIC DEMO · NON-AUTHORITATIVE · SEPARATE FROM ORACLE AND H011')) throw new Error('T14 banner');
            if (!index.includes('SECONDARY PANELS: SYNTHETIC DEMO · NON-AUTHORITATIVE')) throw new Error('T14 footer');
            console.log('T14=PASS');

            // T15 cache/version busting present
            for (const asset of ['styles.css?v=049r1','truth-alignment.css?v=049r1','truth-alignment.js?v=049r1','app.js?v=049r1']) {
              if (!index.includes(asset)) throw new Error(`T15 missing ${asset}`);
            }
            console.log('T15=PASS');
            console.log('DETERMINISTIC_T1_T15=PASS');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Python truth tests and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r senecio_polymarket/requirements.txt pytest >/dev/null
          python -m compileall -q senecio_polymarket/backend
          python -m pytest -q \
            tests/oracle/test_score_truth.py \
            tests/oracle/test_permanent_paper_gate.py \
            tests/oracle/test_oracle_health.py \
            tests/oracle/test_settlement_observation.py \
            tests/oracle/test_supabase_truth.py

      - name: Frozen predictor and repository safety smoke
        shell: bash
        working-directory: senecio_polymarket
        run: |
          set -euo pipefail
          python -m scripts.act_final_audit_smoke

      - name: Materialize 049-R1 CI evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','734e1517d6f1a42c3a2dc308b35bff3cc7b5ecc1','631c7bdd92a7cbf041dee8b07782504867f0d6c3'],text=True).splitlines()
          payload={
            'order':'AUD-SENEX-DASHBOARD-TRUTH-SUPER-AUDIT-049-R1',
            'target_sha':'631c7bdd92a7cbf041dee8b07782504867f0d6c3',
            'base_sha':'734e1517d6f1a42c3a2dc308b35bff3cc7b5ecc1',
            'changed_files':changed,
            'scope':'frontend_only',
            't1_t15':'PASS',
            'js_syntax':'PASS',
            'score_route':'/api/oracle/score?symbol=BTCUSDT',
            'predictions_route':'/api/oracle/predictions/db?limit=50&symbol=BTCUSDT',
            'timeout_bounded':True,
            'generation_guard':True,
            'contract_validation':True,
            'stale_carryover':False,
            'hardcoded_thresholds':False,
            'raw_outcome_claims_verified':False,
            'oracle_horizon_s':3600,
            'h011_horizon_s_visible_distinct':300,
            'synthetic_zone_labeled':True,
            'asset_cache_busting':True,
            'paper_only_contract_unchanged':True,
            'do_not_touch_freeze':'PASS',
            'ci':'GREEN',
          }
          raw=(json.dumps(payload,sort_keys=True,indent=2)+'\n').encode()
          Path('evidence/senex-049r1-ci.json').write_bytes(raw)
          Path('evidence/SHA256SUMS').write_text(hashlib.sha256(raw).hexdigest()+'  senex-049r1-ci.json\n')
          print(json.dumps(payload,sort_keys=True))
          PY
          (cd evidence && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-049r1-dashboard-truth-${{ env.TARGET_SHA }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
