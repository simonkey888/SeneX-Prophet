name: ARQ Finalize Phase F-H

on:
  push:
    branches:
      - ops/senex-phases-fh-predeployment-20260805
    paths:
      - .github/workflows/arq-finalize-phase-fh.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ops/senex-phases-fh-predeployment-20260805
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Remove finalizer from governed candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/arq-finalize-phase-fh.yml /tmp/arq-finalize-phase-fh.yml
          git rm .github/workflows/arq-finalize-phase-fh.yml
          python tools/verify_repository_contract.py --generate

      - name: Install and verify all contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt
          python -m compileall tools/build_phase_f_h_evidence.py tests/operations
          PYTHONPATH=.:polymarket python -m pytest -q tests/operations tests/governance tests/paper_trial tests/monitoring
          PYTHONPATH=.:polymarket python -m pytest -q

      - name: Remove test residue and regenerate final manifests
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdx
          python tools/verify_repository_contract.py --generate
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest=json.loads(Path('governance/repository_manifest.json').read_text(encoding='utf-8'))
          manifest_paths=sorted(item['path'] for item in manifest['files'])
          tracked=sorted(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          assert manifest['files_tracked_total'] == len(tracked), (manifest['files_tracked_total'],len(tracked))
          assert manifest_paths == tracked, {
              'missing': sorted(set(tracked)-set(manifest_paths)),
              'extra': sorted(set(manifest_paths)-set(tracked)),
          }
          assert '.github/workflows/arq-finalize-phase-fh.yml' not in tracked
          assert 'polymarket/results/v3/lifecycle.jsonl' not in tracked
          PY
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          PYTHONPATH=.:polymarket python -m pytest -q tests/operations tests/governance
          git clean -fdx
          python tools/verify_repository_contract.py --generate
          git add governance/repository_manifest.json governance/repository_manifest.json.sha256 governance/component_registry.json governance/migration_map.json governance/target_architecture.yaml
          git diff --cached --check

      - name: Commit governed tree without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged .github/workflows/arq-finalize-phase-fh.yml
          mkdir -p .github/workflows
          cp /tmp/arq-finalize-phase-fh.yml .github/workflows/arq-finalize-phase-fh.yml
          test -z "$(git diff --name-only -- .github/workflows/arq-finalize-phase-fh.yml)"
          git config user.name "SENEX ARQ"
          git config user.email "simonkey888@users.noreply.github.com"
          git commit -m "chore(governance): bind Phase F-H predeployment tree"
          git push origin HEAD:ops/senex-phases-fh-predeployment-20260805
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
