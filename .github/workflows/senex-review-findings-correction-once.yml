name: SENEX PR30 Review Findings Correction Once

on:
  push:
    branches:
      - fix/senex-arm64-reproducible-runtime-v2
    paths:
      - .github/workflows/senex-review-findings-correction-once.yml

permissions:
  contents: write

jobs:
  correct-regenerate-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-reproducible-runtime-v2
          persist-credentials: true

      - name: Correct fail-closed wheel download and Docker ignore scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script=Path('tools/verify_h011_arm64_reproducibility.sh')
          text=script.read_text()
          start=text.find('download_lock() {\n')
          end=text.find('\nplatform=""\n', start)
          if start < 0 or end < 0:
              raise SystemExit(f'download_lock boundaries missing: start={start} end={end}')
          if text.find('download_lock() {\n', start+1) >= 0:
              raise SystemExit('download_lock boundary is ambiguous')
          replacement='''download_lock() {
            local lock="${1:?lock required}"
            local platform="${2:?platform required}"
            local dest="${3:?destination required}"
            local log="${4:?log required}"
            rm -rf "$dest"
            mkdir -p "$dest"
            if ! python3 -m pip download --disable-pip-version-check \\
              --require-hashes \\
              --only-binary=:all: \\
              --no-deps \\
              --platform "$platform" \\
              --implementation cp \\
              --python-version 311 \\
              --abi cp311 \\
              -r "$lock" \\
              -d "$dest" > "$log" 2>&1; then
              return 1
            fi
            if find "$dest" -type f ! -name '*.whl' | grep -q .; then
              return 1
            fi
            find "$dest" -type f -name '*.whl' -print0 \\
              | sort -z | xargs -0 -r sha256sum > "$dest/SHA256SUMS"
            [[ -s "$dest/SHA256SUMS" ]]
          }
          '''
          script.write_text(text[:start]+replacement+text[end:])

          checker=Path('tools/verify_h011_shell_harness.py')
          ctext=checker.read_text()
          marker='''    errors.extend(_multi_local_assignment_errors(text))
          '''
          insertion='''    errors.extend(_multi_local_assignment_errors(text))
              required_download_guards = (
                  "if ! python3 -m pip download",
                  "xargs -0 -r sha256sum",
                  '[[ -s "$dest/SHA256SUMS" ]]',
              )
              for guard in required_download_guards:
                  if guard not in text:
                      errors.append(f"missing fail-closed download guard: {guard}")
              if re.search(r"download_lock[\\s\\S]{0,500}\\|\\|\\s*die", text):
                  errors.append("download_lock must not rely on caller-side || die for command failure")
          '''
          if ctext.count(marker) != 1:
              raise SystemExit(f'checker insertion point count={ctext.count(marker)}')
          checker.write_text(ctext.replace(marker,insertion))

          docs=Path('docs/H011_REPRODUCIBLE_RUNTIME.md')
          dtext=docs.read_text()
          anchor='''- Runtime installation uses `--require-hashes`, `--only-binary=:all:`,
            `--no-deps` and `--no-compile`.
          '''
          replacement_docs='''- Runtime installation uses `--require-hashes`, `--only-binary=:all:`,
            `--no-deps` and `--no-compile`.
          - H-011 context filtering is isolated in
            `polymarket/Dockerfile.h011-v3.dockerignore`; the repository root has no
            restrictive `.dockerignore`, so the independent root Dockerfile retains its
            required `senecio_polymarket/**` context.
          '''
          if dtext.count(anchor) != 1:
              raise SystemExit(f'documentation anchor count={dtext.count(anchor)}')
          docs.write_text(dtext.replace(anchor,replacement_docs))
          PY

          git rm .dockerignore
          cat > polymarket/Dockerfile.h011-v3.dockerignore <<'EOF'
          **
          !polymarket/
          !polymarket/**
          polymarket/requirements-h011-v3.txt
          polymarket/requirements-h011-v3-test.txt
          polymarket/results/**
          EOF

          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 tools/verify_h011_shell_harness.py \
            --script tools/verify_h011_arm64_reproducibility.sh \
            --output /tmp/harness-static.json
          bash tools/verify_h011_arm64_reproducibility.sh \
            --self-test /tmp/harness-self-test
          (cd /tmp/harness-self-test && sha256sum -c SHA256SUMS)

          test -f polymarket/Dockerfile.h011-v3.dockerignore
          test ! -e .dockerignore
          docker build --check -f Dockerfile . > /tmp/root-docker-check.log
          docker build --check -f polymarket/Dockerfile.h011-v3 . \
            > /tmp/h011-docker-check.log

      - name: Remove temporary workflow and regenerate governance
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/senex-review-findings-correction-once.yml
          test -z "$(git ls-files .github/workflows/senex-review-findings-correction-once.yml)"
          python3 tools/verify_repository_contract.py --generate \
            > /tmp/senex-governance-generation.json
          git add \
            tools/verify_h011_arm64_reproducibility.sh \
            tools/verify_h011_shell_harness.py \
            docs/H011_REPRODUCIBLE_RUNTIME.md \
            polymarket/Dockerfile.h011-v3.dockerignore \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          git diff --check --cached
          (cd governance && sha256sum -c repository_manifest.json.sha256)

      - name: Commit corrected canonical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'fix(senex): close wheel and Docker context review findings'
          git push origin HEAD:fix/senex-arm64-reproducible-runtime-v2
