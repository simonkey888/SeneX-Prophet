name: ARQ Phase D-E Manual Backup Restore Deploy

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-phase-d-e-manual-backup-deploy.yml

permissions:
  contents: read

env:
  NF_API: https://api.northflank.com/v1
  PROJECT_ID: seneciobot
  SERVICE_ID: senecio-h011
  SOURCE_VOLUME_ID: h011-results-vol
  PRODUCT_BRANCH: feat/h011-v3-discovery-refresh
  PRODUCT_SHA: 6ee7a139055766a1e2fda1eae7e39358e88974c2
  PRODUCT_TREE: b6eeb359f7e177a33f4b7bed77a8f77fe9acf96e
  PUBLIC_BASE: https://h011-web--senecio-h011--wbjggn89fnf8.code.run

jobs:
  backup-restore-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: northflank-readonly-audit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Execute fail-closed backup restore rollback and exact deploy
        shell: bash
        env:
          NORTHFLANK_SENEX_MAINTENANCE_TOKEN: ${{ secrets.NORTHFLANK_SENEX_MAINTENANCE_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_SENEX_MAINTENANCE_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_SENEX_MAINTENANCE_TOKEN}"
          remote_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/${PRODUCT_BRANCH} | awk '{print $1}')"
          test "$remote_sha" = "$PRODUCT_SHA"
          remote_tree="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git "${PRODUCT_SHA}^{tree}" 2>/dev/null | awk '{print $1}' || true)"
          mkdir -p evidence
          python - <<'PY'
          import base64, datetime, hashlib, json, os, pathlib, re, subprocess, time
          import urllib.error, urllib.parse, urllib.request

          API=os.environ['NF_API'].rstrip('/')
          token=os.environ['NORTHFLANK_SENEX_MAINTENANCE_TOKEN']
          project=os.environ['PROJECT_ID']; service=os.environ['SERVICE_ID']
          source_volume=os.environ['SOURCE_VOLUME_ID']
          product_sha=os.environ['PRODUCT_SHA']; product_tree=os.environ['PRODUCT_TREE']
          product_branch=os.environ['PRODUCT_BRANCH']; public_base=os.environ['PUBLIC_BASE'].rstrip('/')
          run_id=os.environ['GITHUB_RUN_ID']
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'senex-arq-phase-de/1'}
          evidence={'schema_version':'senex-phase-de-v1','started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'product_sha':product_sha,'product_tree':product_tree,'product_branch':product_branch,'project_id':project,'service_id':service,'source_volume_id':source_volume,'requests':[],'secret_values_exported':False,'safety':{'paper_only':True,'orders_enabled':False,'live_capital_locked':True,'real_order_network_calls':0,'wallet_or_private_key_access':0,'real_capital_actions':0},'phase_c':'PASS','phase_d':'IN_PROGRESS','phase_e':'NOT_STARTED'}
          path=pathlib.Path('evidence/phase_de.json')
          sensitive=re.compile(r'(secret|token|password|credential|private|runtimeenvironment|runtimefiles|buildarguments|buildfiles|dockersecretmounts|value|content)',re.I)
          def scrub(v,key=''):
              if isinstance(v,dict):
                  out={}
                  for k,val in v.items():
                      sk=str(k)
                      if sensitive.search(sk):
                          if isinstance(val,dict): out[sk]={'names':sorted(map(str,val.keys())),'values_redacted':True}
                          elif isinstance(val,list): out[sk]={'count':len(val),'values_redacted':True}
                          else: out[sk]='<redacted>'
                      else: out[sk]=scrub(val,sk)
                  return out
              if isinstance(v,list): return [scrub(x,key) for x in v]
              return v
          def persist(): path.write_text(json.dumps(evidence,sort_keys=True,indent=2)+'\n')
          def call(method,route,payload=None,label=None,allow=()):
              body=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(API+route,headers=headers,data=body,method=method)
              status=0; raw=b''
              try:
                  with urllib.request.urlopen(req,timeout=90) as r: status=r.status; raw=r.read()
              except urllib.error.HTTPError as exc: status=exc.code; raw=exc.read()
              digest=hashlib.sha256(raw).hexdigest()
              rec={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'label':label or route,'method':method,'path':route,'status':status,'body_sha256':digest,'bytes':len(raw)}
              evidence['requests'].append(rec)
              try: obj=json.loads(raw.decode() or '{}')
              except Exception: obj={'non_json':True}
              evidence.setdefault('responses',{})[label or route]=scrub(obj)
              persist()
              if not (200 <= status < 300) and status not in allow:
                  raise RuntimeError(f'{method} {route} status={status} body_sha256={digest}')
              return status,obj
          def data(obj): return obj.get('data',obj) if isinstance(obj,dict) else obj
          def poll(route,label,predicate,timeout=2400,interval=10):
              deadline=time.time()+timeout; last=None
              while time.time()<deadline:
                  _,obj=call('GET',route,label=label)
                  last=data(obj)
                  if predicate(last): return last
                  time.sleep(interval)
              raise RuntimeError(f'timeout {route}: {scrub(last)}')
          def scale(instances):
              call('POST',f'/projects/{project}/services/{service}/scale',{'instances':instances},f'scale_{instances}')
              return poll(f'/projects/{project}/services/{service}/deployment',f'scale_{instances}_poll',lambda x:int(x.get('instances',-1))==instances,timeout=900,interval=10)
          def deploy(build_id, expected_sha, label):
              call('POST',f'/projects/{project}/services/{service}/deployment',{'internal':{'id':service,'branch':product_branch,'buildId':build_id},'docker':{'configType':'default'}},label)
              dep=poll(f'/projects/{project}/services/{service}/deployment',label+'_poll',lambda x:(x.get('internal') or {}).get('buildId')==build_id and (x.get('internal') or {}).get('deployedSHA')==expected_sha,timeout=1200,interval=10)
              return dep
          def public_get(route, label, expected_sha, timeout=900):
              deadline=time.time()+timeout; last=None
              while time.time()<deadline:
                  url=public_base+route
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'senex-arq-public-urllib/1'},method='GET')
                      with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); status=r.status
                      obj=json.loads(raw.decode()) if route!='/' else {'html_sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
                      last={'status':status,'body_sha256':hashlib.sha256(raw).hexdigest(),'object':obj}
                      if status==200:
                          if route=='/': return last
                          candidate=obj.get('code_sha') or obj.get('source_sha') or obj.get('sha') or (obj.get('provenance') or {}).get('code_sha')
                          if candidate==expected_sha or (route!='/api/v3/state' and expected_sha in json.dumps(obj,sort_keys=True)):
                              return last
                  except Exception as exc: last={'error_class':type(exc).__name__}
                  time.sleep(10)
              raise RuntimeError(f'public validation timeout route={route} expected={expected_sha} last={scrub(last)}')
          rollback=None; service_scaled_zero=False; final_deployed=False
          try:
              _,svc_obj=call('GET',f'/projects/{project}/services/{service}','service_before')
              _,dep_obj=call('GET',f'/projects/{project}/services/{service}/deployment','deployment_before')
              _,vol_obj=call('GET',f'/projects/{project}/volumes/{source_volume}','source_volume_before')
              dep=data(dep_obj); internal=dep.get('internal') or {}
              rollback={'build_id':internal.get('buildId'),'sha':internal.get('deployedSHA'),'branch':internal.get('branch'),'instances':dep.get('instances')}
              if not rollback['build_id'] or not rollback['sha']: raise RuntimeError('rollback identity incomplete')
              evidence['rollback']=rollback
              vol=data(vol_obj); spec=vol.get('spec') or {}
              if vol.get('status')!='BOUND' or int(spec.get('storageSize',0))<6144: raise RuntimeError('source volume identity/durability invalid')
              evidence['source_volume']={'id':vol.get('id'),'name':vol.get('name'),'status':vol.get('status'),'mounts':vol.get('mounts'),'spec':spec,'createdAt':vol.get('createdAt'),'updatedAt':vol.get('updatedAt'),'attachedObjects':vol.get('attachedObjects')}

              # Build exact accepted canonical SHA.
              _,build_obj=call('POST',f'/projects/{project}/services/{service}/build',{'sha':product_sha},'exact_build_start')
              build_id=data(build_obj).get('id')
              if not build_id: raise RuntimeError('exact build id missing')
              build_final=poll(f'/projects/{project}/services/{service}/build/{build_id}','exact_build_poll',lambda x:bool(x.get('concluded')),timeout=3600,interval=15)
              if not build_final.get('success') or build_final.get('sha')!=product_sha: raise RuntimeError(f'exact build failed: {scrub(build_final)}')
              evidence['exact_build']={'id':build_id,'sha':build_final.get('sha'),'status':build_final.get('status'),'createdAt':build_final.get('createdAt'),'buildConcludedAt':build_final.get('buildConcludedAt')}

              # Freeze writers before deterministic clones.
              scale(0); service_scaled_zero=True
              containers=call('GET',f'/projects/{project}/services/{service}/containers?per_page=100',label='containers_after_scale_zero')[1]
              running=[c for c in ((data(containers) or {}).get('containers',[]) if isinstance(data(containers),dict) else []) if c.get('status')=='TASK_RUNNING']
              if running: raise RuntimeError('service still has running containers after scale zero')

              verifier=r'''import hashlib,json
from pathlib import Path

def manifest(root):
    root=Path(root); rows=[]; total=0
    if root.is_dir():
        for p in sorted(x for x in root.rglob('*') if x.is_file() and not x.is_symlink()):
            rel=p.relative_to(root).as_posix(); h=hashlib.sha256(); size=0
            with p.open('rb') as f:
                while True:
                    b=f.read(1024*1024)
                    if not b: break
                    h.update(b); size+=len(b)
            rows.append((rel,size,h.hexdigest())); total+=size
    mh=hashlib.sha256()
    for rel,size,digest in rows: mh.update(f'{digest} {size} {rel}\n'.encode())
    return {'exists':root.is_dir(),'files':len(rows),'bytes':total,'manifest_sha256':mh.hexdigest(),'rows':rows}
roots={'source':manifest('/app/polymarket/results'),'backup':manifest('/backup'),'restore':manifest('/restore')}
for value in roots.values(): value.pop('rows',None)
result={'roots':roots,'source_equals_backup':roots['source']==roots['backup'],'backup_equals_restore':roots['backup']==roots['restore'],'source_equals_restore':roots['source']==roots['restore']}
chain=Path('/restore/h011_v3/raw_chain_v1')
result['raw_chain_exists']=chain.is_dir()
if chain.is_dir():
    try:
        import h011_v3_raw_transaction as rt
        from h011_v3_committed_snapshot import validate_committed_chain_under_lock
        from h011_v3_raw_recovery import recover_raw_scan_transaction
        with rt.RawChainLock(chain,rt.DEFAULT_MARKER_POLICY.manifest_prefix).acquire() as guard:
            result['recovery']=recover_raw_scan_transaction(guard=guard,raw_directory=chain,policy=rt.DEFAULT_MARKER_POLICY)
            result['chain']=validate_committed_chain_under_lock(guard=guard,raw_directory=chain,policy=rt.DEFAULT_MARKER_POLICY)
        result['chain_verified']=True
    except Exception as exc:
        result['chain_verified']=False; result['chain_error']=f'{type(exc).__name__}: {exc}'
else:
    result['chain_verified']=None
print('SENEX_CLONE_RESULT='+json.dumps(result,sort_keys=True,separators=(',',':')))
if not (result['source_equals_backup'] and result['backup_equals_restore'] and result['source_equals_restore']): raise SystemExit(2)
if result['raw_chain_exists'] and result['chain_verified'] is not True: raise SystemExit(3)
'''
              verifier_b64=base64.b64encode(verifier.encode()).decode()
              suffix=run_id[-10:]
              job_name=f'Senex clone verify {suffix}'
              job_payload={'name':job_name,'description':f'Paper-only volume clone verification {product_sha[:12]}','billing':{'deploymentPlan':'nf-compute-20'},'deployment':{'internal':{'id':service,'branch':product_branch,'buildId':build_id,'buildSHA':product_sha},'docker':{'configType':'customCommand','customCommand':'python3 /tmp/verify_clones.py'},'storage':{'ephemeralStorage':{'storageSize':1024}}},'runtimeFiles':{'/tmp/verify_clones.py':{'data':verifier_b64,'encoding':'base64'}},'settings':{'backoffLimit':0,'runOnSourceChange':'never','activeDeadlineSeconds':1800}}
              _,job_obj=call('POST',f'/projects/{project}/jobs',job_payload,'clone_job_create')
              job=data(job_obj); job_id=job.get('id')
              if not job_id: raise RuntimeError('clone verification job id missing')
              evidence['clone_job']={'id':job_id,'name':job.get('name'),'createdAt':job.get('createdAt')}

              backup_name=f'senex-backup-{suffix}'
              backup_payload={'name':backup_name,'mounts':[{'volumeMountPath':'','containerMountPath':'/backup'}],'spec':{'storageClassName':'nvme','storageSize':int(spec.get('storageSize',6144))},'source':{'type':'volume','sourceId':source_volume},'attachedObjects':[{'id':job_id,'type':'job'}]}
              _,backup_obj=call('POST',f'/projects/{project}/volumes',backup_payload,'manual_backup_clone_create')
              backup=data(backup_obj); backup_id=backup.get('id')
              if not backup_id: raise RuntimeError('backup clone id missing')
              backup_final=poll(f'/projects/{project}/volumes/{backup_id}','manual_backup_clone_poll',lambda x:x.get('status')=='BOUND',timeout=1800,interval=10)
              evidence['manual_backup']={'id':backup_id,'name':backup_final.get('name'),'status':backup_final.get('status'),'source':{'type':'volume','sourceId':source_volume},'mounts':backup_final.get('mounts'),'spec':backup_final.get('spec'),'createdAt':backup_final.get('createdAt'),'updatedAt':backup_final.get('updatedAt')}

              restore_name=f'senex-restore-{suffix}'
              restore_payload={'name':restore_name,'mounts':[{'volumeMountPath':'','containerMountPath':'/restore'}],'spec':{'storageClassName':'nvme','storageSize':int(spec.get('storageSize',6144))},'source':{'type':'volume','sourceId':backup_id},'attachedObjects':[{'id':job_id,'type':'job'}]}
              _,restore_obj=call('POST',f'/projects/{project}/volumes',restore_payload,'isolated_restore_clone_create')
              restore=data(restore_obj); restore_id=restore.get('id')
              if not restore_id: raise RuntimeError('restore clone id missing')
              restore_final=poll(f'/projects/{project}/volumes/{restore_id}','isolated_restore_clone_poll',lambda x:x.get('status')=='BOUND',timeout=1800,interval=10)
              evidence['isolated_restore_volume']={'id':restore_id,'name':restore_final.get('name'),'status':restore_final.get('status'),'source':{'type':'volume','sourceId':backup_id},'mounts':restore_final.get('mounts'),'spec':restore_final.get('spec'),'createdAt':restore_final.get('createdAt'),'updatedAt':restore_final.get('updatedAt')}

              call('POST',f'/projects/{project}/volumes/{source_volume}/attach',{'nfObject':{'id':job_id,'type':'job'}},'attach_source_to_clone_job')
              _,run_obj=call('POST',f'/projects/{project}/jobs/{job_id}/runs',{},'clone_job_run_start')
              clone_run_id=data(run_obj).get('id')
              if not clone_run_id: raise RuntimeError('clone verification run id missing')
              clone_run=poll(f'/projects/{project}/jobs/{job_id}/runs/{clone_run_id}','clone_job_run_poll',lambda x:bool(x.get('concluded')),timeout=1800,interval=10)
              if clone_run.get('status')!='SUCCESS': raise RuntimeError(f'clone verification job failed: {scrub(clone_run)}')
              q=urllib.parse.urlencode({'runId':clone_run_id,'queryType':'range','duration':3600,'lineLimit':1000,'direction':'forward'})
              logs=data(call('GET',f'/projects/{project}/jobs/{job_id}/logs?{q}',label='clone_job_logs')[1])
              marker=None
              for entry in logs if isinstance(logs,list) else []:
                  line=str(entry.get('log','')); prefix='SENEX_CLONE_RESULT='
                  if prefix in line:
                      try: marker=json.loads(line.split(prefix,1)[1].strip())
                      except Exception: pass
              if not marker or not marker.get('source_equals_backup') or not marker.get('backup_equals_restore'): raise RuntimeError('clone equality marker missing or failed')
              if marker.get('raw_chain_exists') and marker.get('chain_verified') is not True: raise RuntimeError('restored raw chain validation failed')
              evidence['clone_verification']={'run_id':clone_run_id,'status':clone_run.get('status'),'startedAt':clone_run.get('startedAt'),'concludedAt':clone_run.get('concludedAt'),'result':marker}
              evidence['phase_d']='BACKUP_RESTORE_PASS'
              persist()
              call('POST',f'/projects/{project}/volumes/{source_volume}/detach',{'nfObject':{'id':job_id,'type':'job'}},'detach_source_from_clone_job')

              # Set only explicit safe runtime values; no secret values are read or exported.
              safe_env={'SENECIO_CODE_SHA':product_sha,'H011_RESULTS_DIR':'/app/polymarket/results','H011_PIPELINE_VERSION':'integrity-v3','PAPER_ONLY':'true','ORDERS_ENABLED':'false','LIVE_CAPITAL_LOCKED':'true'}
              env_result=data(call('POST',f'/projects/{project}/services/{service}/runtime-environment',{'runtimeEnvironment':safe_env},'set_safe_runtime_environment')[1])
              evidence['runtime_environment']={'names':sorted(safe_env),'success':env_result.get('success'),'restartSuccessful':env_result.get('restartSuccessful'),'values_exported':False}

              # Exact deploy, public verification, controlled rollback, and final exact deploy.
              deploy(build_id,product_sha,'deploy_exact_product')
              scale(1); service_scaled_zero=False
              state_new=public_get('/api/v3/state','public_new_before_rollback',product_sha)
              state_obj=state_new['object']
              if not (state_obj.get('paper_only') is True and state_obj.get('orders_enabled') is False and state_obj.get('live_capital_locked') is True): raise RuntimeError('new deployment safety invariant failure')
              evidence['deploy_exact_initial']={'build_id':build_id,'sha':product_sha,'state':scrub(state_obj),'response_sha256':state_new['body_sha256']}

              deploy(rollback['build_id'],rollback['sha'],'rollback_drill_deploy_old')
              # Runtime environment must reflect the rollback SHA for truthful public provenance.
              call('POST',f'/projects/{project}/services/{service}/runtime-environment',{'runtimeEnvironment':dict(safe_env,SENECIO_CODE_SHA=rollback['sha'])},'rollback_set_sha')
              public_get('/api/v3/state','public_rollback',rollback['sha'])
              evidence['rollback_drill']={'rollback_build_id':rollback['build_id'],'rollback_sha':rollback['sha'],'rollback_public_verified':True,'result':'PASS'}

              deploy(build_id,product_sha,'rollback_drill_redeploy_exact')
              call('POST',f'/projects/{project}/services/{service}/runtime-environment',{'runtimeEnvironment':safe_env},'final_set_sha')
              final_state=public_get('/api/v3/state','public_final_state',product_sha)
              final_obj=final_state['object']
              if not (final_obj.get('paper_only') is True and final_obj.get('orders_enabled') is False and final_obj.get('live_capital_locked') is True): raise RuntimeError('final safety invariant failure')
              endpoints={}
              for route in ('/','/healthz','/api/v3/state','/api/v3/integrity','/api/v3/replay'):
                  endpoints[route]=public_get(route,'final_'+route.replace('/','_'),product_sha)
              evidence['public_client_urllib']=scrub(endpoints)
              evidence['phase_e']='DEPLOYED_ONE_CLIENT_PASS'
              evidence['phase_d']='PASS'
              evidence['production_mutated']=True
              evidence['final_deployment']={'build_id':build_id,'source_sha':product_sha,'source_tree':product_tree,'public_state_sha256':final_state['body_sha256']}
              final_deployed=True
              persist()
          except Exception as exc:
              evidence['failure']={'error_class':type(exc).__name__,'message':str(exc)}
              evidence['phase_d']='FAILED'
              evidence['phase_e']='FAILED'
              # Fail closed to the recorded rollback build whenever possible.
              try:
                  if rollback and rollback.get('build_id') and rollback.get('sha'):
                      deploy(rollback['build_id'],rollback['sha'],'automatic_failure_rollback')
                      safe={'SENECIO_CODE_SHA':rollback['sha'],'H011_RESULTS_DIR':'/app/polymarket/results','H011_PIPELINE_VERSION':'integrity-v3','PAPER_ONLY':'true','ORDERS_ENABLED':'false','LIVE_CAPITAL_LOCKED':'true'}
                      call('POST',f'/projects/{project}/services/{service}/runtime-environment',{'runtimeEnvironment':safe},'automatic_failure_rollback_sha')
                      scale(1); service_scaled_zero=False
                      evidence['automatic_failure_rollback']={'result':'PASS','build_id':rollback['build_id'],'sha':rollback['sha']}
              except Exception as recovery_exc:
                  evidence['automatic_failure_rollback']={'result':'FAILED','error_class':type(recovery_exc).__name__,'message':str(recovery_exc)}
              persist()
              raise
          finally:
              evidence['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat(); persist()
          raw=path.read_bytes(); pathlib.Path('evidence/SHA256SUMS').write_text(hashlib.sha256(raw).hexdigest()+'  phase_de.json\n')
          print(json.dumps({'phase_c':evidence['phase_c'],'phase_d':evidence['phase_d'],'phase_e':evidence['phase_e'],'product_sha':product_sha,'build_id':evidence.get('exact_build',{}).get('id'),'backup_volume_id':evidence.get('manual_backup',{}).get('id'),'restore_volume_id':evidence.get('isolated_restore_volume',{}).get('id'),'rollback':evidence.get('rollback_drill'),'secret_values_exported':False},sort_keys=True))
          PY
          (cd evidence && sha256sum -c SHA256SUMS)

      - name: Validate public runtime with independent curl client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/curl
          for route in '' healthz api/v3/state api/v3/integrity api/v3/replay; do
            name="${route//\//_}"; test -n "$name" || name=root
            curl --fail --silent --show-error --location --max-time 30 \
              --user-agent 'senex-arq-public-curl/1' \
              "${PUBLIC_BASE}/${route}" -o "evidence/curl/${name}.body"
            sha256sum "evidence/curl/${name}.body" >> evidence/curl/SHA256SUMS
          done
          python - <<'PY'
          import json
          from pathlib import Path
          sha='6ee7a139055766a1e2fda1eae7e39358e88974c2'
          for name in ('healthz','api_v3_state','api_v3_integrity','api_v3_replay'):
              obj=json.loads(Path(f'evidence/curl/{name}.body').read_text())
              assert sha in json.dumps(obj,sort_keys=True), (name,obj)
          state=json.loads(Path('evidence/curl/api_v3_state.body').read_text())
          assert state['paper_only'] is True
          assert state['orders_enabled'] is False
          assert state['live_capital_locked'] is True
          Path('evidence/curl/validation.json').write_text(json.dumps({'client':'curl','status':'PASS','source_sha':sha,'paper_only':True,'orders_enabled':False,'live_capital_locked':True},sort_keys=True,indent=2)+'\n')
          PY
          (cd evidence/curl && sha256sum -c SHA256SUMS)

      - name: Upload Phase D-E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-phase-de-${{ github.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: warn
