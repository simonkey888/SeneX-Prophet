name: SENEX 050 Oracle Deploy Terminal

on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/senex-050-oracle-deploy-terminal.yml]

permissions:
  contents: read

env:
  NF_API: https://api.northflank.com/v1
  PROJECT_ID: seneciobot
  SERVICE_ID: seneciobot
  SERVICE_BRANCH: feat/oracle-paper-health
  TARGET_SHA: 06de3906d573c11668d532e12187dafd7c7f495b
  PUBLIC_URL: https://p01--seneciobot--wbjggn89fnf8.code.run

jobs:
  deploy-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: northflank-readonly-audit
    steps:
      - name: Checkout exact merged product SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact merged product ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/${SERVICE_BRANCH} | awk '{print $1}')" = "$TARGET_SHA"
      - name: Deploy only existing seneciobot and capture fresh public truth
        id: deploy
        shell: bash
        env:
          NORTHFLANK_SENEX_MAINTENANCE_TOKEN: ${{ secrets.NORTHFLANK_SENEX_MAINTENANCE_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_SENEX_MAINTENANCE_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_SENEX_MAINTENANCE_TOKEN}"
          mkdir -p evidence /tmp/senex050
          python - <<'PY'
          from __future__ import annotations
          import datetime, hashlib, json, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          API=os.environ['NF_API'].rstrip('/'); TOKEN=os.environ['NORTHFLANK_SENEX_MAINTENANCE_TOKEN']; PROJECT=os.environ['PROJECT_ID']; SERVICE=os.environ['SERVICE_ID']; BRANCH=os.environ['SERVICE_BRANCH']; TARGET=os.environ['TARGET_SHA']; PUBLIC=os.environ['PUBLIC_URL'].rstrip('/')
          HEAD={'Authorization':f'Bearer {TOKEN}','Accept':'application/json','Content-Type':'application/json','User-Agent':'senex-arq-050/1'}
          out={'order':'AUD-SENEX-DASHBOARD-LIVE-INTEGRATION-REMEDIATION-050','started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'target_service':SERVICE,'target_sha':TARGET,'requests':[],'secret_values_exported':False,'runtime_017_touched':False,'h011_mutation':False,'new_service':False,'new_job':False,'new_addon':False,'new_volume':False,'replica_scale_up':False,'plan_change':False,'billing_classification':'NOT_PROVEN_UNCHANGED_BY_AUD050','safety':{'paper_only':True,'H011_ORDERS_ENABLED':False,'orders_enabled':False,'live_capital_locked':True,'REAL_ORDER_NETWORK_CALLS':0,'WALLET_OR_PRIVATE_KEY_ACCESS':0,'REAL_CAPITAL_ACTIONS':0}}
          def persist():
            raw=(json.dumps(out,sort_keys=True,indent=2)+'\n').encode(); Path('evidence/senex-050-terminal.json').write_bytes(raw); Path('evidence/SHA256SUMS').write_text(hashlib.sha256(raw).hexdigest()+'  senex-050-terminal.json\n'); return hashlib.sha256(raw).hexdigest()
          def data(o): return o.get('data',o) if isinstance(o,dict) else o
          def call(method,path,payload=None,label=None):
            body=None if payload is None else json.dumps(payload,separators=(',',':')).encode(); req=urllib.request.Request(API+path,headers=HEAD,data=body,method=method); raw=b''; status=0
