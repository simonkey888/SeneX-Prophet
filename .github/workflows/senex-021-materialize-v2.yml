name: SENEX 021 Evidence Recovery Materializer

on:
  push:
    branches:
      - feat/senex-real-data-evidence-campaign-v1
    paths:
      - ".github/workflows/senex-021-materialize-v2.yml"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  recover-material-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove 020 parent and self-retire trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/senex-real-data-evidence-campaign-v1"
          git merge-base --is-ancestor d00d9f7a97209cc0eca8ac327c830a919e027f67 HEAD
          test "$(git rev-parse d00d9f7a97209cc0eca8ac327c830a919e027f67^{tree})" = "7fe5ad20f4f7b4964492775d0d2ebf85510250c8"
          test -f research/real_data_021/first_holdout_observed.json
          git rm .github/workflows/senex-021-materialize-v2.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install exact hashed CI lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r polymarket/requirements-h011-v3.txt

      - name: Pre-capture focused and safety gates
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q polymarket/mega_research/real_data_021.py tests/mega_research/test_real_data_021.py
          python -m pytest -q tests/mega_research/test_real_data_021.py tests/mega_research/test_mega_research_v2.py
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/senex-021-paper-before.json

      - name: Collect replacement provenance dataset from official public read-only endpoints
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/senex-021-recovery
          mkdir -p /tmp/senex-021-recovery
          python -m polymarket.mega_research.real_data_021 collect \
            --output /tmp/senex-021-recovery \
            --markets 40 \
            --rounds 6 \
            --interval 300

      - name: Freeze replacement dataset before evaluation
        shell: bash
        env:
          RECOVERY_CODE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/senex-021-recovery')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          capture=root/'capture_manifest.json'
          first=Path('research/real_data_021/first_holdout_observed.json')
          payload={
            'schema_version':'senex-real-data-021-recovery-freeze-v1',
            'authority_comment_id':5216481413,
            'code_sha':os.environ['RECOVERY_CODE_SHA'],
            'capture_manifest_sha256':h(capture),
            'raw_evidence_sha256':json.loads(capture.read_text())['raw_evidence_sha256'],
            'evaluation_protocol_sha256':h(Path('research/real_data_021/evaluation_protocol.json')),
            'preregistration_sha256':h(Path('research/real_data_021/preregistration.json')),
            'first_holdout_observed_sha256':h(first),
            'promotion_eligible':False,
            'reason':'FIRST_HOLDOUT_ALREADY_OBSERVED_IN_RUN_31185144120',
          }
          (root/'pre_evaluation_freeze.json').write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Evaluate once then hard-demote recovery results to non-promotable evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m polymarket.mega_research.real_data_021 evaluate \
            --output /tmp/senex-021-recovery \
            --preregistration research/real_data_021/preregistration.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/senex-021-recovery')
          report_path=root/'evaluation_report.json'
          report=json.loads(report_path.read_text())
          for exp in report['experiments'].values():
            observed=exp['status']
            exp['observed_recovery_status_before_demote']=observed
            if observed != 'INVALID':
              exp['status']='INCONCLUSIVE'
              exp['reason']='RECAPTURE_AFTER_FIRST_HOLDOUT_OBSERVED_NON_PROMOTABLE'
          report['promotion_eligibility']='NO_FIRST_HOLDOUT_ALREADY_OBSERVED'
          report['validated_edge']=False
          report_path.write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          manifest_path=root/'dataset_manifest.json'
          manifest=json.loads(manifest_path.read_text())
          manifest['evaluation_report_sha256']=h(report_path)
          manifest['promotion_eligibility']='NO_FIRST_HOLDOUT_ALREADY_OBSERVED'
          manifest_path.write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n')
          (root/'dataset_manifest.json.sha256').write_text(h(manifest_path)+'  dataset_manifest.json\n')
          terminal_path=root/'terminal_binding.json'
          terminal=json.loads(terminal_path.read_text())
          terminal['OOS_STATUS']='INCONCLUSIVE'
          terminal['VALIDATED_EDGE']=False
          terminal['PROMOTION_ELIGIBILITY']='NO_FIRST_HOLDOUT_ALREADY_OBSERVED'
          terminal['REAL_DATASET_HASH']=h(manifest_path)
          terminal_path.write_text(json.dumps(terminal,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Bind run provenance and validate truth gates
        shell: bash
        env:
          ACTIONS_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/senex-021-recovery')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          mp=root/'dataset_manifest.json'; m=json.loads(mp.read_text())
          m.update({'github_actions_run_id':int(os.environ['ACTIONS_RUN_ID']),'github_actions_run_attempt':int(os.environ['ACTIONS_RUN_ATTEMPT']),'raw_artifact_name':f"senex-021-recovery-raw-{os.environ['ACTIONS_RUN_ID']}",'pre_evaluation_freeze_sha256':h(root/'pre_evaluation_freeze.json')})
          mp.write_text(json.dumps(m,sort_keys=True,separators=(',',':'))+'\n')
          (root/'dataset_manifest.json.sha256').write_text(h(mp)+'  dataset_manifest.json\n')
          t=root/'terminal_binding.json'; tj=json.loads(t.read_text()); tj['REAL_DATASET_HASH']=h(mp); t.write_text(json.dumps(tj,sort_keys=True,separators=(',',':'))+'\n')
          r=json.loads((root/'evaluation_report.json').read_text())
          assert r['point_in_time_leakage']==0 and r['future_event_access']==0 and r['resolution_leakage']==0
          assert r['replay_determinism']=='PASS'
          assert r['quality']['RAW_HASH_INTEGRITY']=='PASS'
          assert r['validated_edge'] is False
          assert all(x['status'] in {'INCONCLUSIVE','INVALID'} for x in r['experiments'].values())
          assert r['safety']=={'paper_only':True,'orders_enabled':False,'live_capital_locked':True,'real_order_network_calls':0,'wallet_or_private_key_access':0,'real_capital_actions':0,'cost_usd':0}
          assert m['markets_observed']>=30 and m['events_observed']>0
          hashes={'DATASET_MANIFEST_SHA256':h(mp),'EVALUATION_REPORT_SHA256':h(root/'evaluation_report.json'),'RAW_EVIDENCE_SHA256':m['raw_artifact_sha256'],'FREEZE_SHA256':h(root/'pre_evaluation_freeze.json')}
          (root/'materialization_hashes.json').write_text(json.dumps(hashes,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps({'markets':m['markets_observed'],'events':m['events_observed'],'span':m['time_span_seconds'],'quality':r['quality']['DATA_QUALITY_STATE'],'experiments':{k:v['status'] for k,v in r['experiments'].items()},**hashes},sort_keys=True))
          PY

      - name: Materialize small canonical evidence and regenerate governance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/real_data_021/materialized
          for f in capture_manifest.json pre_evaluation_freeze.json evaluation_report.json dataset_manifest.json dataset_manifest.json.sha256 terminal_binding.json materialization_hashes.json curated_fixture.jsonl; do cp "/tmp/senex-021-recovery/$f" research/real_data_021/materialized/; done
          python tools/verify_repository_contract.py --root . --generate > /tmp/senex-021-governance-generation.json

      - name: Full regression safety and deterministic sidecar
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/senex-021-paper-final.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/senex-021-paper-final.json'))
          assert r['status']=='PASS' and len(r.get('findings',[]))==0 and r.get('secret_values_observed') is False
          PY
          (cd research/real_data_021/materialized && sha256sum -c dataset_manifest.json.sha256)

      - name: Upload immutable raw recovery evidence outside Git history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-021-recovery-raw-${{ github.run_id }}
          path: |
            /tmp/senex-021-recovery/raw_evidence.jsonl.gz
            /tmp/senex-021-recovery/capture_manifest.json
            /tmp/senex-021-recovery/pre_evaluation_freeze.json
            /tmp/senex-021-recovery/evaluation_report.json
            /tmp/senex-021-recovery/dataset_manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Commit evidence and self-retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SENEX ARQ 021"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research(021): materialize non-promotable real-data evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "MATERIALIZED_HEAD=$(git rev-parse HEAD)"
          echo "MATERIALIZED_TREE=$(git rev-parse HEAD^{tree})"
