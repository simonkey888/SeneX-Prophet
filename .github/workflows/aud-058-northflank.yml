name: AUD-058 Northflank credential check

on:
  push:
    branches:
      - ops/aud-058-northflank

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: northflank-readonly-audit
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_SENEX_MAINTENANCE_TOKEN }}
    steps:
      - name: Verify Northflank access without exposing token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NF_TOKEN:-}" ]; then
            echo "NORTHFLANK_MAINTENANCE_TOKEN_PRESENT=NO"
            exit 42
          fi
          echo "::add-mask::$NF_TOKEN"
          code=$(curl -sS -o /tmp/service.json -w '%{http_code}' \
            -H "Authorization: Bearer $NF_TOKEN" \
            https://api.northflank.com/v1/projects/seneciobot/services/senecio-h011)
          echo "NORTHFLANK_GET_HTTP=$code"
          test "$code" = "200"
          jq -r '.data | "SERVICE_ID=\(.id)\nSERVICE_TYPE=\(.serviceType)\nDISABLED_CD=\(.disabledCD)\nACTIVE_SHA=\(.deployment.internal.buildSHA // \"UNKNOWN\")"' /tmp/service.json
