name: AUD-064 Finalize A1 Freeze Receipt

on:
  push:
    branches:
      - ops/aud-064-finalize-a1-control

permissions:
  contents: read

jobs:
  final-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NF_API: ${{ secrets.NORTHFLANK_API_TOKEN }}
      PROJECT_ID: seneciobot
      SERVICE_ID: senecio-h011
      TARGET_SHA: 7af4b3bbc8cbfc839c981ac2ab2b5b4f06ecf690
      TARGET_TREE: 27eb923e615614b43fe3c29ecace8b7ef503045e
      BUILD_ID: humorous-desk-7155
      PROD_URL: https://h011-web--senecio-h011--wbjggn89fnf8.code.run
    steps:
      - name: Checkout final production main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7af4b3bbc8cbfc839c981ac2ab2b5b4f06ecf690
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize final exact deployment and 72h freeze receipt
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$TARGET_SHA"
          test -n "${NF_API:-}"
          echo "::add-mask::$NF_API"
          token=$(printf '%s' "$NF_API" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//;s/^Bearer[[:space:]]+//I;s/^"(.*)"$/\1/')
          curl -fsS -H "Authorization: Bearer $token" "https://api.northflank.com/v1/projects/$PROJECT_ID/services/$SERVICE_ID" >/tmp/service.json
          curl -fsS -H "Authorization: Bearer $token" "https://api.northflank.com/v1/projects/$PROJECT_ID/services/$SERVICE_ID/deployment" >/tmp/deployment.json
          curl -fsS "$PROD_URL/api/health" >/tmp/health.json
          test "$(jq -r '.data.disabledCI' /tmp/service.json)" = true
          test "$(jq -r '.data.deployment.internal.buildSHA' /tmp/service.json)" = "$TARGET_SHA"
          test "$(jq -r '.data.deployment.internal.deployedSHA' /tmp/service.json)" = "$TARGET_SHA"
          test "$(jq -r '.data.status.deployment.status' /tmp/service.json)" = COMPLETED
          test "$(jq -r '.status' /tmp/health.json)" = ok
          nfobj=$(jq -r '.data.deployment.internal.nfObjectId // .data.deployment.internal.id // empty' /tmp/service.json)
          if [ -z "$nfobj" ]; then nfobj=$(jq -r '.data.internal.nfObjectId // .data.internal.id // empty' /tmp/deployment.json); fi
          test -n "$nfobj"
          freeze_start=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          freeze_end=$(date -u -d "$freeze_start +72 hours" +'%Y-%m-%dT%H:%M:%SZ')
          mkdir -p final-receipt
          jq -n \
            --arg sha "$TARGET_SHA" \
            --arg tree "$TARGET_TREE" \
            --arg build "$BUILD_ID" \
            --arg deployment "$nfobj" \
            --arg start "$freeze_start" \
            --arg end "$freeze_end" \
            --argjson cycles "$(jq -r '.oracle.cycles_run // 0' /tmp/health.json)" \
            '{order:"AUD-064-FINALIZE-A1",status:"COMPLETE_READY_FOR_CONTROL_LOG",final_production_sha:$sha,final_production_tree:$tree,northflank_build_id:$build,northflank_deployment_id:$deployment,northflank_automatic_ci:false,northflank_exact_sha_pinned:true,unreviewed_main_write_can_auto_deploy:false,runtime_health:"PASS",oracle_cycles_run:$cycles,architecture_freeze:"72H",freeze_start:$start,freeze_end:$end,freeze_policy:"BUGFIX_ONLY_TRUTH_SETTLEMENT_CAUSAL_PROVENANCE_SAFETY_AVAILABILITY",threshold_tuning:0,base_weight_tuning:0,external_directional_activation:0,runtime017_mutations:0,real_trading:0}' > final-receipt/aud-064-finalize-a1-freeze.json
          echo "NORTHFLANK_BUILD_ID=$BUILD_ID"
          echo "NORTHFLANK_DEPLOYMENT_ID=$nfobj"
          echo "FINAL_PRODUCTION_SHA=$TARGET_SHA"
          echo "FINAL_PRODUCTION_TREE=$TARGET_TREE"
          echo "ARCHITECTURE_FREEZE=72H"
          echo "FREEZE_START=$freeze_start"
          echo "FREEZE_END=$freeze_end"
          echo 'UNREVIEWED_MAIN_WRITE_CAN_AUTO_DEPLOY=false'

      - name: Upload final freeze receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aud-064-finalize-a1-freeze-${{ env.TARGET_SHA }}
          path: final-receipt/
          if-no-files-found: error
          retention-days: 14
