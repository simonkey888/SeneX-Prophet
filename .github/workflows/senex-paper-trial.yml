name: SENEX Paper Trial

on:
  push:
    branches:
      - release/senex-paper-trial-v1
  pull_request:
    branches:
      - governance/senex-r0-contract-gates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senex-paper-trial-${{ github.ref }}
  cancel-in-progress: false

env:
  TERM: xterm
  EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  paper-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_SHA}"
          git diff --check 39e1cf1bdad31a2b6f2178949a2977c837ebdf18..."${EXACT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt

      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall polymarket tools tests
          python -m pytest -q tests/governance tests/paper_trial
          python -m pytest -q

      - name: Static real-execution exclusion gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_repository_contract.py \
            --base 39e1cf1bdad31a2b6f2178949a2977c837ebdf18 \
            --head "${EXACT_SHA}" \
            --report /tmp/contract-report.json

      - name: Build exact-head container
        shell: bash
        run: |
          set -euo pipefail
          docker build -f polymarket/Dockerfile.h011-v3 -t senex-paper-trial:"${EXACT_SHA}" .

      - name: Deterministic fixture paper trial
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/paper-fixture"
          mkdir -p "${RUNNER_TEMP}/paper-fixture"
          docker run --rm \
            -e SENECIO_CODE_SHA="${EXACT_SHA}" \
            -v "${RUNNER_TEMP}/paper-fixture:/trial" \
            senex-paper-trial:"${EXACT_SHA}" \
            python3 /app/polymarket/paper/trial_runner.py \
              --output-dir /trial --fixture --duration-minutes 1 --minimum-windows 1
          (cd "${RUNNER_TEMP}/paper-fixture" && sha256sum -c SHA256SUMS)
          python - "${RUNNER_TEMP}/paper-fixture/trial_summary.json" <<'PY'
          import json, sys
          summary=json.load(open(sys.argv[1]))
          assert summary['fills'] >= 2
          assert summary['replay_result'] == 'PASS'
          assert summary['raw_chain_verified'] is True
          assert summary['paper_only'] is True
          assert summary['orders_enabled'] is False
          assert summary['live_capital_locked'] is True
          assert summary['real_order_network_calls'] == 0
          assert summary['real_order_methods_reachable'] == 0
          assert summary['wallet_private_key_dependencies'] == 0
          PY

      - name: Upload fixture evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-paper-fixture-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/paper-fixture
          retention-days: 7
          if-no-files-found: error

  observed-paper-trial:
    if: github.event_name != 'pull_request'
    needs: paper-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_SHA}"

      - name: Build observed trial container
        shell: bash
        run: |
          set -euo pipefail
          docker build -f polymarket/Dockerfile.h011-v3 -t senex-paper-trial:"${EXACT_SHA}" .

      - name: Run public GET paper trial
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/paper-observed"
          mkdir -p "${RUNNER_TEMP}/paper-observed"
          docker run --rm \
            -e SENECIO_CODE_SHA="${EXACT_SHA}" \
            -v "${RUNNER_TEMP}/paper-observed:/trial" \
            senex-paper-trial:"${EXACT_SHA}" \
            python3 /app/polymarket/paper/trial_runner.py \
              --output-dir /trial --duration-minutes 60 --minimum-windows 12 --poll-seconds 15
          (cd "${RUNNER_TEMP}/paper-observed" && sha256sum -c SHA256SUMS)
          python - "${RUNNER_TEMP}/paper-observed/trial_summary.json" <<'PY'
          import json, sys
          summary=json.load(open(sys.argv[1]))
          assert summary['duration_seconds'] >= 3600
          assert summary['valid_order_book_windows'] >= 12
          assert summary['valid_order_books'] >= 24
          assert summary['windows_observed'] == summary['valid_order_book_windows']
          assert summary['gamma_discovered_windows'] >= summary['valid_order_book_windows']
          assert summary['unexpected_source_failures'] <= 12
          assert summary['source_failures'] == summary['unexpected_source_failures']
          assert summary['replay_result'] == 'PASS'
          assert summary['raw_chain_verified'] is True
          assert summary['paper_only'] is True
          assert summary['orders_enabled'] is False
          assert summary['live_capital_locked'] is True
          assert summary['real_order_network_calls'] == 0
          assert summary['real_order_methods_reachable'] == 0
          assert summary['wallet_private_key_dependencies'] == 0
          PY

      - name: Upload observed paper-trial evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-paper-observed-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/paper-observed
          retention-days: 7
          if-no-files-found: error
