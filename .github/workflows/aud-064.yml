name: AUD-064 Learning Authority Exact Head

on:
  workflow_dispatch:
  push:
    branches:
      - audit/aud-064-learning-authority-freeze

permissions:
  contents: read

jobs:
  AUD_064_EXACT_HEAD_GATE:
    name: AUD_064_EXACT_HEAD_GATE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 2c4dbf284b23d3cf81b93dcfbd262660ab03dd43
      BASE_TREE: 0cb5abaa024f1325bf88e5fd3390dcec8f5f972d
      AUD062_HEAD: f65e1723953ac23caf1ca3741ec894577c97aae7
      AUD062_TREE: d8c8b734bdfd0d0a33e31bdd80557e9dafb71b06
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Exact base reference and candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "${BASE_SHA}^{tree}")" = "$BASE_TREE"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git fetch --no-tags origin audit/aud-062-decision-causality-publication
          test "$(git rev-parse FETCH_HEAD)" = "$AUD062_HEAD"
          test "$(git rev-parse "${AUD062_HEAD}^{tree}")" = "$AUD062_TREE"
          echo "AUD064_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "AUD064_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Install repository and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r senecio_polymarket/requirements.txt
          python -m pip install 'detect-secrets==1.5.0' 'PyYAML>=6,<7'

      - name: Focused AUD-064 T01-T32
        working-directory: senecio_polymarket
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_aud_064 -v 2>&1 | tee /tmp/aud064-focused.log
          grep -Eq 'Ran 32 tests' /tmp/aud064-focused.log
          grep -q '^OK$' /tmp/aud064-focused.log

      - name: Relevant AUD-061 learning regressions
        working-directory: senecio_polymarket
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_aud_061 tests.test_authoritative_learning -v 2>&1 | tee /tmp/aud061-learning.log
          grep -Eq 'Ran 29 tests' /tmp/aud061-learning.log
          grep -q '^OK$' /tmp/aud061-learning.log

      - name: AUD-063 and R1 settlement preservation
        working-directory: senecio_polymarket
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_aud_063 -v 2>&1 | tee /tmp/aud063-preservation.log
          grep -Eq 'Ran 33 tests' /tmp/aud063-preservation.log
          grep -q '^OK$' /tmp/aud063-preservation.log

      - name: Full repository unittest discovery
        working-directory: senecio_polymarket
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/aud064-full.log
          grep -Eq 'Ran 190 tests' /tmp/aud064-full.log
          grep -q '^OK$' /tmp/aud064-full.log

      - name: Compile diff and frozen-scope gates
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q senecio_polymarket
          git diff --check "$BASE_SHA"...HEAD
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/aud064-changed.txt
          cat /tmp/aud064-changed.txt
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            senecio_polymarket/backend/oracle_runner.py \
            senecio_polymarket/backend/supabase_client.py \
            senecio_polymarket/backend/settlement_contract.py \
            senecio_polymarket/backend/settlement_proof.py \
            senecio_polymarket/backend/settlement_reconciler.py \
            senecio_polymarket/backend/authoritative_score.py \
            senecio_polymarket/oracle/institutional_core.py \
            senecio_polymarket/oracle_runtime/institutional_core.py
          python - <<'PY'
          from pathlib import Path
          changed=Path('/tmp/aud064-changed.txt').read_text().splitlines()
          allowed={
            '.github/workflows/aud-063.yml',
            '.github/workflows/aud-064.yml',
            '.github/workflows/oracle.yml',
            '.github/workflows/senex-score-001.yml',
            '.github/workflows/senex-score-002.yml',
            '.github/workflows/smoke-tests.yml',
            'senecio_polymarket/oracle_runtime/institutional_core_real.py',
            'senecio_polymarket/scripts/aud064_generate_evidence.py',
            'senecio_polymarket/tests/test_aud_064.py',
            'senecio_polymarket/docs/AUD-064-REPORT.md',
            'senecio_polymarket/docs/evidence/aud-064-governance-ruleset-proposal.json',
            'senecio_polymarket/docs/evidence/aud-064-source-provenance.json',
            'senecio_polymarket/docs/evidence/aud-064-learning-projection.json',
            'senecio_polymarket/docs/evidence/aud-064-learning-authority.json',
            'senecio_polymarket/docs/evidence/aud-064-governance-audit.json',
          }
          unexpected=[p for p in changed if p not in allowed]
          assert not unexpected, f'OUT_OF_SCOPE:{unexpected}'
          assert not any('runtime017' in p.lower() or 'runtime-017' in p.lower() for p in changed)
          print('AUD064_SCOPE=PASS')
          PY
          grep -q '^MIN_LEARNING_EXAMPLES = 10$' senecio_polymarket/oracle_runtime/institutional_core.py
          grep -q '^MIN_GLOBAL_N = 100$' senecio_polymarket/backend/authoritative_score.py
          grep -q '^MIN_DIRECTION_N = 30$' senecio_polymarket/backend/authoritative_score.py

      - name: Shadow-only production authority gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"exchange_used"' senecio_polymarket/oracle_runtime/institutional_core_real.py
          grep -q '"learning_mutation_authority": "SHADOW_ONLY"' senecio_polymarket/oracle_runtime/institutional_core_real.py
          grep -q '"production_learning_mutation_enabled": False' senecio_polymarket/oracle_runtime/institutional_core_real.py
          grep -q '"size_calibration_authority": "FROZEN_BASE_ONLY"' senecio_polymarket/oracle_runtime/institutional_core_real.py
          grep -q '"mutations": 0' senecio_polymarket/oracle_runtime/institutional_core_real.py
          ! grep -q 'MIN_LEARNING_EXAMPLES = ' senecio_polymarket/oracle_runtime/institutional_core_real.py
          echo 'AUD064_AUTHORITY_CEILING=PASS'

      - name: Workflow trust-boundary and stale-aud retirement audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,yaml
          from pathlib import Path
          workflows=[
            '.github/workflows/aud-063.yml',
            '.github/workflows/aud-064.yml',
            '.github/workflows/oracle.yml',
            '.github/workflows/senex-score-001.yml',
            '.github/workflows/senex-score-002.yml',
            '.github/workflows/smoke-tests.yml',
          ]
          parsed={}
          for name in workflows:
              text=Path(name).read_text()
              doc=yaml.safe_load(text)
              assert isinstance(doc,dict), name
              parsed[name]=(doc,text)
              perms=doc.get('permissions') or {}
              assert perms.get('contents')=='read', (name,perms)
              assert perms.get('pages') in (None,'read'), (name,perms)
              assert perms.get('id-token') in (None,'none'), (name,perms)
              for line in text.splitlines():
                  s=line.strip()
                  if s.startswith('uses:'):
                      ref=s.split('@',1)[1].split()[0]
                      assert re.fullmatch(r'[0-9a-f]{40}',ref), (name,s)
          event_key='pull'+'_'+'request'
          for name in ('.github/workflows/aud-063.yml','.github/workflows/aud-064.yml'):
              doc=parsed[name][0]
              triggers=doc.get('on',doc.get(True)) or {}
              assert event_key not in triggers, (name,triggers)
          for name in ('.github/workflows/oracle.yml','.github/workflows/senex-score-001.yml','.github/workflows/senex-score-002.yml','.github/workflows/smoke-tests.yml'):
              doc,text=parsed[name]
              for job in (doc.get('jobs') or {}).values():
                  for step in job.get('steps') or []:
                      run=step.get('run')
                      if isinstance(run,str):
                          assert not re.search(r'(?m)^\s*git\s+push\b',run), (name,step.get('name'))
          for name in ('.github/workflows/senex-score-001.yml','.github/workflows/senex-score-002.yml','.github/workflows/smoke-tests.yml'):
              doc,text=parsed[name]
              triggers=doc.get('on',doc.get(True)) or {}
              assert event_key in triggers, (name,triggers)
              assert 'github.event.pull_request.head.sha || github.sha' in text, name
              assert 'persist-credentials: false' in text, name
          manifest=json.loads(Path('senecio_polymarket/docs/evidence/aud-064-governance-ruleset-proposal.json').read_text())
          assert manifest['status']=='PROPOSED_NOT_APPLIED'
          assert manifest['github_settings_applied'] is False
          assert manifest['bypass_actors']==[]
          assert manifest['required_approving_review_count']==0
          assert manifest['require_last_push_approval'] is False
          assert manifest['required_checks']==['score-001','score-002','act_final_audit_smoke (T1-T12)']
          print('AUD064_MAINTAINER_DEFENSE=PASS')
          PY

      - name: Deterministic evidence regeneration twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aud064-regen1 /tmp/aud064-regen2
          PYTHONPATH=senecio_polymarket python senecio_polymarket/scripts/aud064_generate_evidence.py --out /tmp/aud064-regen1
          PYTHONPATH=senecio_polymarket python senecio_polymarket/scripts/aud064_generate_evidence.py --out /tmp/aud064-regen2
          diff -ru /tmp/aud064-regen1 /tmp/aud064-regen2
          echo 'AUD064_EVIDENCE_DETERMINISTIC=PASS'

      - name: Publication sanitization
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(git diff --name-only "$BASE_SHA"...HEAD | grep -E '\.(py|md|json|ya?ml)$' || true)
          detect-secrets --version
          detect-secrets scan "${targets[@]}" > /tmp/aud064-secrets.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.load(open('/tmp/aud064-secrets.json'))
          safe_hash=re.compile(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])|(?<![0-9a-f])[0-9a-f]{64}(?![0-9a-f])')
          unresolved=[]
          for filename,findings in data.get('results',{}).items():
              lines=Path(filename).read_text(encoding='utf-8',errors='replace').splitlines()
              for finding in findings:
                  n=int(finding['line_number']); line=lines[n-1] if 0<n<=len(lines) else ''
                  if safe_hash.search(line) or 'aud064_test_only_placeholder' in line or 'example.invalid' in line:
                      continue
                  unresolved.append((filename,n,finding.get('type')))
          assert not unresolved, unresolved
          dangerous=re.compile(r'(-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|\bgh[pousr]_[A-Za-z0-9_]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b|\bsk-[A-Za-z0-9_-]{20,}\b|\bsb_secret_[A-Za-z0-9_-]{20,}\b|\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b)')
          for filename in Path('/tmp/aud064-changed.txt').read_text().splitlines():
              p=Path(filename)
              if p.is_file():
                  assert dangerous.search(p.read_text(encoding='utf-8',errors='replace')) is None, filename
          print('AUD064_CONFIRMED_SECRETS=0')
          print('AUD064_PUBLICATION_PII=PASS')
          PY

      - name: Upload exact-head evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aud-064-finalize-exact-head-${{ env.CANDIDATE_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/aud064-focused.log
            /tmp/aud061-learning.log
            /tmp/aud063-preservation.log
            /tmp/aud064-full.log
            /tmp/aud064-secrets.json
            /tmp/aud064-regen1/*
