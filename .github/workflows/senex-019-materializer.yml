name: SENEX 019 One-Shot Materializer

on:
  push:
    branches:
      - feat/senex-external-research-pack-v1
    paths:
      - ".github/workflows/senex-019-materializer.yml"

permissions:
  contents: write

concurrency:
  group: senex-019-materializer
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/senex-external-research-pack-v1
  PARENT_018_SHA: 2f84a38d6037c8e5a94bc96566b791a9d4f4e680

jobs:
  materialize-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact isolated branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git merge-base "${PARENT_018_SHA}" HEAD)" = "${PARENT_018_SHA}"
          git diff --check "${PARENT_018_SHA}...HEAD"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install exact existing lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r polymarket/requirements-h011-v3.txt

      - name: Remove temporary workflow and materialize final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/senex-019-materializer.yml
          python tools/build_external_research_pack.py | tee /tmp/external-pack-build.json
          python tools/verify_repository_contract.py --generate | tee /tmp/governance-generate.json
          python -m compileall -q polymarket/research_pack tests/research_pack tools/build_external_research_pack.py
          PYTHONPATH=.:polymarket python -m pytest -q tests/research_pack tests/signal_lab tests/governance
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/paper-only.json
          git diff --check
          (cd research/external_pack && sha256sum -c external_source_manifest.json.sha256 && sha256sum -c provenance_ledger.json.sha256)

      - name: Commit final deterministic 019 tree on isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senex-order019-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add research/external_pack governance
          git add -u .github/workflows/senex-019-materializer.yml
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m "chore(research-pack): materialize deterministic external evidence"
          test "$(git merge-base "${PARENT_018_SHA}" HEAD)" = "${PARENT_018_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"
