name: SENEX Independent Build Evidence Correction Once

on:
  push:
    branches:
      - fix/senex-arm64-reproducible-runtime-v2
    paths:
      - .github/workflows/senex-independent-build-evidence-correction-once.yml

permissions:
  contents: write

jobs:
  correct-regenerate-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-reproducible-runtime-v2
          persist-credentials: true

      - name: Apply and validate independent evidence transform
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_pr30_independent_build_evidence.py
          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 -m py_compile \
            tools/verify_h011_shell_harness.py \
            tools/verify_h011_oci_build_evidence.py
          python3 tools/verify_h011_oci_build_evidence.py --self-test \
            > /tmp/oci-build-evidence-self-test.json
          python3 tools/verify_h011_shell_harness.py \
            --script tools/verify_h011_arm64_reproducibility.sh \
            --output /tmp/harness-static.json
          bash tools/verify_h011_arm64_reproducibility.sh \
            --self-test /tmp/harness-self-test
          (cd /tmp/harness-self-test && sha256sum -c SHA256SUMS)
          grep -q '"status": "PASS"' /tmp/oci-build-evidence-self-test.json
          grep -q '"status": "PASS"' /tmp/harness-static.json

      - name: Remove temporary files and regenerate governance
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/senex-independent-build-evidence-correction-once.yml \
            tools/apply_pr30_independent_build_evidence.py
          test -z "$(git ls-files .github/workflows/senex-independent-build-evidence-correction-once.yml)"
          test -z "$(git ls-files tools/apply_pr30_independent_build_evidence.py)"
          git add \
            .github/workflows/h011-arm64-reproducibility.yml \
            tools/verify_h011_arm64_reproducibility.sh \
            tools/verify_h011_shell_harness.py \
            tools/verify_h011_oci_build_evidence.py \
            docs/H011_REPRODUCIBLE_RUNTIME.md
          python3 tools/verify_repository_contract.py --generate \
            > /tmp/senex-governance-generation.json
          git add \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          git diff --check --cached
          (cd governance && sha256sum -c repository_manifest.json.sha256)

      - name: Commit independent canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'test(senex): derive build evidence from each OCI image'
          git push origin HEAD:fix/senex-arm64-reproducible-runtime-v2
