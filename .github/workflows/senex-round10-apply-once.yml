name: SENEX Round 10 Publish Non-Workflow Once

on:
  push:
    branches:
      - fix/senex-arm64-evidence-pinning-v3
    paths:
      - .github/workflows/senex-round10-apply-once.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-non-workflow-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-evidence-pinning-v3
          persist-credentials: true

      - name: Download and verify validated final tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          zip="$RUNNER_TEMP/round10-final-tree.zip"
          bundle="$RUNNER_TEMP/round10-final-tree"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$zip" \
            "https://api.github.com/repos/simonkey888/SeneX-Prophet/actions/artifacts/8953954257/zip"
          printf '%s  %s\n' \
            'bfb835df35b8d99bccd56d3b8a4fdb3f3d0c61306c5d5b3f1535c4fc82518ec9' \
            "$zip" | sha256sum -c -
          mkdir -p "$bundle"
          unzip -q "$zip" -d "$bundle"
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          cmp -s \
            .github/workflows/h011-arm64-reproducibility.yml \
            "$bundle/.github/workflows/h011-arm64-reproducibility.yml"
          grep -qx 'TEMPORARY_FILES_INCLUDED=NO' "$bundle/materialization.env"

      - name: Publish only validated non-workflow files
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/round10-final-tree"
          cp "$bundle/tools/verify_h011_arm64_reproducibility.sh" \
            tools/verify_h011_arm64_reproducibility.sh
          cp "$bundle/tools/verify_h011_shell_harness.py" \
            tools/verify_h011_shell_harness.py
          cp "$bundle/docs/H011_REPRODUCIBLE_RUNTIME.md" \
            docs/H011_REPRODUCIBLE_RUNTIME.md
          cp "$bundle/governance/repository_manifest.json" \
            governance/repository_manifest.json
          cp "$bundle/governance/repository_manifest.json.sha256" \
            governance/repository_manifest.json.sha256
          cp "$bundle/governance/target_architecture.yaml" \
            governance/target_architecture.yaml
          cp "$bundle/governance/component_registry.json" \
            governance/component_registry.json
          cp "$bundle/governance/migration_map.json" \
            governance/migration_map.json
          git rm -f tools/apply_round10_arm64_pinning.py
          git add \
            tools/verify_h011_arm64_reproducibility.sh \
            tools/verify_h011_shell_harness.py \
            docs/H011_REPRODUCIBLE_RUNTIME.md \
            governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json
          git diff --check --cached
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git config user.name senex-arq
          git config user.email senex-arq@users.noreply.github.com
          git commit -m 'fix(senex): bind ARM64 evidence to candidate and immutable tools'
          git push origin HEAD:fix/senex-arm64-evidence-pinning-v3
