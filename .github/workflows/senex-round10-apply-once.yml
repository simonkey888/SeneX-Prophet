name: SENEX Round 10 Materialize Once

on:
  push:
    branches:
      - fix/senex-arm64-evidence-pinning-v3
    paths:
      - .github/workflows/senex-round10-apply-once.yml

permissions:
  contents: read

jobs:
  materialize-validated-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/senex-arm64-evidence-pinning-v3
          persist-credentials: false

      - name: Apply scoped correction and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_round10_arm64_pinning.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('HEAD^{{tree}}', 'HEAD^{tree}')
          text = text.replace(
              '    "--driver-opt \\"image=$BUILDKIT_REFERENCE\\"",\\n',
              '    \'--driver-opt "image=$BUILDKIT_REFERENCE"\',\\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile tools/apply_round10_arm64_pinning.py
          python3 tools/apply_round10_arm64_pinning.py
          bash -n tools/verify_h011_arm64_reproducibility.sh
          python3 -m py_compile \
            tools/verify_h011_shell_harness.py \
            tools/verify_h011_oci_build_evidence.py
          python3 tools/verify_h011_shell_harness.py \
            --script tools/verify_h011_arm64_reproducibility.sh \
            --output /tmp/round10-harness-static.json
          rm -rf /tmp/round10-harness-self-test
          bash tools/verify_h011_arm64_reproducibility.sh \
            --self-test /tmp/round10-harness-self-test
          (cd /tmp/round10-harness-self-test && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json
          report=json.load(open('/tmp/round10-harness-self-test/harness-self-test.json'))
          assert report['status']=='PASS'
          assert report['controlled_failure_artifact_checksums']=='PASS'
          assert report['pr_event_candidate_identity']=='PASS'
          audit=json.load(open('/tmp/round10-harness-static.json'))
          assert audit['status']=='PASS', audit
          PY

      - name: Generate governance and bundle exact files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/verify_repository_contract.py --generate \
            > /tmp/round10-governance-generation.json
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          bundle="$RUNNER_TEMP/round10-final-tree"
          mkdir -p \
            "$bundle/.github/workflows" \
            "$bundle/tools" \
            "$bundle/docs" \
            "$bundle/governance"
          cp .github/workflows/h011-arm64-reproducibility.yml \
            "$bundle/.github/workflows/"
          cp tools/verify_h011_arm64_reproducibility.sh \
            tools/verify_h011_shell_harness.py \
            "$bundle/tools/"
          cp docs/H011_REPRODUCIBLE_RUNTIME.md "$bundle/docs/"
          cp governance/repository_manifest.json \
            governance/repository_manifest.json.sha256 \
            governance/target_architecture.yaml \
            governance/component_registry.json \
            governance/migration_map.json \
            "$bundle/governance/"
          cp /tmp/round10-harness-static.json "$bundle/"
          cp /tmp/round10-harness-self-test/harness-self-test.json "$bundle/"
          cp /tmp/round10-governance-generation.json "$bundle/"
          {
            printf 'BASE_SHA=d907decf233f80e4a07238b6e72383cfd4204a18\n'
            printf 'QEMU_BINFMT_DIGEST=sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0\n'
            printf 'BUILDKIT_DIGEST=sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec\n'
            printf 'TEMPORARY_FILES_INCLUDED=NO\n'
          } > "$bundle/materialization.env"
          (cd "$bundle" && find . -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          (cd "$bundle" && sha256sum -c SHA256SUMS)

      - name: Upload checksummed final tree
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-round10-final-tree-${{ github.sha }}
          path: ${{ runner.temp }}/round10-final-tree
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
