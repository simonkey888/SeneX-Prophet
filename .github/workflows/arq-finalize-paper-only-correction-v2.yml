name: ARQ Finalize Paper-Only Correction V2

on:
  push:
    branches:
      - audit/h011-northflank-readonly-inspection
    paths:
      - .github/workflows/arq-finalize-paper-only-correction-v2.yml

permissions:
  contents: write

env:
  CORRECTION_BRANCH: fix/senex-paper-only-repository-20260805

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ env.CORRECTION_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Regenerate and verify exact corrected tree
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/${CORRECTION_BRANCH} | awk '{print $1}')"
          test "$(git rev-parse HEAD)" = "$remote_sha"
          python -m pip install --upgrade pip
          python -m pip install -r polymarket/requirements-h011-v3.txt
          python tools/verify_repository_contract.py --generate
          python tools/verify_paper_only_repository.py \
            --repo-root . --output /tmp/paper-only-v2.json
          PYTHONPATH=.:polymarket python -m pytest -q \
            tests/governance tests/operations tests/paper_trial tests/monitoring
          PYTHONPATH=.:polymarket python -m pytest -q tests/h011_v3 tests/cp
          (cd governance && sha256sum -c repository_manifest.json.sha256)
          git diff --check
          rm -rf polymarket/results

      - name: Commit deterministic manifests
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "SENEX ARQ"
          git config user.email "senex-arq@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "governance(senex): bind manifests to quarantined oracle tree"
            git push origin "HEAD:refs/heads/${CORRECTION_BRANCH}"
          fi
          printf 'FINAL_HEAD=%s\nFINAL_TREE=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            | tee /tmp/correction-v2-identity.txt

      - name: Upload finalization evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-paper-only-correction-v2-${{ github.sha }}
          path: |
            /tmp/paper-only-v2.json
            /tmp/correction-v2-identity.txt
          retention-days: 30
          if-no-files-found: error
