name: AUD-068 Prospective Probability Exact Head

on:
  push:
    branches: [research/aud-068-prospective-probability-v1]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aud-068-prospective-probability.yml'
      - 'tools/audit/aud068_prospective_probability.py'
      - 'tests/audit/test_aud068_prospective_probability.py'
      - 'docs/evidence/aud-068/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 43c8023d3a4623381e45da02d9efa8e9b5888f47
  BASE_TREE: 20ec5775ea37a7288e8cd8748ea304843d9b0866
  CAPTURE: docs/evidence/aud-068/current-capture.json
  GENERATED: docs/evidence/aud-068/generated

jobs:
  prospective-probability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Assert exact head base and AUD-068-only scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          bad="$(git diff --name-only "$BASE_SHA...HEAD" | grep -Ev '^(\.github/workflows/aud-068-prospective-probability\.yml|tools/audit/aud068_prospective_probability\.py|tests/audit/test_aud068_prospective_probability\.py|docs/evidence/aud-068/)' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! git diff --name-only "$BASE_SHA...HEAD" | grep -Eiq 'runtime017|runtime_017|senex-017|senecio_polymarket/backend|senecio_polymarket/oracle_runtime|senecio_polymarket/oracle/'
          git diff --check "$BASE_SHA...HEAD"
          echo PRODUCTION_MUTATION=0
          echo SUPABASE_MUTATION=0
          echo NORTHFLANK_MUTATION=0
          echo RUNTIME017_MUTATION=0
          echo THRESHOLD_TUNING=0
          echo BASE_WEIGHT_TUNING=0
          echo REAL_TRADING=0
          echo OUTGOING_SPEND_USD=0

      - name: Run prospective contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aud068"
          python -m unittest -v tests/audit/test_aud068_prospective_probability.py 2>&1 | tee "$RUNNER_TEMP/aud068/tests.log"
          grep -F 'Ran 12 tests' "$RUNNER_TEMP/aud068/tests.log"
          grep -F 'OK' "$RUNNER_TEMP/aud068/tests.log"
          python -m py_compile tools/audit/aud068_prospective_probability.py tests/audit/test_aud068_prospective_probability.py 2>&1 | tee "$RUNNER_TEMP/aud068/compile.log"
          python tools/audit/aud068_prospective_probability.py --self-test 2>&1 | tee "$RUNNER_TEMP/aud068/self-test.log"

      - name: Materialize current prospective evidence from frozen bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GENERATED" && mkdir -p "$GENERATED"
          python tools/audit/aud068_prospective_probability.py --input "$CAPTURE" --out "$GENERATED/PROSPECTIVE_VALIDATION.json" 2>&1 | tee "$RUNNER_TEMP/aud068/materialize.log"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          e=Path(os.environ['GENERATED'])
          d=json.loads((e/'PROSPECTIVE_VALIDATION.json').read_text())
          assert d['order']=='AUD-068'
          assert d['authority_comment']==5346442886
          assert d['cohort_start_ts']=='2026-08-19T18:44:53Z'
          assert d['current_prospective_n']==0
          assert d['prospective_eval_status']=='WARMUP'
          assert d['probability_semantics_validated']=='NO'
          assert d['terminal_metrics'] is None
          assert d['selected_rows']==[]
          assert len(d['selected_cohort_sha256'])==64
          assert any(x.get('id')==1246 and x.get('reason')=='PREDICTION_NOT_DIRECTIONAL' for x in d['excluded_rows'])
          assert d['calibration_or_tuning_performed'] is False
          assert d['production_mutation']==0 and d['runtime017_mutation']==0
          (e/'CURRENT_STATUS.txt').write_text('CURRENT_PROSPECTIVE_N=0\nPROSPECTIVE_EVAL_STATUS=WARMUP\nPROBABILITY_SEMANTICS_VALIDATED=NO\n')
          (e/'CI_EXACT_HEAD.json').write_text(json.dumps({'source_sha':os.environ.get('GITHUB_SHA'),'run_id':os.environ.get('GITHUB_RUN_ID'),'job':os.environ.get('GITHUB_JOB'),'exact_head_required':True},sort_keys=True,indent=2)+'\n')
          (e/'CAPTURE_SHA256.txt').write_text(hashlib.sha256(Path(os.environ['CAPTURE']).read_bytes()).hexdigest()+'\n')
          print('CURRENT_CAPTURE_CONTRACT=PASS')
          PY

      - name: Secret scan logs and evidence then seal manifest
        shell: bash
        run: |
          set -euo pipefail
          P='(-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9._-]{16,})'
          ! grep -RIE --binary-files=without-match "$P" "$CAPTURE" "$GENERATED" "$RUNNER_TEMP/aud068"
          printf 'PASS capture+evidence+logs; secret values never emitted\n' > "$GENERATED/SECRET_SCAN.txt"
          cp "$RUNNER_TEMP/aud068/tests.log" "$GENERATED/tests.log"
          cp "$RUNNER_TEMP/aud068/compile.log" "$GENERATED/compile.log"
          cp "$RUNNER_TEMP/aud068/self-test.log" "$GENERATED/self-test.log"
          cp "$RUNNER_TEMP/aud068/materialize.log" "$GENERATED/materialize.log"
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          e=Path(os.environ['GENERATED'])
          files=sorted(p for p in e.iterdir() if p.is_file() and p.name!='MANIFEST.sha256')
          (e/'MANIFEST.sha256').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          for line in (e/'MANIFEST.sha256').read_text().splitlines():
              h,n=line.split('  ',1)
              assert hashlib.sha256((e/n).read_bytes()).hexdigest()==h
          required={'PROSPECTIVE_VALIDATION.json','CURRENT_STATUS.txt','CI_EXACT_HEAD.json','CAPTURE_SHA256.txt','SECRET_SCAN.txt','tests.log','compile.log','self-test.log','materialize.log','MANIFEST.sha256'}
          assert required <= {p.name for p in e.iterdir()}
          print('EVIDENCE_MANIFEST=PASS')
          PY

      - name: Upload exact-head prospective evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aud-068-${{ github.event.pull_request.head.sha || github.sha }}
          path: docs/evidence/aud-068/generated/
          if-no-files-found: error
          retention-days: 14

      - name: Terminal contract gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['GENERATED'],'PROSPECTIVE_VALIDATION.json').read_text())
          assert d['prospective_eval_status'] in {'WARMUP','MATURE'}
          assert d['probability_semantics_validated']=='NO'
          if d['prospective_eval_status']=='WARMUP':
              assert d['terminal_metrics'] is None
          else:
              assert d['mature_prefix_n'] is not None and d['terminal_metrics'] is not None
          print('AUD_068_VALIDATOR_CONTRACT=PASS')
          PY
