name: AUD057 Corrective Patch Bootstrap

on:
  push:
    branches:
      - fix/aud-057-symbol-scope

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AUD-057 branch
        uses: actions/checkout@v4
        with:
          ref: fix/aud-057-symbol-scope
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply AUD-057 minimal delta
        run: python tools/aud057_apply.py

      - name: Install dependencies
        run: pip install -r senecio_polymarket/requirements.txt

      - name: Focused AUD-057 regression
        working-directory: senecio_polymarket
        run: python -m unittest discover -s tests -p 'test_aud_057.py' -v

      - name: Commit corrective source changes
        run: |
          git config user.name 'AUD-057 automation'
          git config user.email 'aud057@users.noreply.github.com'
          git add senecio_polymarket/backend/oracle_runner.py \
                  senecio_polymarket/backend/authoritative_score.py \
                  senecio_polymarket/tests/test_aud_057.py
          git diff --cached --check
          git commit -m 'fix: isolate runtime stats by symbol'
          git push origin HEAD:fix/aud-057-symbol-scope
