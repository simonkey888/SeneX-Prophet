name: AUD-063 One-Shot Source Patch

on:
  push:
    branches:
      - audit/aud-063-settlement-starvation-recovery

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[AUD063_PATCHED]') && !contains(github.event.head_commit.message, '[AUD063_FINAL]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Verify immutable base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 49c5f0a69609c005da80e48b585e91d8582a5ac6 HEAD
          test "$(git rev-parse '49c5f0a69609c005da80e48b585e91d8582a5ac6^{tree}')" = "3e323bcc2795f97b29242883d3bf2a015c092ccd"

      - name: Apply bounded source patch
        run: python senecio_polymarket/scripts/aud063_apply_source_patch.py

      - name: Compile changed source
        run: python -m compileall -q senecio_polymarket/backend

      - name: Commit one-shot result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senex-aud063-bot"
          git config user.email "actions@users.noreply.github.com"
          git add senecio_polymarket/backend/supabase_client.py senecio_polymarket/backend/oracle_runner.py
          git diff --cached --check
          git commit -m "[AUD063_PATCHED] fix starvation-safe causal settlement path"
          git push origin HEAD:audit/aud-063-settlement-starvation-recovery
