name: SENEX Signal Lab Governance Materializer

on:
  pull_request:
    branches:
      - feat/h011-v3-discovery-refresh
    paths:
      - ".github/workflows/senex-signal-lab-dev-validation.yml"

permissions:
  contents: write

concurrency:
  group: senex-signal-lab-governance-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  materialize-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact isolated branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ env.HEAD_BRANCH }}

      - name: Verify authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_SHA}"
          test "${BASE_SHA}" = "74429bb0dfd36a24ec01f0b94856603a9298ab37"
          test "${HEAD_BRANCH}" = "feat/senex-signal-lab-live-terminal-v1"
          test "$(git merge-base "${BASE_SHA}" "${EXACT_SHA}")" = "${BASE_SHA}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Remove temporary materializer and generate final deterministic governance
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/senex-signal-lab-dev-validation.yml
          python tools/verify_repository_contract.py --generate
          git diff --check
          test "$(python - <<'PY'
          import json
          print(json.load(open('governance/repository_manifest.json'))['files_tracked_total'])
          PY
          )" = "310"

      - name: Commit final generated governance on isolated 018 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senex-order018-governance"
          git config user.email "actions@users.noreply.github.com"
          git add governance/component_registry.json governance/migration_map.json governance/repository_manifest.json governance/repository_manifest.json.sha256 governance/target_architecture.yaml
          git diff --cached --quiet && { echo "NO_GENERATED_CHANGE"; exit 1; }
          git commit -m "chore(signal-lab): materialize deterministic governance inventory"
          test "$(git rev-parse --abbrev-ref HEAD)" = "${HEAD_BRANCH}"
          git push origin "HEAD:${HEAD_BRANCH}"
