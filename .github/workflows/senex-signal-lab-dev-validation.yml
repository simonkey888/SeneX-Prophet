name: SENEX Signal Lab Dev Validation

on:
  pull_request:
    branches:
      - feat/h011-v3-discovery-refresh
    paths:
      - "polymarket/signal_lab/**"
      - "tests/signal_lab/**"
      - "docs/SENEX_SIGNAL_LAB_V1.md"
      - "governance/**"
      - ".github/workflows/senex-signal-lab-dev-validation.yml"

permissions:
  contents: read

concurrency:
  group: senex-signal-lab-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  signal-lab-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXACT_SHA }}

      - name: Verify isolated base and exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_SHA}"
          test "${{ github.event.pull_request.base.ref }}" = "feat/h011-v3-discovery-refresh"
          test "${BASE_SHA}" = "74429bb0dfd36a24ec01f0b94856603a9298ab37"
          test "$(git merge-base "${BASE_SHA}" "${EXACT_SHA}")" = "${BASE_SHA}"
          git diff --check "${BASE_SHA}...${EXACT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install exact CI lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r polymarket/requirements-h011-v3.txt

      - name: Signal Lab focused gates
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q polymarket/signal_lab tests/signal_lab
          PYTHONPATH=.:polymarket python -m pytest -q tests/signal_lab
          python tools/verify_paper_only_repository.py --repo-root . --output /tmp/paper-only.json

      - name: Generate deterministic governance inventory candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_repository_contract.py --generate > /tmp/generate.json
          mkdir -p /tmp/signal-lab-governance
          cp governance/repository_manifest.json /tmp/signal-lab-governance/
          cp governance/repository_manifest.json.sha256 /tmp/signal-lab-governance/
          cp governance/component_registry.json /tmp/signal-lab-governance/
          cp governance/migration_map.json /tmp/signal-lab-governance/
          cp governance/target_architecture.yaml /tmp/signal-lab-governance/
          cp /tmp/generate.json /tmp/signal-lab-governance/
          (cd /tmp/signal-lab-governance && sha256sum * > SHA256SUMS)

      - name: Upload deterministic governance candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senex-signal-lab-governance-${{ env.EXACT_SHA }}
          path: /tmp/signal-lab-governance
          retention-days: 7
          if-no-files-found: error
